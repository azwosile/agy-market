/* ==========================================================================
   AGY Market v1.2 — Aurora Prism Optical Glass Stylesheet (`src/ui/styles.css`)
   Zero external dependencies. Crafted for Dark Obsidian, Light Alabaster, and
   translucent Wallpaper Prism host surfaces via host CSS variable inheritance.
   ========================================================================== */

:root {
  --m-font: var(
    --font-sans,
    'Google Sans Flex',
    'Google Sans',
    'Inter',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    'Noto Sans SC',
    'PingFang SC',
    'Microsoft YaHei UI',
    system-ui,
    sans-serif
  );
  --m-mono: var(
    --font-mono,
    'Google Sans Code',
    'JetBrains Mono',
    'Cascadia Code',
    'SF Mono',
    Consolas,
    ui-monospace,
    monospace
  );

  /* Radii & spring motion tokens */
  --m-r-xs: 6px;
  --m-r-sm: 9px;
  --m-r-md: 12px;
  --m-r-lg: 16px;
  --m-r-xl: 20px;
  --m-r-pill: 999px;

  --m-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --m-ease-spring: cubic-bezier(0.22, 1.15, 0.36, 1);
  --m-dur-fast: 140ms;
  --m-dur-base: 220ms;
  --m-dur-slow: 300ms;

  /* Host-inherited base palette (Dark Obsidian Aurora defaults) */
  --m-bg-raw: var(--color-background-primary, var(--vscode-editor-background, #080a12));
  --m-surface-raw: var(--color-background-secondary, var(--vscode-sideBar-background, #111625));
  --m-surface-2-raw: var(--color-background-tertiary, #182034);
  --m-border-raw: var(--color-border-primary, rgba(255, 255, 255, 0.09));
  --m-text: var(--color-text-primary, var(--vscode-foreground, #f4f7ff));
  --m-text-2: #cfd8ea;
  --m-muted: var(--color-text-secondary, #93a3be);
  --m-faint: #677692;

  /* Glassmorphic layered surfaces (translucent wallpaper compatible) */
  --m-sticky-bg: color-mix(in srgb, var(--m-bg-raw) 66%, transparent);
  --m-stuck-bg: color-mix(in srgb, var(--m-bg-raw) 92%, #060810);
  --m-chrome-bg: var(--m-sticky-bg);
  --m-card-bg: color-mix(in srgb, var(--m-surface-raw) 76%, transparent);
  --m-card-bg-hover: color-mix(in srgb, var(--m-surface-2-raw) 86%, transparent);
  --m-dock-bg: color-mix(in srgb, var(--m-bg-raw) 56%, rgba(6, 9, 18, 0.36));
  --m-inset-bg: color-mix(in srgb, var(--m-bg-raw) 62%, rgba(0, 0, 0, 0.28));
  --m-sheet-bg: color-mix(in srgb, var(--m-surface-raw) 93%, #060810);
  --m-ctl-bg: rgba(255, 255, 255, 0.055);
  --m-ctl-hover: rgba(255, 255, 255, 0.105);
  --m-hairline: rgba(255, 255, 255, 0.09);
  --m-hairline-strong: rgba(255, 255, 255, 0.16);
  --m-specular: rgba(255, 255, 255, 0.12);
  --m-sheen: linear-gradient(
    165deg,
    rgba(255, 255, 255, 0.068) 0%,
    rgba(255, 255, 255, 0.015) 42%,
    rgba(255, 255, 255, 0) 100%
  );

  /* Aurora Prism accents (Dark calibrated) */
  --m-accent: #6366f1;
  --m-accent-bright: #a5b4fc;
  --m-accent-hover: #4f46e5;
  --m-accent-soft: rgba(99, 102, 241, 0.16);
  --m-accent-border: rgba(129, 140, 248, 0.4);

  --m-violet: #a855f7;
  --m-violet-soft: rgba(168, 85, 247, 0.16);
  --m-violet-border: rgba(192, 132, 252, 0.38);

  --m-sky: #38bdf8;
  --m-sky-solid: #0284c7;
  --m-sky-hover: #0369a1;
  --m-sky-soft: rgba(56, 189, 248, 0.15);
  --m-sky-border: rgba(56, 189, 248, 0.38);

  --m-ok: #34d399;
  --m-ok-solid: #10b981;
  --m-ok-soft: rgba(16, 185, 129, 0.15);
  --m-ok-border: rgba(52, 211, 153, 0.34);

  --m-warn: #fbbf24;
  --m-warn-soft: rgba(245, 158, 11, 0.15);

  --b-subtle-bd: rgba(148, 163, 184, 0.24);

    0 2px 6px rgba(0, 0, 0, 0.28);
  --m-shadow-hover:

  --m-shadow-sheet: -16px 0 54px rgba(0, 0, 0, 0.62);

  --m-backdrop: rgba(4, 7, 16, 0.62);
  --m-aura-1: rgba(99, 102, 241, 0.2);
  --m-aura-2: rgba(168, 85, 247, 0.14);
  --m-aura-3: rgba(6, 182, 212, 0.14);
  --m-skel-base: rgba(255, 255, 255, 0.055);
  --m-skel-shine: rgba(255, 255, 255, 0.12);

  --m-toggle-off-bg: rgba(148, 163, 184, 0.22);
  --m-toggle-off-bd: rgba(255, 255, 255, 0.12);
  --m-toggle-thumb: #ffffff;

html,
body,
#app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--m-bg-raw);
  color: var(--m-text);
  font-family: var(--m-font);
  font-size: 13px;
  line-height: 1.48;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ==========================================================================
   Aurora Prism Nebula Canvas & Container-Query Shell
   ========================================================================== */

.market-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  container-type: inline-size;
  container-name: market;
  background:
    radial-gradient(740px 380px at 88% -10%, var(--m-aura-1), transparent 68%),
    radial-gradient(620px 340px at 10% -8%, var(--m-aura-3), transparent 64%),
    radial-gradient(540px 320px at 52% 108%, var(--m-aura-2), transparent 68%),
    var(--m-bg-raw);
}

.market-shell::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(99, 102, 241, 0.72) 24%,
    rgba(168, 85, 247, 0.78) 50%,
    rgba(56, 189, 248, 0.78) 76%,
    transparent 100%
  );
  opacity: 0.85;
  pointer-events: none;
  z-index: 35;
}

/* Custom sleek scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--m-hairline-strong);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--m-faint);
}

.ui-ico {
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

.spin {
  animation: agy-spin 0.85s linear infinite;
}

@keyframes agy-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes agy-pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.45;
    transform: scale(0.84);
  }
}

@keyframes agy-aurora-drift {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(18px, -10px, 0) scale(1.04);
  }
}

@keyframes agy-shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

@keyframes agy-drawer-in {
  from {
    opacity: 0.5;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes agy-modal-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.975);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes agy-toast-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes agy-bar-slide {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(220%);
  }
}

/* ==========================================================================
   Aurora Prism Header & 4-Tab Segmented Navigation
   ========================================================================== */

.app-header {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 11px 16px 10px;
  background: var(--m-sticky-bg);
  backdrop-filter: blur(20px) saturate(155%);
  -webkit-backdrop-filter: blur(20px) saturate(155%);
  border-bottom: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular);
  flex-shrink: 0;
  z-index: 25;
  transition: background var(--m-dur-base) var(--m-ease-out), box-shadow var(--m-dur-base) var(--m-ease-out);
}

.market-shell[data-stuck="true"] .app-header {
  background: var(--m-stuck-bg);
  box-shadow: inset 0 1px 0 var(--m-specular), 0 8px 22px -10px rgba(0, 0, 0, 0.36);
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.45));
}

.brand-mark svg {
  width: 30px;
  height: 30px;
  display: block;
}

.brand-copy {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.brand-title {

   ========================================================================== */

.filter-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;

  flex-shrink: 0;
  transition: background var(--m-dur-base) var(--m-ease-out);
  z-index: 20;

.market-shell[data-stuck="true"] .filter-bar {
  background: var(--m-stuck-bg);
}

.filter-row-top {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  flex: 1 1 200px;
  display: flex;
  align-items: center;
}

.search-box .search-ico {
  position: absolute;
  left: 11px;
  color: var(--m-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 33px;
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 10px;
  padding: 0 34px 0 32px;
  font-family: inherit;
  font-size: 12.2px;
  outline: none;
  transition:
    border-color var(--m-dur-fast) var(--m-ease-out),
    box-shadow var(--m-dur-fast) var(--m-ease-out),
    background var(--m-dur-fast) var(--m-ease-out);

.search-input::placeholder {
  color: var(--m-faint);
}

.search-input:focus {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg);
  box-shadow: 0 0 0 3px var(--m-accent-soft);
}

.search-clear {
  position: absolute;
  right: 6px;
  border: none;
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}

.search-clear:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.search-kbd {
  position: absolute;
  right: 9px;
  font-family: var(--m-mono);
  font-size: 10px;
  color: var(--m-faint);
  border: 1px solid var(--m-hairline);
  border-radius: 4px;
  padding: 0 4.5px;
  line-height: 16px;
  pointer-events: none;
}

.select-input,
.text-input {
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 9px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), box-shadow var(--m-dur-fast) var(--m-ease-out);
}

.select-input {
  height: 33px;
  cursor: pointer;
}

.select-input:focus,
.text-input:focus {
  border-color: var(--m-accent-border);
  box-shadow: 0 0 0 3px var(--m-accent-soft);
}

.track2-pill {
  height: 33px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10.5px;
  border-radius: 9px;
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: all var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.track2-pill:hover {
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.track2-pill.enabled {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.track2-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.switch-track {
  width: 24px;
  height: 14px;
  border-radius: 999px;
  background: var(--m-hairline-strong);
  position: relative;
  transition: background var(--m-dur-fast) var(--m-ease-out);
  flex-shrink: 0;
}

.switch-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  transition: transform var(--m-dur-fast) var(--m-ease-spring);
}

.track2-pill.enabled .switch-track {
  background: var(--m-warn);
}

.track2-pill.enabled .switch-track::after {
  transform: translateX(10px);
}

/* Category horizontal chip strip */
.chip-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.chip-strip::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  padding: 4.5px 11px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.cat-chip:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.cat-chip.active {
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
  font-weight: 650;
  box-shadow: inset 0 1px 0 var(--m-specular);
}

.cat-chip-n {
  font-size: 10px;
  opacity: 0.78;
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   Main Scroll Area & Quick Update Strips
   ========================================================================== */

.main-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-anchor: none;
  padding: 15px 16px 56px;
}

.quick-update-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 10px;
  padding: 9px 13px;
  margin-bottom: 13px;
  border-radius: var(--m-r-md);
  background:
    linear-gradient(90deg, var(--m-sky-soft), var(--m-accent-soft)),
    var(--m-card-bg);
  border: 1px solid var(--m-sky-border);
  box-shadow: inset 0 1px 0 var(--m-specular);
  font-size: 12px;
}

.quick-update-left {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--m-text);
  font-weight: 650;
  min-width: 0;
}

.quick-update-left .ui-ico {
  color: var(--m-sky);
}

.quick-update-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Installed / Updates Command Card */
.updates-command-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 13px 15px;
  margin-bottom: 14px;
  border-radius: var(--m-r-lg);
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.updates-command-bar.has-updates {
  border-color: var(--m-sky-border);
  background:
    radial-gradient(360px 140px at 0% 0%, rgba(56, 189, 248, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
}

.updates-command-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.updates-summary {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.updates-summary-title {
  font-size: 13.5px;
  font-weight: 740;
  display: flex;
  align-items: center;
  gap: 7px;
}

.updates-summary-sub {
  font-size: 11.5px;
  color: var(--m-muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.updates-command-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.progress-track {
  height: 3px;
  width: 100%;
  border-radius: 999px;
  background: var(--m-inset-bg);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 45%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--m-accent), var(--m-violet), var(--m-sky));
  animation: agy-bar-slide 1.2s ease-in-out infinite;
}

/* Batch update per-item result report */
.batch-results {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--m-hairline);
}

.batch-results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--m-muted);
}

.batch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6.5px 10px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  font-size: 11.8px;
}

.batch-row.is-ok {
  border-color: var(--m-ok-border);
}

.batch-row.is-warn {
  border-color: var(--m-warn-border);
}

.batch-row.is-err {
  border-color: var(--m-danger-border);
}

.batch-row-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.batch-row-name {
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.batch-row-msg {
  color: var(--m-muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.batch-row-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Rate limit / warning inline banner */
.notice-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-warn-soft);
  border: 1px solid var(--m-warn-border);
  color: var(--m-warn);
  font-size: 11.5px;
}

/* ==========================================================================
   Prismatic Bento Plugin Cards (Per-Category Aura + Pointer Spotlight + Dock)
   ========================================================================== */

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(312px, 1fr));
  gap: 14px;
}

.plugin-card {
  --card-accent: #6366f1;
  --card-accent-2: #06b6d4;
  --mx: 50%;
  --my: 0%;

  position: relative;
  min-width: 0;
  background:
    radial-gradient(280px 150px at 0% 0%, color-mix(in srgb, var(--card-accent) 16%, transparent), transparent 72%),
    radial-gradient(220px 120px at 100% 100%, color-mix(in srgb, var(--card-accent-2) 9%, transparent), transparent 72%),
    var(--m-sheen),
    var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px 15px 12px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  overflow: hidden;
  isolation: isolate;
  backdrop-filter: blur(16px) saturate(145%);
  -webkit-backdrop-filter: blur(16px) saturate(145%);
  box-shadow:
    inset 0 1px 0 var(--m-specular),
    var(--m-shadow-card);
  transition:
    transform var(--m-dur-base) var(--m-ease-out),
    border-color var(--m-dur-base) var(--m-ease-out),
    background var(--m-dur-base) var(--m-ease-out),
    box-shadow var(--m-dur-base) var(--m-ease-out),
    opacity var(--m-dur-base) var(--m-ease-out);
}

/* Pointer-tracking optical spotlight sheen */
.plugin-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    280px circle at var(--mx) var(--my),
    color-mix(in srgb, var(--card-accent) 18%, transparent),
    transparent 65%
  );
  opacity: 0;
  transition: opacity 240ms var(--m-ease-out);
  pointer-events: none;
  z-index: 0;
}

/* Top specular prism accent hairline */
.plugin-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 14px;
  right: 14px;
  height: 1.5px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    color-mix(in srgb, var(--card-accent) 75%, white) 35%,
    color-mix(in srgb, var(--card-accent-2) 70%, white) 68%,
    transparent 100%
  );
  opacity: 0.45;
  transition: opacity var(--m-dur-base) var(--m-ease-out);
  pointer-events: none;
  z-index: 1;
}

.plugin-card > * {
  position: relative;
  z-index: 2;
}

@media (hover: hover) {
  .plugin-card:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--card-accent) 48%, var(--m-hairline-strong));
    box-shadow:
      inset 0 1px 0 var(--m-specular),
      0 0 0 1px color-mix(in srgb, var(--card-accent) 16%, transparent),
      var(--m-shadow-hover);
  }

  .plugin-card:hover::before {
    opacity: 1;
  }

  .plugin-card:hover::after {
    opacity: 0.95;
  }

  .plugin-card.has-update:hover {
    border-color: var(--m-sky);
  }
}

.plugin-card.has-update {
  border-color: var(--m-sky-border);
}

/* Parked / Disabled Standby Card Styling */
.plugin-card.is-parked {
  border-style: dashed;
  border-color: var(--m-hairline-strong);
  background:
    radial-gradient(240px 120px at 0% 0%, color-mix(in srgb, var(--card-accent) 7%, transparent), transparent 72%),
    var(--m-card-bg);
}

.plugin-card.is-parked .plugin-logo-wrap,
.plugin-card.is-parked .card-desc,
.plugin-card.is-parked .badge-row {
  opacity: 0.72;
  filter: saturate(0.6);
}

.plugin-card.is-parked::after {
  opacity: 0.16;
}

.card-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
}

/* 44x44 Squircle Glass Icon Frame + Radial Color Halo */
.plugin-logo-wrap {
  position: relative;
  flex-shrink: 0;
}

.plugin-logo-wrap::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 16px;
  background: radial-gradient(
    circle at 35% 30%,
    color-mix(in srgb, var(--card-accent) 52%, transparent),
    color-mix(in srgb, var(--card-accent-2) 22%, transparent) 58%,
    transparent 76%
  );
  filter: blur(8px);
  opacity: 0.65;
  transition: opacity var(--m-dur-base) var(--m-ease-out), transform var(--m-dur-base) var(--m-ease-out);
  pointer-events: none;
  z-index: 0;
}

@media (hover: hover) {
  .plugin-card:hover .plugin-logo-wrap::before {
    opacity: 0.95;
    transform: scale(1.08);
  }
}

.plugin-logo {
  position: relative;
  z-index: 1;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: linear-gradient(
    140deg,
    color-mix(in srgb, var(--card-accent) 34%, rgba(255, 255, 255, 0.08)) 0%,
    color-mix(in srgb, var(--card-accent-2) 22%, rgba(15, 23, 42, 0.25)) 100%
  );
  border: 1px solid color-mix(in srgb, var(--card-accent) 32%, var(--m-hairline-strong));
  box-shadow:
    inset 0 1px 0 var(--m-specular),
    0 4px 12px -4px color-mix(in srgb, var(--card-accent) 45%, rgba(0, 0, 0, 0.4));
  display: grid;
  place-items: center;
  font-weight: 760;
  font-size: 17px;
  color: var(--m-text);
  flex-shrink: 0;
  overflow: hidden;
}

.plugin-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--m-surface-raw);
}

.plugin-logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.plugin-logo.is-lg {
  width: 52px;
  height: 52px;
  border-radius: 15px;
  font-size: 20px;
}

.card-title-wrap {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

/* 2-Line Graceful Card Title + Clickable GitHub Link (NO single-line ellipsis stub!) */
.card-title-link,
.card-title-text {
  font-weight: 740;
  font-size: 13.8px;
  line-height: 1.32;
  letter-spacing: -0.015em;
  color: var(--m-text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  min-width: 0;
  flex: 1;
}

.card-title-link {
  text-decoration: none;
  cursor: pointer;
  transition: color var(--m-dur-fast) var(--m-ease-out);
}

.card-title-link .title-ext-ico {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  margin-left: 3px;
  color: var(--m-muted);
  opacity: 0.65;
  transition:
    transform var(--m-dur-fast) var(--m-ease-out),
    color var(--m-dur-fast) var(--m-ease-out),
    opacity var(--m-dur-fast) var(--m-ease-out);
}

.card-title-link:hover {
  color: color-mix(in srgb, var(--card-accent) 72%, var(--m-text));
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--card-accent) 45%, transparent);
  text-underline-offset: 3px;
}

.card-title-link:hover .title-ext-ico {
  color: var(--card-accent);
  opacity: 1;
  transform: translate(1.5px, -1.5px);
}

.version-tag {
  font-family: var(--m-mono);
  font-size: 10.5px;
  font-weight: 650;
  color: var(--m-muted);
  background: var(--m-inset-bg);
  padding: 2px 7px;
  border-radius: 7px;
  border: 1px solid var(--m-hairline);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 5.5px;
  font-size: 11px;
  color: var(--m-muted);
  min-width: 0;
  flex-wrap: wrap;
}

.card-slug {
  font-family: var(--m-mono);
  font-size: 10.6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 150px;
}

.meta-sep {
  opacity: 0.42;
  flex-shrink: 0;
}

.meta-star {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
  color: var(--m-text-2);
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}

.meta-star .ui-ico {
  color: #f59e0b;
}

.track-tag {
  font-size: 9.8px;
  font-weight: 650;
  padding: 1px 6px;
  border-radius: var(--m-r-pill);
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
  flex-shrink: 0;
}

.self-running-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 650;
  padding: 1.5px 7px;
  border-radius: var(--m-r-pill);
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  color: var(--m-accent-bright);
  border: 1px solid var(--m-accent-border);
  white-space: nowrap;
}

.state-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 650;
  padding: 1.5px 7px;
  border-radius: var(--m-r-pill);
  flex-shrink: 0;
  white-space: nowrap;
}

.state-pill.is-enabled {
  background: var(--m-ok-soft);
  color: var(--m-ok);
  border: 1px solid var(--m-ok-border);
}

.state-pill.is-disabled {
  background: var(--b-subtle-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.state-pill.is-parked-tag {
  background: rgba(148, 163, 184, 0.14);
  color: var(--m-muted);
  border: 1px dashed var(--m-hairline-strong);
}

.card-desc {
  font-size: 12.2px;
  line-height: 1.56;
  color: var(--m-text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0;
  min-height: 38px;
  cursor: pointer;
}

/* Capability & Activation Badges */
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  cursor: pointer;
}

.cap-badge {
  font-size: 10.4px;
  font-weight: 560;
  padding: 2.5px 8px;
  border-radius: var(--m-r-pill);
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  line-height: 1.3;
}

.cap-badge.tone-green {
  background: var(--b-green-bg);
  color: var(--b-green-fg);
  border-color: var(--b-green-bd);
}
.cap-badge.tone-blue {
  background: var(--b-blue-bg);
  color: var(--b-blue-fg);
  border-color: var(--b-blue-bd);
}
.cap-badge.tone-purple {
  background: var(--b-purple-bg);
  color: var(--b-purple-fg);
  border-color: var(--b-purple-bd);
}
.cap-badge.tone-amber {
  background: var(--b-amber-bg);
  color: var(--b-amber-fg);
  border-color: var(--b-amber-bd);
}
.cap-badge.tone-cyan {
  background: var(--b-cyan-bg);
  color: var(--b-cyan-fg);
  border-color: var(--b-cyan-bd);
}
.cap-badge.tone-orange {
  background: var(--b-orange-bg);
  color: var(--b-orange-fg);
  border-color: var(--b-orange-bd);
}
.cap-badge.tone-subtle {
  background: var(--b-subtle-bg);
  color: var(--b-subtle-fg);
  border-color: var(--b-subtle-bd);
}

.cap-badge.is-more {
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  border-color: var(--m-hairline);
}

/* Activation Requirement Pill (`⚡ 免重启` / `🔄 需重开面板` / `🚀 需重启生效`) */
.act-badge {
  font-size: 10.2px;
  font-weight: 650;
  padding: 2.5px 8px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  gap: 3.5px;
  white-space: nowrap;
  line-height: 1.3;
  border: 1px solid transparent;
}

.act-badge.is-instant {
  background: rgba(16, 185, 129, 0.11);
  color: var(--m-ok);
  border-color: rgba(52, 211, 153, 0.25);
}

.act-badge.is-reload-pane {
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border-color: var(--m-sky-border);
}

.act-badge.is-host-restart {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(168, 85, 247, 0.16));
  color: var(--m-warn);
  border-color: var(--m-warn-border);
}

/* ==========================================================================
   Frosted Bottom Control Dock + Tactile iOS/Linear Toggle Slider
   ========================================================================== */

.card-dock {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding: 7.5px 9.5px;
  border-radius: 12px;
  background: var(--m-dock-bg);
  border: 1px solid var(--m-hairline);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.045),
    inset 0 1px 3px rgba(0, 0, 0, 0.14);
}

.dock-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex-wrap: wrap;
}

.dock-right {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

/* Luxurious iOS / Linear-grade Animated Toggle Slider */
.prism-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 2px 6px 2px 2px;
  border: none;
  background: transparent;
  color: var(--m-text-2);
  font-family: inherit;
  font-size: 11.2px;
  font-weight: 650;
  cursor: pointer;
  border-radius: var(--m-r-pill);
  user-select: none;
  transition: opacity var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out);
}

.prism-toggle:hover:not(:disabled) {
  color: var(--m-text);
}

.prism-toggle:disabled,
.prism-toggle.is-locked {
  cursor: default;
}

.prism-toggle-track {
  position: relative;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--m-toggle-off-bg);
  border: 1px solid var(--m-toggle-off-bd);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
  transition:
    background 220ms var(--m-ease-out),
    border-color 220ms var(--m-ease-out),
    box-shadow 240ms var(--m-ease-out);
  flex-shrink: 0;
}

.prism-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ffffff 0%, #e9eff8 100%);
  box-shadow:
    0 2px 5px rgba(0, 0, 0, 0.34),
    inset 0 1px 0 #ffffff;
  display: grid;
  place-items: center;
  transition: transform 240ms var(--m-ease-spring), box-shadow 220ms var(--m-ease-out);
}

.prism-toggle-thumb-core {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(100, 116, 139, 0.45);
  transition: background 220ms var(--m-ease-out), box-shadow 220ms var(--m-ease-out);
}

.prism-toggle.is-on .prism-toggle-track {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);

    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 0 14px rgba(16, 185, 129, 0.42);

.prism-toggle.is-on .prism-toggle-thumb {

.prism-toggle.is-on .prism-toggle-thumb-core {

}

.prism-toggle.is-on .prism-toggle-label {

.prism-toggle.is-off .prism-toggle-label {

.prism-toggle.is-locked.is-on .prism-toggle-track {

.prism-toggle.is-locked .prism-toggle-label {

.dock-btn {

.dock-btn:hover {

.dock-btn.is-pane {

.ghost-link {

  display: inline-flex;
  align-items: center;
  gap: 4px;

  font-family: inherit;
  transition: background var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out), border-color var(--m-dur-fast) var(--m-ease-out);

.ghost-link:hover {

/* ==========================================================================
   Buttons (Aurora Gradient Primaries & Glass Secondaries)
   ========================================================================== */

.btn {
  border: 1px solid var(--m-hairline-strong);
  background: var(--m-ctl-bg);
  color: var(--m-text);
  padding: 5.5px 12px;
  border-radius: var(--m-r-sm);
  font-family: inherit;
  font-size: 11.8px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--m-specular);
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-accent-border);
}

.btn:active:not(:disabled) {
  transform: scale(0.975);
}

.btn:disabled {

  cursor: default;
}

.btn-sm {
  padding: 4.5px 9.5px;
  font-size: 11px;
  border-radius: 8px;
}

.btn-primary {
  background: linear-gradient(135deg, #6366f1 0%, #7c3aed 55%, #0284c7 100%);
  border-color: rgba(165, 180, 252, 0.5);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 4px 14px -3px rgba(99, 102, 241, 0.5);
}

.btn-primary:hover:not(:disabled) {

  border-color: rgba(199, 210, 254, 0.72);

    inset 0 1px 0 rgba(255, 255, 255, 0.34),

}

.btn-update {
  background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
  border-color: rgba(56, 189, 248, 0.6);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.26),
    0 4px 12px -3px rgba(14, 165, 233, 0.45);
}

.btn-update:hover:not(:disabled) {
  filter: brightness(1.08);
  border-color: rgba(125, 211, 252, 0.75);
}

.btn-update-outline {
  background: var(--m-sky-soft);
  border-color: var(--m-sky-border);
  color: var(--m-sky);
}

@media (hover: hover) {
  .btn-update-outline:hover:not(:disabled) {
    background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
    border-color: rgba(56, 189, 248, 0.7);
    color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 12px rgba(2, 132, 199, 0.34);
  }
}

.btn-fix {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(244, 63, 94, 0.2));

}

.btn-fix:hover:not(:disabled) {
  background: linear-gradient(135deg, #f59e0b 0%, #e11d48 100%);
  border-color: rgba(251, 191, 36, 0.75);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.36);
}

.notes-link {
  border: none;
  background: transparent;
  padding: 0 2px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 650;
  color: var(--m-sky);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  white-space: nowrap;
  flex-shrink: 0;
}

.notes-link:hover {
  text-decoration: underline;
}

.btn-upstream {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
  color: var(--m-warn);
}

.btn-upstream:hover:not(:disabled) {

}

.btn-installed {
  background: var(--m-ok-soft);
  border-color: var(--m-ok-border);
  color: var(--m-ok);
}

.btn-danger-ghost {
  background: transparent;
  border-color: var(--m-danger-border);
  color: var(--m-danger);
}

.btn-danger-ghost:hover:not(:disabled) {
  background: var(--m-danger-soft);
  border-color: var(--m-danger);
}

.btn-danger-solid {
  background: linear-gradient(135deg, #f43f5e 0%, #dc2626 100%);
  border-color: rgba(251, 113, 133, 0.65);
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 14px rgba(225, 29, 72, 0.38);
}

.btn-danger-solid:hover:not(:disabled) {
  filter: brightness(1.08);
}

.pill-link {
  font-size: 11px;
  font-weight: 600;
  color: var(--m-accent-bright);
  text-decoration: none;
  padding: 3.5px 9px;
  border-radius: 8px;
  background: var(--m-accent-soft);
  border: 1px solid var(--m-accent-border);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
}

.pill-link:hover {
  filter: brightness(1.1);
}

/* ==========================================================================
   Conflict Radar & Health Diagnostics View (`冲突与诊断`)
   ========================================================================== */

.conflict-hero {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 18px;
  margin-bottom: 15px;
  border-radius: var(--m-r-lg);
  overflow: hidden;
  background:
    radial-gradient(360px 200px at 0% 0%, rgba(16, 185, 129, 0.2), transparent 72%),
    radial-gradient(320px 180px at 100% 100%, rgba(56, 189, 248, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
  border: 1px solid var(--m-ok-border);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.conflict-hero.has-warnings {
  border-color: var(--m-warn-border);
  background:
    radial-gradient(360px 200px at 0% 0%, rgba(245, 158, 11, 0.2), transparent 72%),
    radial-gradient(320px 180px at 100% 100%, rgba(168, 85, 247, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
}

.conflict-hero.has-critical {
  border-color: var(--m-danger-border);
  background:
    radial-gradient(380px 200px at 0% 0%, rgba(244, 63, 94, 0.22), transparent 72%),
    radial-gradient(320px 180px at 100% 100%, rgba(245, 158, 11, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
}

.conflict-hero-left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  flex: 1 1 320px;
}

.health-ring-wrap {
  position: relative;
  width: 74px;
  height: 74px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.health-ring-svg {
  width: 74px;
  height: 74px;
  transform: rotate(-90deg);
}

.health-ring-bg {
  fill: none;
  stroke: var(--m-hairline-strong);
  stroke-width: 6;
}

.health-ring-fg {
  fill: none;
  stroke-width: 6;
  stroke-linecap: round;
  transition: stroke-dashoffset 480ms var(--m-ease-out);
}

.health-ring-score {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.05;
}

.health-ring-num {
  font-size: 19px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}

.health-ring-lbl {
  font-size: 9.5px;
  color: var(--m-muted);
  font-weight: 600;
}

.conflict-hero-copy {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.conflict-hero-title {
  margin: 0;
  font-size: 15.5px;
  font-weight: 760;
  color: var(--m-text);
  display: flex;
  align-items: center;
  gap: 7px;
}

.conflict-hero-sub {
  margin: 0;
  font-size: 11.8px;
  color: var(--m-muted);
}

.conflict-kpi-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}

.conflict-kpi-pill {
  font-size: 11px;
  font-weight: 650;
  padding: 3px 9px;
  border-radius: var(--m-r-pill);
  border: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  color: var(--m-text-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
}

.conflict-kpi-pill.is-critical {
  border-color: var(--m-danger-border);
  background: var(--m-danger-soft);
  color: var(--m-danger);
}

.conflict-kpi-pill.is-warning {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.conflict-kpi-pill.is-info {
  border-color: var(--m-sky-border);
  background: var(--m-sky-soft);
  color: var(--m-sky);
}

.conflict-kpi-pill.is-ok {
  border-color: var(--m-ok-border);
  background: var(--m-ok-soft);
  color: var(--m-ok);
}

.conflict-hero-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.conflict-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.conflict-card {
  position: relative;
  border-radius: var(--m-r-lg);
  padding: 14px 16px 14px 19px;
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

.conflict-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3.5px;
  background: var(--m-sky);
}

.conflict-card.sev-critical {
  border-color: color-mix(in srgb, var(--m-danger-border) 75%, var(--m-hairline));
}
.conflict-card.sev-critical::before {
  background: linear-gradient(180deg, #fb7185, #e11d48);
}

.conflict-card.sev-warning {
  border-color: color-mix(in srgb, var(--m-warn-border) 75%, var(--m-hairline));
}
.conflict-card.sev-warning::before {
  background: linear-gradient(180deg, #fbbf24, #f97316);
}

.conflict-card.sev-info {
  border-color: color-mix(in srgb, var(--m-sky-border) 75%, var(--m-hairline));
}
.conflict-card.sev-info::before {
  background: linear-gradient(180deg, #38bdf8, #6366f1);
}

.conflict-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px 12px;
}

.conflict-card-title-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  flex: 1;
}

.conflict-card-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.sev-pill {
  font-size: 10.2px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.sev-pill.sev-critical {
  background: var(--m-danger-soft);
  color: var(--m-danger);
  border: 1px solid var(--m-danger-border);
}

.sev-pill.sev-warning {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.sev-pill.sev-info {
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
}

.layer-tag {
  font-size: 10.2px;
  font-weight: 600;
  font-family: var(--m-mono);
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-inset-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.conflict-card-title {
  margin: 0;
  font-size: 13.6px;
  font-weight: 720;
  color: var(--m-text);
}

.conflict-card-desc {
  margin: 0;
  font-size: 12px;
  line-height: 1.54;
  color: var(--m-text-2);
}

.conflict-compare {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}

.conflict-path-box {
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.conflict-path-box.is-winner {
  border-color: var(--m-ok-border);
  background: color-mix(in srgb, var(--m-ok-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-shadowed {
  border-color: var(--m-danger-border);
  background: color-mix(in srgb, var(--m-danger-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-warn-box {
  border-color: var(--m-warn-border);
  background: color-mix(in srgb, var(--m-warn-soft) 45%, var(--m-inset-bg));
}

.conflict-box-label {
  font-size: 10.6px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.conflict-path-box.is-winner .conflict-box-label {
  color: var(--m-ok);
}

.conflict-path-box.is-shadowed .conflict-box-label {
  color: var(--m-danger);
}

.conflict-path-box.is-warn-box .conflict-box-label {
  color: var(--m-warn);
}

.conflict-path-line {
  font-family: var(--m-mono);
  font-size: 10.8px;
  color: var(--m-text-2);
  word-break: break-all;
  line-height: 1.45;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.scope-chip {
  font-size: 9.8px;
  font-weight: 650;
  padding: 0.5px 5.5px;
  border-radius: 5px;
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  color: var(--m-muted);
}

/* 5-Layer Audit Checklist Grid */
.radar-checks-section {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.radar-section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--m-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.radar-checks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 8px;
}

.radar-check-tile {
  padding: 9.5px 11px;
  border-radius: var(--m-r-md);
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.radar-check-tile.is-pass {
  border-color: color-mix(in srgb, var(--m-ok-border) 55%, var(--m-hairline));
}

.radar-check-tile.is-hit-critical {
  border-color: var(--m-danger-border);
}

.radar-check-tile.is-hit-warn {
  border-color: var(--m-warn-border);
}

.radar-check-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.radar-check-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--m-text);
}

.radar-check-sub {
  font-size: 11px;
  color: var(--m-muted);
  line-height: 1.4;
}

.radar-check-status {
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  white-space: nowrap;
  flex-shrink: 0;
}

.radar-check-status.is-pass {
  background: var(--m-ok-soft);
  color: var(--m-ok);
  border: 1px solid var(--m-ok-border);
}

.radar-check-status.is-hit-critical {
  background: var(--m-danger-soft);
  color: var(--m-danger);
  border: 1px solid var(--m-danger-border);
}

.radar-check-status.is-hit-warn {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

/* ==========================================================================
   Skeleton Loaders & Empty States
   ========================================================================== */

.skel-card {
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.skel-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skel {
  border-radius: 6px;
  background: linear-gradient(90deg, var(--m-skel-base) 25%, var(--m-skel-shine) 50%, var(--m-skel-base) 75%);
  background-size: 200% 100%;
  animation: agy-shimmer 1.35s ease-in-out infinite;
}

.skel-avatar {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  flex-shrink: 0;
}

.skel-line {
  height: 11px;
}

.skel-pill {
  height: 20px;
  width: 82px;
  border-radius: 999px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 9px;
  padding: 46px 22px;
  border: 1px dashed var(--m-hairline-strong);
  border-radius: var(--m-r-lg);
  background: var(--m-card-bg);
  color: var(--m-muted);
}

.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  border: 1px solid var(--m-accent-border);
  display: grid;
  place-items: center;
  color: var(--m-accent-bright);
  margin-bottom: 2px;
}

.empty-title {
  font-weight: 740;
  font-size: 14px;
  color: var(--m-text);
}

.empty-sub {
  max-width: 420px;
  font-size: 12px;
  color: var(--m-muted);
}

/* ==========================================================================
   Slide-Over Detail Drawer (Aurora Header + Clickable GitHub Title + Toggle)
   ========================================================================== */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: flex;
  justify-content: flex-end;
  z-index: 45;
}

.drawer-panel {

async function checkUpdates(force = false, { silent = true } = {}) {
  const seq = ++updatesRequestSeq;
  if (force) lastForcedUpdatesAt = Date.now();
  state.updates.loading = true;
  state.updates.error = '';
  render();
  try {
    const qs = force ? '?force=1' : '?force=0';
    const res = await apiFetch(`/api/updates${qs}`);
    if (seq !== updatesRequestSeq) return;
    if (res && res.ok !== false) {
      state.updates = {
        loading: false,
        checkedAt: res.checkedAt || new Date().toISOString(),
        items: Array.isArray(res.items) ? res.items : [],
        selfUpdate: res.selfUpdate || null,
        rateLimited: Boolean(res.rateLimited),
        warnings: Array.isArray(res.warnings) ? res.warnings : [],
        error: '',
      };
      if (!silent) {
        const count = state.updates.items.length;
        showToast(
          count > 0
            ? t(`检查完成：发现 ${count} 个插件更新`, `Update check complete: ${count} update(s) found`)
            : t('所有已安装插件均为最新版本', 'All installed plugins are up to date'),
          { tone: 'ok' },
        );
      }
    } else {
      state.updates.loading = false;
      state.updates.error = res?.error || t('更新检查未返回有效数据', 'Update check returned an error');
    }
  } catch (err) {
    if (seq !== updatesRequestSeq) return;
    state.updates.loading = false;
    state.updates.error = err?.message || String(err);
    if (!silent) {
      showToast(`${t('检查更新失败', 'Update check failed')}: ${state.updates.error}`, { tone: 'error' });
    }
  } finally {
    if (seq === updatesRequestSeq) render();
  }
}

async function triggerInstall(plugin, { conflictStrategy = 'prompt', confirmEscalation = false } = {}) {
  state.busyId = plugin.id;
  render();
  try {
    const endpoint = plugin.installStatus?.installed ? '/api/update' : '/api/install';
    const res = await apiFetch(endpoint, {
      method: 'POST',
      body: {
        id: plugin.id,
        plugin,
        conflictStrategy,
        confirmEscalation,
        workspaceUris: state.workspaceUris,
      },
    });

    if (res.state) {
      state.serverState = res.state;
      syncDetailPluginReference();
    }

    if (res.status === 'CONFLICT_CHOICE_REQUIRED') {
      state.conflictModal = {
        plugin,
        conflict: res.conflict,
        scopedFallbackName: res.scopedFallbackName,
        choices: res.choices || ['isolate'],
      };
      return;
    }

    if (res.status === 'CAPABILITY_ESCALATION_CONFIRM_REQUIRED') {
      state.escalationModal = {
        mode: 'single',
        items: [
          {
            plugin,
            id: plugin.id,
            displayName: plugin.displayName || plugin.canonicalName || plugin.id,
            installedVersion: res.installedVersion || plugin.installStatus?.installedVersion || '?',
            targetVersion: res.targetVersion || plugin.version || '?',
            escalation: res.escalation || { addedBadges: [], addedRemoteDomains: [], addedHookEvents: [] },
          },
        ],
      };
      return;
    }

    if (res.ok) {
      state.conflictModal = null;
      state.escalationModal = null;
      if (res.isSelfUpdate || res.willRestart) {
        startReconnectPolling(res.version || plugin.version || '');
        return;
      }

      const act = res.activation || resolveActivationInfo(plugin);
      maybeTriggerRestartNotice({
        pluginName: plugin.displayName || res.installedDir || plugin.canonicalName,
        restartRequired: Boolean(res.restartRequired),
        reloadRequired: Boolean(res.reloadRequired),
        retiredBinaries: res.retiredBinaries || [],
        activation: act,
      });

      const noteSuffix = res.compatibilityNotes?.length ? ` (${res.compatibilityNotes[0]})` : '';
      const paneUri = res.sidecarPane?.uri || '';
      const paneTitle = res.sidecarPane?.title || plugin.displayName || res.installedDir;
      showToast(
        `${t('安装 / 更新已完成', 'Installed & synced')}: ${res.installedDir} v${res.version}${noteSuffix}`,
        {
          copyText: paneUri && res.installedDir !== 'agy-market' ? `[${t('打开', 'Open')} ${paneTitle}](${paneUri})` : '',
          copyLabel: paneUri && res.installedDir !== 'agy-market' ? t('复制面板药丸', 'Copy Pane Pill') : '',
          tone: 'ok',
        },
      );
      void checkUpdates(false, { silent: true });
      if (state.conflicts.loaded) void loadConflicts({ silent: true });
    } else {
      showToast(res.error || t('安装未完成', 'Install did not complete'), { tone: 'error' });
    }
  } catch (err) {
    showToast(`${t('安装失败', 'Install error')}: ${err?.message || String(err)}`, { tone: 'error' });
  } finally {
    state.busyId = '';
    render();
  }
}

async function triggerUpdateAll(ids = null, { confirmEscalation = false } = {}) {
  const installable = getInstallableUpdates();
  const targetIds = Array.isArray(ids) && ids.length ? ids : installable.map((u) => u.id);
  if (!targetIds.length) {
    showToast(t('当前没有可通过目录直接安装的更新', 'No catalog-installable updates available'));
    return;
  }

  state.batchUpdating = true;
  state.batchTargetIds = targetIds;
  render();

  try {
    const res = await apiFetch('/api/update-all', {
      method: 'POST',
      body: {
        ids: targetIds,
        confirmEscalation,
        workspaceUris: state.workspaceUris,
      },
    });

    if (res.state) {
      state.serverState = res.state;
      syncDetailPluginReference();
    }

    const results = Array.isArray(res.results) ? res.results : [];
    if (confirmEscalation && Array.isArray(state.batchResults)) {
      const merged = new Map(state.batchResults.map((r) => [r.id, r]));
      for (const r of results) merged.set(r.id, r);
      state.batchResults = [...merged.values()];
    } else {
      state.batchResults = results;
    }

    for (const r of results) {
      if (r.ok) {
        maybeTriggerRestartNotice({
          pluginName: r.displayName || r.installedDir || r.id,
          restartRequired: Boolean(r.restartRequired),
          reloadRequired: Boolean(r.reloadRequired),
          retiredBinaries: r.retiredBinaries || [],
          activation: r.activation || null,
        });
      }
    }

    const { byId: updById } = getUpdateMaps();
    const { byId: catById } = getCatalogMaps();

    const escalated = results.filter((r) => r.status === 'CAPABILITY_ESCALATION_CONFIRM_REQUIRED');
    if (escalated.length > 0 && !confirmEscalation) {
      state.escalationModal = {
        mode: 'batch',
        items: escalated.map((r) => {
          const upd = updById.get(r.id);
          const cat = catById.get(r.id);
          return {
            id: r.id,
            displayName: r.displayName || upd?.displayName || cat?.displayName || r.id,
            installedVersion: r.installedVersion || upd?.installedVersion || cat?.installStatus?.installedVersion || '?',
            targetVersion: r.targetVersion || upd?.latestVersion || cat?.version || '?',
            escalation: r.escalation || upd?.escalation || { addedBadges: [], addedRemoteDomains: [], addedHookEvents: [] },
          };
        }),
      };
    } else {
      state.escalationModal = null;
    }

    const okCount = results.filter((r) => r.ok).length;
    const failCount = results.filter((r) => !r.ok && r.status !== 'CAPABILITY_ESCALATION_CONFIRM_REQUIRED').length;
    const selfUpdated = Boolean(
      res.willRestart || results.some((r) => r.ok && (r.isSelfUpdate || r.installedDir === 'agy-market' || r.id === 'azwosile__agy-market')),
    );

    if (selfUpdated) {
      const selfItem = results.find((r) => r.isSelfUpdate || r.installedDir === 'agy-market' || r.id === 'azwosile__agy-market');
      startReconnectPolling(selfItem?.version || state.updates.selfUpdate?.latestVersion || '');
      return;
    }

    if (failCount === 0 && escalated.length === 0) {
      showToast(t(`全部更新完成（共 ${okCount} 个插件）`, `Updated ${okCount} plugin(s) successfully`), { tone: 'ok' });
    } else if (escalated.length > 0) {
      showToast(
        t(
          `已完成 ${okCount} 个，另有 ${escalated.length} 个插件新增能力需确认`,
          `Updated ${okCount}; ${escalated.length} plugin(s) require capability confirmation`,
        ),
      );
    } else {
      showToast(
        t(`批量更新结束：${okCount} 成功，${failCount} 失败`, `Batch update finished: ${okCount} succeeded, ${failCount} failed`),
        { tone: 'error' },
      );
    }

    void checkUpdates(false, { silent: true });
    if (state.conflicts.loaded) void loadConflicts({ silent: true });
  } catch (err) {
    showToast(`${t('批量更新失败', 'Batch update error')}: ${err?.message || String(err)}`, { tone: 'error' });
  } finally {
    state.batchUpdating = false;
    state.batchTargetIds = [];
    render();
  }
}

function startReconnectPolling(targetVersion = '') {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  const previousVersion = state.serverState?.plugin?.version || '';
  state.reconnecting = {
    targetVersion,
    previousVersion,
    phase: 'restarting',
    attempts: 0,
    sawDown: false,
    timedOut: false,
  };
  render();

  const maxAttempts = 28;
  const poll = async () => {
    if (!state.reconnecting) return;
    state.reconnecting.attempts += 1;
    state.reconnecting.phase = 'polling';
    render();

    try {
      const fn = getFetchImpl();
      const res = await fn('/healthz', { method: 'GET', cache: 'no-store' });
      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        const versionChanged = Boolean(
          targetVersion && data?.version && String(data.version) === String(targetVersion),
        );
        const recovered =
          state.reconnecting.sawDown ||
          versionChanged ||
          state.reconnecting.attempts >= 3;
        if (recovered) {
          state.reconnecting = null;
          state.dismissedSelfVersion = '';
          writeStorage(SELF_OFFER_DISMISSED_KEY, '');
          render();
          await loadState(false);
          await checkUpdates(false, { silent: true });
          const versionBehind = Boolean(
            targetVersion && data?.version && String(data.version) !== String(targetVersion),
          );
          showToast(
            versionBehind
              ? t(
                  `服务已恢复 (v${data.version})，若界面未切换请刷新面板`,
                  `Reconnected (v${data.version}); reload pane if UI did not refresh`,
                )
              : t(
                  `AGY Market 已重启并恢复服务${data?.version ? ` (v${data.version})` : ''}`,
                  `AGY Market reconnected${data?.version ? ` (v${data.version})` : ''}`,
                ),
            { tone: 'ok' },
          );
          return;
        }
      } else {
        state.reconnecting.sawDown = true;
      }
    } catch {
      if (state.reconnecting) state.reconnecting.sawDown = true;
    }

    if (!state.reconnecting) return;
    if (state.reconnecting.attempts >= maxAttempts) {
      state.reconnecting.timedOut = true;
      render();
      return;
    }
    reconnectTimer = setTimeout(poll, 900);
  };

  reconnectTimer = setTimeout(poll, 700);
}

async function copyText(text, key, toastMsg = '') {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    state.copiedKey = key;
    if (toastMsg) {
      showToast(toastMsg, { tone: 'ok', durationMs: 3200 });
    } else {
      render();
    }
    setTimeout(() => {
      if (state.copiedKey === key) {
        state.copiedKey = '';
        render();
      }
    }, 1800);
  } catch {
    showToast(t('复制失败，请手动选中复制', 'Copy failed'), { tone: 'error' });
  }
}

function renderBadgesHtml(capabilities = {}, { maxCount = 0 } = {}) {
  const loc = getLocale();
  const badges = Array.isArray(capabilities?.badges) ? capabilities.badges : [];
  if (!badges.length) return '';

  const visible = maxCount > 0 && badges.length > maxCount ? badges.slice(0, maxCount) : badges;
  const hidden = maxCount > 0 && badges.length > maxCount ? badges.slice(maxCount) : [];

  const html = visible
    .map((id) => {
      const spec = CAPABILITY_BADGE_SPECS[id] || { tone: 'subtle', descZh: id, descEn: id };
      const label = cleanBadgeText(id, capabilities);
      const tip = loc === 'en' ? spec.descEn : spec.descZh;
      return `<span class="cap-badge tone-${escapeHtml(spec.tone)}" title="${escapeHtml(tip)}">${badgeIcon(id, 11)}<span>${escapeHtml(label)}</span></span>`;
    })
    .join('');

  if (hidden.length > 0) {
    const hiddenNames = hidden.map((id) => cleanBadgeText(id, capabilities)).join(' · ');
    return `${html}<span class="cap-badge is-more" title="${escapeHtml(hiddenNames)}">+${hidden.length}</span>`;
  }
  return html;
}

function renderActivationBadgeHtml(activation) {
  if (!activation || !activation.level) return '';
  const loc = getLocale();
  const tip = (loc === 'en' ? activation.reasonEn : activation.reasonZh) || '';
  if (activation.level === 'host-restart') {
    return `<span class="act-badge is-host-restart" title="${escapeHtml(tip)}">${icon('rocket', 10)} <span>${escapeHtml(t('需重启生效', 'Restart App'))}</span></span>`;
  }
  if (activation.level === 'reload-pane') {
    return `<span class="act-badge is-reload-pane" title="${escapeHtml(tip)}">${icon('refresh', 10)} <span>${escapeHtml(t('需重开面板', 'Reload Pane'))}</span></span>`;
  }
  return `<span class="act-badge is-instant" title="${escapeHtml(tip)}">${icon('zap', 10)} <span>${escapeHtml(t('免重启', 'Instant'))}</span></span>`;
}

function renderCardTitleHtml(title, repoUrl) {

function parseSidecarPaneTarget(dir, sidecarPane) {
  if (!sidecarPane) return null;
  let folder = sidecarPane.sidecarFolder || '';
  let viewPath = sidecarPane.path || '/';
  if (sidecarPane.uri && /^sidecar:\/\/([^/]+)\/([^/]+)(\/.*)?$/i.test(sidecarPane.uri)) {
    const m = /^sidecar:\/\/([^/]+)\/([^/]+)(\/.*)?$/i.exec(sidecarPane.uri);
    if (!folder && m[2]) folder = m[2];
    if (m[3]) viewPath = m[3];
  }
  return {
    dir,
    folder: folder || 'pane',
    viewPath: viewPath || '/',
    title: sidecarPane.title || dir,
    uri: sidecarPane.uri || `sidecar://${dir}/${folder || 'pane'}/${String(viewPath || '').replace(/^\/+/, '')}`,
  };
}

function renderOpenPaneButtonHtml({ dir, sidecarPane, enabled, btnClass = 'dock-btn is-pane', label = '' }) {
  // Never render redundant Pane button on AGY Market itself or on disabled plugins; NEVER emit raw sidecar:// <a href>!
  if (!dir || dir === 'agy-market' || !enabled || !sidecarPane?.uri) return '';
  const target = parseSidecarPaneTarget(dir, sidecarPane);
  if (!target) return '';
  return `<button type="button" class="${btnClass}" data-action="open-pane" data-dir="${escapeHtml(target.dir)}" data-folder="${escapeHtml(target.folder)}" data-path="${escapeHtml(target.viewPath)}" data-title="${escapeHtml(target.title)}" data-uri="${escapeHtml(target.uri)}" title="${escapeHtml(t(`打开「${target.title}」辅助面板`, `Open "${target.title}" Sidecar pane`))}">${icon('panel', 12)} <span>${escapeHtml(label || t('面板', 'Pane'))}</span></button>`;
}

function renderToggleSliderHtml({ dir, enabled, canToggle, toggleDisabledReason }) {
  if (!dir) return '';
  const reason = String(toggleDisabledReason || '');
  const isSelf = dir === 'agy-market' || reason === 'self';
  const isLocked = isSelf || canToggle === false;
  const isBusy = state.togglingDir === dir;
  const isOn = isSelf ? true : Boolean(enabled);

  let tooltip = isOn
    ? t('点击移入停放仓并禁用（免改 config.json）', 'Click to park & disable plugin (no config.json edits)')
    : t('点击从停放仓恢复并立即启用', 'Click to restore & enable plugin');
  let labelText = isBusy
    ? t('切换中…', 'Switching…')
    : isOn
      ? t('启用', 'Enabled')
      : t('已禁用', 'Disabled');

  if (isSelf) {
    tooltip = t('当前面板运行中 · 不可在市场面板内停用自身', 'Active panel running — cannot disable self inside pane');
    labelText = t('当前面板运行中', 'Active Panel');
  } else if (reason === 'host-disabled') {
    tooltip = t('已在 Antigravity 宿主设置中禁用，请通过宿主插件管理启用', 'Disabled by Antigravity host settings');
    labelText = t('宿主已禁用', 'Host Disabled');
  } else if (reason === 'workspace') {
    tooltip = t('工作区级插件（.agents/plugins）由当前仓库管理', 'Workspace plugin managed by current repository');
    labelText = t('工作区', 'Workspace');
  } else if (reason === 'builtin') {
    tooltip = t('Antigravity 内置插件不可停用', 'Built-in Antigravity plugin');

  }

  return `
    <button
      type="button"
      role="switch"
      aria-checked="${isOn ? 'true' : 'false'}"
      class="prism-toggle ${isOn ? 'is-on' : 'is-off'} ${isLocked ? 'is-locked' : ''} ${isBusy ? 'is-busy' : ''}"
      data-action="toggle-plugin"
      data-dir="${escapeHtml(dir)}"
      data-next-enabled="${isOn ? '0' : '1'}"
      data-stop-card="1"
      ${isLocked || isBusy ? 'disabled aria-disabled="true"' : ''}

      <span class="prism-toggle-track" aria-hidden="true">
        <span class="prism-toggle-thumb">
          ${isBusy ? icon('refresh', 9, 'spin') : '<span class="prism-toggle-thumb-core"></span>'}
        </span>

      <span class="prism-toggle-label">
        ${isLocked && !isBusy ? icon('lock', 10) : ''}
        <span>${escapeHtml(labelText)}</span>
      </span>
    </button>
  `;
}

function getFilteredPlugins() {
  const list = state.serverState?.catalog?.plugins || [];
  const loc = getLocale();
  const q = state.search.trim().toLowerCase();

  const filtered = list.filter((p) => {
    if (state.category !== 'all') {
      const cats = p.taxonomy?.categories || [];
      if (!cats.includes(state.category)) return false;
    }
    if (!q) return true;
    const desc =
      typeof p.description === 'object'
        ? `${p.description.zh || ''} ${p.description.en || ''}`
        : String(p.description || '');
    const hay = `${p.displayName || ''} ${p.canonicalName || ''} ${p.scopedName || ''} ${p.id || ''} ${desc} ${(p.taxonomy?.tags || []).join(' ')} ${(p.capabilities?.badges || []).join(' ')}`.toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => {
    if (state.sortBy === 'updated') {
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    }
    if (state.sortBy === 'name') {
      return String(a.displayName || a.canonicalName).localeCompare(String(b.displayName || b.canonicalName), loc);
    }
    return Number(b.repository?.stars || 0) - Number(a.repository?.stars || 0);
  });

  return filtered;
}

function getCategoryCounts() {
  const plugins = state.serverState?.catalog?.plugins || [];
  const counts = { all: plugins.length };
  for (const p of plugins) {
    for (const c of p.taxonomy?.categories || []) {
      counts[c] = (counts[c] || 0) + 1;
    }
  }
  return counts;
}
