/* ==========================================================================
   AGY Market — Sidebar Panel Stylesheet (`src/ui/styles.css`)
   Zero external dependencies. Adapts to dark, light, and translucent host
   surfaces via host CSS variable inheritance.
   ========================================================================== */

:root {
  --m-font: var(
    --font-sans,
    'Google Sans Flex',
    'Google Sans',
    'Inter',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    'Noto Sans SC',
    'PingFang SC',
    'Microsoft YaHei UI',
    system-ui,
    sans-serif
  );
  --m-mono: var(
    --font-mono,
    'Google Sans Code',
    'JetBrains Mono',
    'Cascadia Code',
    'SF Mono',
    Consolas,
    ui-monospace,
    monospace
  );

  /* Radii & spring motion tokens */
  --m-r-xs: 6px;
  --m-r-sm: 9px;
  --m-r-md: 12px;
  --m-r-lg: 16px;
  --m-r-xl: 20px;
  --m-r-pill: 999px;

  --m-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --m-ease-spring: cubic-bezier(0.22, 1.15, 0.36, 1);
  --m-dur-fast: 140ms;
  --m-dur-base: 220ms;
  --m-dur-slow: 300ms;

  /* Host-inherited base palette (Dark Obsidian Aurora defaults) */
  --m-bg-raw: var(--color-background-primary, var(--vscode-editor-background, #080a12));
  --m-surface-raw: var(--color-background-secondary, var(--vscode-sideBar-background, #111625));
  --m-surface-2-raw: var(--color-background-tertiary, #182034);
  --m-border-raw: var(--color-border-primary, rgba(255, 255, 255, 0.09));
  --m-text: var(--color-text-primary, var(--vscode-foreground, #f4f7ff));
  --m-text-2: #cfd8ea;
  --m-muted: var(--color-text-secondary, #93a3be);
  --m-faint: #677692;

  /* Glassmorphic layered surfaces (translucent wallpaper compatible) */
  --m-sticky-bg: color-mix(in srgb, var(--m-bg-raw) 66%, transparent);
  --m-stuck-bg: color-mix(in srgb, var(--m-bg-raw) 92%, #060810);
  --m-chrome-bg: var(--m-sticky-bg);
  --m-card-bg: color-mix(in srgb, var(--m-surface-raw) 76%, transparent);
  --m-card-bg-hover: color-mix(in srgb, var(--m-surface-2-raw) 86%, transparent);
  --m-dock-bg: color-mix(in srgb, var(--m-bg-raw) 56%, rgba(6, 9, 18, 0.36));
  --m-inset-bg: color-mix(in srgb, var(--m-bg-raw) 62%, rgba(0, 0, 0, 0.28));
  --m-sheet-bg: color-mix(in srgb, var(--m-surface-raw) 93%, #060810);
  --m-ctl-bg: rgba(255, 255, 255, 0.055);
  --m-ctl-hover: rgba(255, 255, 255, 0.105);
  --m-hairline: rgba(255, 255, 255, 0.09);
  --m-hairline-strong: rgba(255, 255, 255, 0.16);
  --m-specular: rgba(255, 255, 255, 0.12);
  --m-sheen: linear-gradient(
    165deg,
    rgba(255, 255, 255, 0.068) 0%,
    rgba(255, 255, 255, 0.015) 42%,
    rgba(255, 255, 255, 0) 100%
  );

  /* Accent palette (Dark calibrated) */
  --m-accent: #6366f1;
  --m-accent-bright: #a5b4fc;
  --m-accent-hover: #4f46e5;
  --m-accent-soft: rgba(99, 102, 241, 0.16);
  --m-accent-border: rgba(129, 140, 248, 0.4);

  --m-violet: #a855f7;
  --m-violet-soft: rgba(168, 85, 247, 0.16);
  --m-violet-border: rgba(192, 132, 252, 0.38);

  --m-sky: #38bdf8;
  --m-sky-solid: #0284c7;
  --m-sky-hover: #0369a1;
  --m-sky-soft: rgba(56, 189, 248, 0.15);
  --m-sky-border: rgba(56, 189, 248, 0.38);

  --m-ok: #34d399;
  --m-ok-solid: #10b981;
  --m-ok-soft: rgba(16, 185, 129, 0.15);
  --m-ok-border: rgba(52, 211, 153, 0.34);

  --m-warn: #fbbf24;
  --m-warn-soft: rgba(245, 158, 11, 0.15);
  --m-warn-border: rgba(251, 191, 36, 0.36);

  --m-danger: #fb7185;
  --m-danger-soft: rgba(244, 63, 94, 0.15);
  --m-danger-border: rgba(251, 113, 133, 0.38);

  /* Badge semantic palette (Dark) */

  --b-green-fg: #34d399;
  --b-green-bd: rgba(52, 211, 153, 0.26);

  --b-blue-bg: rgba(59, 130, 246, 0.13);
  --b-blue-fg: #60a5fa;
  --b-blue-bd: rgba(96, 165, 250, 0.26);

  --b-purple-bg: rgba(168, 85, 247, 0.14);
  --b-purple-fg: #c084fc;
  --b-purple-bd: rgba(192, 132, 252, 0.28);

  --b-amber-bg: rgba(245, 158, 11, 0.13);
  --b-amber-fg: #fbbf24;
  --b-amber-bd: rgba(251, 191, 36, 0.28);

  --b-cyan-bg: rgba(6, 182, 212, 0.13);
  --b-cyan-fg: #22d3ee;
  --b-cyan-bd: rgba(34, 211, 238, 0.28);

  --b-orange-bg: rgba(249, 115, 22, 0.13);
  --b-orange-fg: #fb923c;
  --b-orange-bd: rgba(251, 146, 60, 0.28);

  --b-subtle-bg: rgba(148, 163, 184, 0.12);
  --b-subtle-fg: #cbd5e1;
  --b-subtle-bd: rgba(148, 163, 184, 0.24);

  /* Ambient Aurora orbs & optical depth shadows */
  --m-shadow-card:
    0 10px 28px -14px rgba(0, 0, 0, 0.72),
    0 2px 6px rgba(0, 0, 0, 0.28);
  --m-shadow-hover:
    0 20px 44px -16px rgba(0, 0, 0, 0.8),
    0 4px 12px rgba(0, 0, 0, 0.34);
  --m-shadow-sheet: -16px 0 54px rgba(0, 0, 0, 0.62);
  --m-shadow-modal:
    0 28px 72px -16px rgba(0, 0, 0, 0.78),
    0 4px 14px rgba(0, 0, 0, 0.36);
  --m-backdrop: rgba(4, 7, 16, 0.62);
  --m-aura-1: rgba(99, 102, 241, 0.2);
  --m-aura-2: rgba(168, 85, 247, 0.14);
  --m-aura-3: rgba(6, 182, 212, 0.14);
  --m-skel-base: rgba(255, 255, 255, 0.055);
  --m-skel-shine: rgba(255, 255, 255, 0.12);

  /* Toggle slider tokens */
  --m-toggle-off-bg: rgba(148, 163, 184, 0.22);
  --m-toggle-off-bd: rgba(255, 255, 255, 0.12);
  --m-toggle-thumb: #ffffff;

  color-scheme: dark;

*,

*::after {
  box-sizing: border-box;
}

html,
body,
#app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--m-bg-raw);
  color: var(--m-text);
  font-family: var(--m-font);
  font-size: 13px;
  line-height: 1.48;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ==========================================================================
   Canvas & Container-Query Shell
   ========================================================================== */

.market-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  container-type: inline-size;
  container-name: market;
  background:
    radial-gradient(740px 380px at 88% -10%, var(--m-aura-1), transparent 68%),
    radial-gradient(620px 340px at 10% -8%, var(--m-aura-3), transparent 64%),
    radial-gradient(540px 320px at 52% 108%, var(--m-aura-2), transparent 68%),
    var(--m-bg-raw);
}

.market-shell::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(99, 102, 241, 0.72) 24%,
    rgba(168, 85, 247, 0.78) 50%,
    rgba(56, 189, 248, 0.78) 76%,
    transparent 100%
  );
  opacity: 0.85;
  pointer-events: none;
  z-index: 35;
}

/* Custom sleek scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--m-hairline-strong);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--m-faint);
}

.ui-ico {
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

.spin {
  animation: agy-spin 0.85s linear infinite;
}

@keyframes agy-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes agy-pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.45;
    transform: scale(0.84);
  }
}

@keyframes agy-aurora-drift {
  0%, 100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  50% {
    transform: translate3d(18px, -10px, 0) scale(1.04);
  }
}

@keyframes agy-shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

@keyframes agy-drawer-in {
  from {
    opacity: 0.5;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes agy-modal-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.975);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes agy-toast-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes agy-bar-slide {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(220%);
  }
}

@keyframes agy-star-pop {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.28);
  }
  75% {
    transform: scale(0.94);
  }
  100% {
    transform: scale(1);
  }
}

/* ==========================================================================
   Header & 5-Tab Segmented Navigation
   ========================================================================== */

.app-header {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 11px 16px 10px;
  background: var(--m-sticky-bg);
  backdrop-filter: blur(20px) saturate(155%);
  -webkit-backdrop-filter: blur(20px) saturate(155%);
  border-bottom: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular);
  flex-shrink: 0;
  z-index: 25;
  transition: background var(--m-dur-base) var(--m-ease-out), box-shadow var(--m-dur-base) var(--m-ease-out);
}

.market-shell[data-stuck="true"] .app-header {
  background: var(--m-stuck-bg);
  box-shadow: inset 0 1px 0 var(--m-specular), 0 8px 22px -10px rgba(0, 0, 0, 0.36);
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.45));
}

.brand-mark svg {
  width: 30px;

}
.hero-stat-pill.tone-warn {
  border-color: var(--m-warn-border);
}
.hero-stat-pill.tone-warn .hero-stat-ico {
  background: var(--m-warn-soft);
  color: var(--m-warn);
}
.hero-stat-pill.tone-danger {
  border-color: var(--m-danger-border);
}
.hero-stat-pill.tone-danger .hero-stat-ico {
  background: var(--m-danger-soft);
  color: var(--m-danger);
}

.aurora-hero-compact-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.aurora-compact-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.compact-stat-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text-2);
  padding: 2.5px 8.5px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}

.compact-stat-chip:hover {
  border-color: var(--m-hairline-strong);
  background: var(--m-ctl-hover);
}

/* ==========================================================================
   Discover Filter Bar & Category Chips
   ========================================================================== */

.filter-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 16px 9px;
  background: var(--m-sticky-bg);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--m-hairline);
  flex-shrink: 0;
  transition: background var(--m-dur-base) var(--m-ease-out);
  z-index: 20;
}

.market-shell[data-stuck="true"] .filter-bar {
  background: var(--m-stuck-bg);
}

.filter-row-top {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  flex: 1 1 200px;
  display: flex;
  align-items: center;
}

.search-box .search-ico {
  position: absolute;
  left: 11px;
  color: var(--m-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 33px;
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 10px;
  padding: 0 34px 0 32px;
  font-family: inherit;
  font-size: 12.2px;
  outline: none;
  transition:
    border-color var(--m-dur-fast) var(--m-ease-out),
    box-shadow var(--m-dur-fast) var(--m-ease-out),
    background var(--m-dur-fast) var(--m-ease-out);
}

.search-input::placeholder {
  color: var(--m-faint);
}

.search-input:focus {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg);
  box-shadow: 0 0 0 3px var(--m-accent-soft);
}

.search-clear {
  position: absolute;
  right: 6px;
  border: none;
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}

.search-clear:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.search-kbd {
  position: absolute;
  right: 9px;
  font-family: var(--m-mono);
  font-size: 10px;
  color: var(--m-faint);
  border: 1px solid var(--m-hairline);
  border-radius: 4px;
  padding: 0 4.5px;
  line-height: 16px;
  pointer-events: none;
}

.select-input,
.text-input {
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 9px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), box-shadow var(--m-dur-fast) var(--m-ease-out);
}

.select-input {
  height: 33px;
  cursor: pointer;
}

.select-input:focus,
.text-input:focus {
  border-color: var(--m-accent-border);
  box-shadow: 0 0 0 3px var(--m-accent-soft);
}

.track2-pill {
  height: 33px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10.5px;
  border-radius: 9px;
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: all var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.track2-pill:hover:not(.is-disabled):not(.is-saving) {
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.track2-pill.is-disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.track2-pill.is-saving {
  opacity: 0.88;
  cursor: progress;
  border-color: var(--m-accent-border);
}

.track2-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.track2-saving-text {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--m-accent-bright);
}

.load-more-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 0 10px;
}

.load-more-sentinel {
  width: 100%;
  height: 1px;
}

.load-more-meta {
  font-size: 11.5px;
  color: var(--m-muted);
}

.track2-pill.enabled {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.track2-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.switch-track {
  width: 24px;
  height: 14px;
  border-radius: 999px;
  background: var(--m-hairline-strong);
  position: relative;
  transition: background var(--m-dur-fast) var(--m-ease-out);
  flex-shrink: 0;
}

.switch-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  transition: transform var(--m-dur-fast) var(--m-ease-spring);
}

.track2-pill.enabled .switch-track {
  background: var(--m-warn);
}

.track2-pill.enabled .switch-track::after {
  transform: translateX(10px);
}

/* Category horizontal chip strip */
.chip-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.chip-strip::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  padding: 4.5px 11px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.cat-chip:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.cat-chip.active {
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
  font-weight: 650;
  box-shadow: inset 0 1px 0 var(--m-specular);
}

.cat-chip-n {
  font-size: 10px;
  opacity: 0.78;
  font-variant-numeric: tabular-nums;
}

/* Installed View Status Filter Pills */
.status-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  padding: 4.5px 11px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 560;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.status-chip:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.status-chip.active {
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
  font-weight: 660;
  box-shadow: inset 0 1px 0 var(--m-specular);
}

.status-chip.active.is-enabled-filter {
  background: var(--m-ok-soft);
  border-color: var(--m-ok-border);
  color: var(--m-ok);
}

.status-chip.active.is-disabled-filter {
  background: var(--b-subtle-bg);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.status-chip.active.is-updatable-filter {
  background: var(--m-sky-soft);
  border-color: var(--m-sky-border);
  color: var(--m-sky);
}

/* ==========================================================================
   Collapsible Pinned Favorites Shelf (`★ 我的收藏栏`)
   ========================================================================== */

.fav-shelf {
  position: relative;
  border-radius: var(--m-r-lg);
  padding: 12px 14px;
  margin-bottom: 14px;
  overflow: hidden;
  background:
    radial-gradient(320px 150px at 0% 0%, rgba(245, 158, 11, 0.16), transparent 72%),
    radial-gradient(280px 140px at 100% 100%, rgba(99, 102, 241, 0.12), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
  border: 1px solid color-mix(in srgb, var(--m-warn-border) 68%, var(--m-hairline));
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  backdrop-filter: blur(16px) saturate(145%);
  -webkit-backdrop-filter: blur(16px) saturate(145%);
}

.fav-shelf.is-collapsed {
  padding: 8.5px 13px;
}

.fav-shelf-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.fav-shelf-title-group {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.fav-shelf-star {
  color: #f59e0b;
  display: inline-flex;
  align-items: center;
  filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.45));
}

.fav-shelf-title {
  font-size: 12.6px;
  font-weight: 740;
  color: var(--m-text);
  letter-spacing: -0.01em;
}

.fav-shelf-count {
  font-size: 10.4px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 1px 7px;
  border-radius: var(--m-r-pill);
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.fav-shelf-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.fav-shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
  gap: 9px;
  margin-top: 10px;
}

.fav-shelf-item {
  --card-accent: #f59e0b;
  --card-accent-2: #6366f1;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--m-inset-bg) 78%, rgba(255, 255, 255, 0.03));
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular);
  cursor: pointer;
  min-width: 0;
  transition:
    transform var(--m-dur-fast) var(--m-ease-out),
    border-color var(--m-dur-fast) var(--m-ease-out),
    background var(--m-dur-fast) var(--m-ease-out);
}

.fav-shelf-item:hover {
  transform: translateY(-1px);
  border-color: color-mix(in srgb, var(--m-warn-border) 75%, var(--card-accent));
  background: var(--m-card-bg-hover);
}

.fav-shelf-item-left {
  display: flex;
  align-items: center;
  gap: 8.5px;
  min-width: 0;
  flex: 1;
}

.fav-mini-logo {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(
    140deg,
    color-mix(in srgb, var(--card-accent) 36%, rgba(255, 255, 255, 0.08)) 0%,
    color-mix(in srgb, var(--card-accent-2) 22%, rgba(15, 23, 42, 0.25)) 100%
  );
  border: 1px solid color-mix(in srgb, var(--card-accent) 35%, var(--m-hairline-strong));
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 760;
  color: var(--m-text);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.fav-mini-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--m-surface-raw);
}

.fav-mini-logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.fav-shelf-copy {
  display: flex;
  flex-direction: column;
  gap: 1.5px;
  min-width: 0;
}

.fav-shelf-name {
  font-size: 11.8px;
  font-weight: 680;
  color: var(--m-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fav-shelf-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.3px;
  color: var(--m-muted);
  font-family: var(--m-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fav-shelf-item-right {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.fav-shelf-compact-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.fav-mini-pill {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text-2);
  padding: 2px 8.5px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.fav-mini-pill:hover {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-text);
}

/* Tactile Favorite Star Button on Cards & Detail Drawer */
.card-title-right {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.fav-btn {
  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 8px;
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition:
    background var(--m-dur-fast) var(--m-ease-out),
    border-color var(--m-dur-fast) var(--m-ease-out),
    color var(--m-dur-fast) var(--m-ease-out),
    box-shadow var(--m-dur-fast) var(--m-ease-out),
    transform var(--m-dur-fast) var(--m-ease-out);
}

.fav-btn:hover {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
  color: #f59e0b;
}

.fav-btn:active {
  transform: scale(0.9);
}

.fav-btn.is-favorited {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(251, 191, 36, 0.14));
  border-color: rgba(251, 191, 36, 0.5);
  color: #fbbf24;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.2),
    0 0 12px -2px rgba(245, 158, 11, 0.45);
  animation: agy-star-pop 280ms var(--m-ease-spring);
}

html[data-theme="light"] .fav-btn.is-favorited {
  color: #d97706;
}

.fav-btn.is-drawer {
  width: 30px;
  height: 30px;
  border-radius: var(--m-r-sm);
}

.fav-btn.is-mini {
  width: 22px;
  height: 22px;
  border-radius: 6px;
}

.drawer-header-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ==========================================================================
   Main Scroll Area & Quick Update Strips
   ========================================================================== */

.main-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-anchor: none;
  padding: 15px 16px 56px;
}

.quick-update-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 10px;
  padding: 9px 13px;
  margin-bottom: 13px;
  border-radius: var(--m-r-md);
  background:
    linear-gradient(90deg, var(--m-sky-soft), var(--m-accent-soft)),
    var(--m-card-bg);
  border: 1px solid var(--m-sky-border);
  box-shadow: inset 0 1px 0 var(--m-specular);
  font-size: 12px;
}

.quick-update-left {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--m-text);
  font-weight: 650;
  min-width: 0;
}

.quick-update-left .ui-ico {
  color: var(--m-sky);
}

.quick-update-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Installed / Updates Command Card */
.updates-command-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 13px 15px;
  margin-bottom: 14px;
  border-radius: var(--m-r-lg);
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.updates-command-bar.has-updates {
  border-color: var(--m-sky-border);
  background:
    radial-gradient(360px 140px at 0% 0%, rgba(56, 189, 248, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
}

.updates-command-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.updates-summary {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.updates-summary-title {
  font-size: 13.5px;
  font-weight: 740;
  display: flex;
  align-items: center;
  gap: 7px;
}

.updates-summary-sub {
  font-size: 11.5px;
  color: var(--m-muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.updates-command-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.progress-track {
  height: 3px;
  width: 100%;
  border-radius: 999px;
  background: var(--m-inset-bg);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 45%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--m-accent), var(--m-violet), var(--m-sky));
  animation: agy-bar-slide 1.2s ease-in-out infinite;
}

/* Batch update per-item result report */
.batch-results {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--m-hairline);
}

.batch-results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--m-muted);
}

.batch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6.5px 10px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  font-size: 11.8px;
}

.batch-row.is-ok {
  border-color: var(--m-ok-border);
}

.batch-row.is-warn {
  border-color: var(--m-warn-border);
}

.batch-row.is-err {
  border-color: var(--m-danger-border);
}

.batch-row-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.batch-row-name {
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.batch-row-msg {
  color: var(--m-muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.batch-row-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Rate limit / warning inline banner */
.notice-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-warn-soft);
  border: 1px solid var(--m-warn-border);
  color: var(--m-warn);
  font-size: 11.5px;
}

/* ==========================================================================
   Prismatic Bento Plugin Cards (Per-Category Aura + Pointer Spotlight + Dock)
   ========================================================================== */

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(312px, 1fr));
  gap: 14px;
}

.plugin-card {
  --card-accent: #6366f1;
  --card-accent-2: #06b6d4;
  --mx: 50%;
  --my: 0%;

  position: relative;
  min-width: 0;
  background:
    radial-gradient(280px 150px at 0% 0%, color-mix(in srgb, var(--card-accent) 14%, transparent), transparent 72%),
    radial-gradient(220px 120px at 100% 100%, color-mix(in srgb, var(--card-accent-2) 8%, transparent), transparent 72%),
    var(--m-sheen),
    color-mix(in srgb, var(--m-surface-raw) 94%, transparent);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px 15px 12px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  overflow: hidden;
  isolation: isolate;
  content-visibility: auto;
  contain-intrinsic-size: auto 220px;
  box-shadow:
    inset 0 1px 0 var(--m-specular),
    var(--m-shadow-card);
  transition:
    transform var(--m-dur-base) var(--m-ease-out),
    border-color var(--m-dur-base) var(--m-ease-out),
    box-shadow var(--m-dur-base) var(--m-ease-out),
    opacity var(--m-dur-base) var(--m-ease-out);
}

/* Pointer-tracking optical spotlight sheen */
.plugin-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    280px circle at var(--mx) var(--my),
    color-mix(in srgb, var(--card-accent) 18%, transparent),
    transparent 65%
  );
  opacity: 0;
  transition: opacity 240ms var(--m-ease-out);
  pointer-events: none;
  z-index: 0;
}

/* Top specular prism accent hairline */
.plugin-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 14px;
  right: 14px;
  height: 1.5px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    color-mix(in srgb, var(--card-accent) 75%, white) 35%,
    color-mix(in srgb, var(--card-accent-2) 70%, white) 68%,
    transparent 100%
  );
  opacity: 0.45;
  transition: opacity var(--m-dur-base) var(--m-ease-out);
  pointer-events: none;
  z-index: 1;
}

.plugin-card > * {
  position: relative;
  z-index: 2;
}

@media (hover: hover) {
  .plugin-card:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--card-accent) 48%, var(--m-hairline-strong));
    box-shadow:
      inset 0 1px 0 var(--m-specular),
      0 0 0 1px color-mix(in srgb, var(--card-accent) 16%, transparent),
      var(--m-shadow-hover);
  }

  .plugin-card:hover::before {
    opacity: 1;
  }

  .plugin-card:hover::after {
    opacity: 0.95;
  }

  .plugin-card.has-update:hover {
    border-color: var(--m-sky);
  }
}

.plugin-card.has-update {
  border-color: var(--m-sky-border);
}

/* Parked / Disabled Standby Card Styling */
.plugin-card.is-parked {
  border-style: dashed;
  border-color: var(--m-hairline-strong);
  background:
    radial-gradient(240px 120px at 0% 0%, color-mix(in srgb, var(--card-accent) 7%, transparent), transparent 72%),
    color-mix(in srgb, var(--m-surface-raw) 90%, transparent);
}

.plugin-card.is-parked .plugin-logo-wrap,
.plugin-card.is-parked .card-desc,
.plugin-card.is-parked .badge-row {
  opacity: 0.72;
  filter: saturate(0.6);
}

.plugin-card.is-parked::after {
  opacity: 0.16;
}

.card-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
}

/* 44x44 Squircle Glass Icon Frame + Radial Color Halo */
.plugin-logo-wrap {
  position: relative;
  flex-shrink: 0;
}

.plugin-logo-wrap::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 17px;
  background: radial-gradient(
    circle at 35% 30%,
    color-mix(in srgb, var(--card-accent) 44%, transparent),
    color-mix(in srgb, var(--card-accent-2) 18%, transparent) 58%,
    transparent 76%
  );
  opacity: 0.52;
  transition: opacity var(--m-dur-base) var(--m-ease-out), transform var(--m-dur-base) var(--m-ease-out);
  pointer-events: none;
  z-index: 0;
}

@media (hover: hover) {
  .plugin-card:hover .plugin-logo-wrap::before {
    opacity: 0.85;
    transform: scale(1.08);
  }
}

.plugin-logo {
  position: relative;
  z-index: 1;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: linear-gradient(
    140deg,
    color-mix(in srgb, var(--card-accent) 34%, rgba(255, 255, 255, 0.08)) 0%,
    color-mix(in srgb, var(--card-accent-2) 22%, rgba(15, 23, 42, 0.25)) 100%
  );
  border: 1px solid color-mix(in srgb, var(--card-accent) 32%, var(--m-hairline-strong));
  box-shadow:
    inset 0 1px 0 var(--m-specular),
    0 4px 12px -4px color-mix(in srgb, var(--card-accent) 45%, rgba(0, 0, 0, 0.4));
  display: grid;
  place-items: center;
  font-weight: 760;
  font-size: 17px;
  color: var(--m-text);
  flex-shrink: 0;
  overflow: hidden;
}

.plugin-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--m-surface-raw);
}

.plugin-logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.plugin-logo.is-lg {
  width: 52px;
  height: 52px;
  border-radius: 15px;
  font-size: 20px;
}

.card-title-wrap {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

/* 2-Line Graceful Card Title + Clickable GitHub Link (NO single-line ellipsis stub!) */
.card-title-link,
.card-title-text {
  font-weight: 740;
  font-size: 13.8px;
  line-height: 1.32;
  letter-spacing: -0.015em;
  color: var(--m-text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  min-width: 0;
  flex: 1;
}

.card-title-link {
  text-decoration: none;
  cursor: pointer;
  transition: color var(--m-dur-fast) var(--m-ease-out);
}

.card-title-link .title-ext-ico {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  margin-left: 3px;
  color: var(--m-muted);
  opacity: 0.65;
  transition:
    transform var(--m-dur-fast) var(--m-ease-out),
    color var(--m-dur-fast) var(--m-ease-out),
    opacity var(--m-dur-fast) var(--m-ease-out);
}

.card-title-link:hover {
  color: color-mix(in srgb, var(--card-accent) 72%, var(--m-text));
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--card-accent) 45%, transparent);
  text-underline-offset: 3px;
}

.card-title-link:hover .title-ext-ico {
  color: var(--card-accent);
  opacity: 1;
  transform: translate(1.5px, -1.5px);
}

.version-tag {
  font-family: var(--m-mono);
  font-size: 10.5px;
  font-weight: 650;
  color: var(--m-muted);
  background: var(--m-inset-bg);
  padding: 2px 7px;
  border-radius: 7px;
  border: 1px solid var(--m-hairline);
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 5.5px;
  font-size: 11px;
  color: var(--m-muted);
  min-width: 0;
  flex-wrap: wrap;
}

.card-slug {
  font-family: var(--m-mono);
  font-size: 10.6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 150px;
}

.meta-sep {
  opacity: 0.42;
  flex-shrink: 0;
}

.meta-star {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
  color: var(--m-text-2);
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}

.meta-star .ui-ico {
  color: #f59e0b;
}

.track-tag {
  font-size: 9.8px;
  font-weight: 650;
  padding: 1px 6px;
  border-radius: var(--m-r-pill);
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
  flex-shrink: 0;
}

.track-tag.is-github-url {
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border-color: var(--m-sky-border);
}

.meta-status-pill {
  font-size: 9.5px;
  font-weight: 640;
  letter-spacing: 0.02em;
  padding: 1px 5.5px;
  border-radius: var(--m-r-pill);
  flex-shrink: 0;
  white-space: nowrap;
}

.meta-status-pill.is-stale {
  background: var(--b-subtle-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.meta-status-pill.is-archived {
  background: var(--b-subtle-bg);
  color: var(--m-faint);
  border: 1px dashed var(--m-hairline-strong);
}

.meta-status-pill.is-compat {
  background: var(--m-accent-soft);
  color: var(--m-accent-bright);
  border: 1px solid var(--m-accent-border);
}

.self-running-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 650;
  padding: 1.5px 7px;
  border-radius: var(--m-r-pill);
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  color: var(--m-accent-bright);
  border: 1px solid var(--m-accent-border);
  white-space: nowrap;
}

.state-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 650;
  padding: 1.5px 7px;
  border-radius: var(--m-r-pill);
  flex-shrink: 0;
  white-space: nowrap;
}

.state-pill.is-enabled {
  background: var(--m-ok-soft);
  color: var(--m-ok);
  border: 1px solid var(--m-ok-border);
}

.state-pill.is-disabled {
  background: var(--b-subtle-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.state-pill.is-parked-tag {
  background: rgba(148, 163, 184, 0.14);
  color: var(--m-muted);
  border: 1px dashed var(--m-hairline-strong);
}

.state-pill.is-latest {
  font-size: 11px;
  font-weight: 660;
  line-height: 1.48;
  padding: 4.5px 9.5px;
  border-radius: var(--m-r-pill);
  background: linear-gradient(
    135deg,
    color-mix(in srgb, var(--m-ok) 18%, transparent),
    color-mix(in srgb, var(--m-ok) 10%, transparent)
  );
  color: var(--m-ok);
  border: 1px solid var(--m-ok-border);
  box-shadow:
    inset 0 1px 0 var(--m-specular),
    0 0 12px -4px rgba(16, 185, 129, 0.42);
  cursor: default;
  user-select: none;
}

.state-pill.is-local {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.48;
  padding: 4.5px 9px;
  border-radius: var(--m-r-pill);
  background: var(--b-subtle-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
  cursor: default;
  user-select: none;
}

.state-pill.is-external {
  font-size: 11px;
  font-weight: 620;
  line-height: 1.48;
  padding: 4.5px 9px;
  border-radius: var(--m-r-pill);
  background: var(--b-subtle-bg);
  color: var(--m-muted);
  border: 1px dashed var(--m-hairline-strong);
  cursor: default;
  user-select: none;
}

.state-pill.is-external.is-git-native {
  background: color-mix(in srgb, var(--m-accent-soft) 55%, var(--b-subtle-bg));
  color: var(--m-text-2);
  border-color: color-mix(in srgb, var(--m-accent-border) 55%, var(--m-hairline-strong));
}

.version-tag.is-unversioned-tag {
  border-style: dashed;
  color: var(--m-faint);
}

.card-desc {
  font-size: 12.2px;
  line-height: 1.56;
  color: var(--m-text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0;
  min-height: 38px;
  cursor: pointer;
}

/* Capability & Activation Badges */
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  cursor: pointer;
}

.cap-badge {
  font-size: 10.4px;
  font-weight: 560;
  padding: 2.5px 8px;
  border-radius: var(--m-r-pill);
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  line-height: 1.3;
}

.cap-badge.tone-green {
  background: var(--b-green-bg);
  color: var(--b-green-fg);
  border-color: var(--b-green-bd);
}
.cap-badge.tone-blue {
  background: var(--b-blue-bg);
  color: var(--b-blue-fg);
  border-color: var(--b-blue-bd);
}
.cap-badge.tone-purple {
  background: var(--b-purple-bg);
  color: var(--b-purple-fg);
  border-color: var(--b-purple-bd);
}
.cap-badge.tone-amber {
  background: var(--b-amber-bg);
  color: var(--b-amber-fg);
  border-color: var(--b-amber-bd);
}
.cap-badge.tone-cyan {
  background: var(--b-cyan-bg);
  color: var(--b-cyan-fg);
  border-color: var(--b-cyan-bd);
}
.cap-badge.tone-orange {
  background: var(--b-orange-bg);
  color: var(--b-orange-fg);
  border-color: var(--b-orange-bd);
}
.cap-badge.tone-subtle {
  background: var(--b-subtle-bg);
  color: var(--b-subtle-fg);
  border-color: var(--b-subtle-bd);
}

/* Category Micro-Tags (Taxonomy Pills) */
.cat-tag-pill {
  --cat-dot: var(--m-accent);
  font-size: 10.2px;
  font-weight: 600;
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  background: color-mix(in srgb, var(--cat-dot) 11%, var(--m-inset-bg));
  color: var(--m-text-2);
  border: 1px solid color-mix(in srgb, var(--cat-dot) 32%, var(--m-hairline));
  display: inline-flex;
  align-items: center;
  gap: 4.5px;
  white-space: nowrap;
  line-height: 1.3;
  font-family: inherit;
  transition:
    background var(--m-dur-fast) var(--m-ease-out),
    border-color var(--m-dur-fast) var(--m-ease-out),
    color var(--m-dur-fast) var(--m-ease-out);
}

.cat-tag-pill.is-clickable {
  cursor: pointer;
}

.cat-tag-pill.is-clickable:hover {
  background: color-mix(in srgb, var(--cat-dot) 20%, var(--m-ctl-hover));
  border-color: color-mix(in srgb, var(--cat-dot) 60%, var(--m-hairline-strong));
  color: var(--m-text);
}

.cat-tag-dot {
  width: 5.5px;
  height: 5.5px;
  border-radius: 50%;
  background: var(--cat-dot);
  box-shadow: 0 0 6px color-mix(in srgb, var(--cat-dot) 65%, transparent);
  flex-shrink: 0;
}

.cap-badge.is-more {
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  border-color: var(--m-hairline);
}

/* Post-Update Batch Result Pill (rendered ONLY after an update succeeds) */
.batch-act-pill {
  font-size: 10.2px;
  font-weight: 650;
  padding: 2.5px 8px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  gap: 3.5px;
  white-space: nowrap;
  line-height: 1.3;
  border: 1px solid transparent;
}

.batch-act-pill.is-reload-pane {
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border-color: var(--m-sky-border);
}

.batch-act-pill.is-host-restart {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(168, 85, 247, 0.16));
  color: var(--m-warn);
  border-color: var(--m-warn-border);
}

/* ==========================================================================
   Frosted Bottom Control Dock + Tactile iOS/Linear Toggle Slider
   ========================================================================== */

.card-dock {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding: 7.5px 9.5px;
  border-radius: 12px;
  background: var(--m-dock-bg);
  border: 1px solid var(--m-hairline);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.045),
    inset 0 1px 3px rgba(0, 0, 0, 0.14);
}

.dock-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex-wrap: wrap;
}

.dock-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 5px;
  flex-shrink: 0;
}

/* Luxurious iOS / Linear-grade Animated Toggle Slider */
.prism-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 2px 6px 2px 2px;
  border: none;
  background: transparent;
  color: var(--m-text-2);
  font-family: inherit;
  font-size: 11.2px;
  font-weight: 650;
  cursor: pointer;
  border-radius: var(--m-r-pill);
  user-select: none;
  transition: opacity var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out);
}

.prism-toggle:hover:not(:disabled) {
  color: var(--m-text);
}

.prism-toggle:disabled,
.prism-toggle.is-locked {
  cursor: default;
}

.prism-toggle-track {
  position: relative;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--m-toggle-off-bg);
  border: 1px solid var(--m-toggle-off-bd);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
  transition:
    background 220ms var(--m-ease-out),
    border-color 220ms var(--m-ease-out),
    box-shadow 240ms var(--m-ease-out);
  flex-shrink: 0;
}

.prism-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ffffff 0%, #e9eff8 100%);
  box-shadow:
    0 2px 5px rgba(0, 0, 0, 0.34),
    inset 0 1px 0 #ffffff;
  display: grid;
  place-items: center;
  transition: transform 240ms var(--m-ease-spring), box-shadow 220ms var(--m-ease-out);
}

.prism-toggle-thumb-core {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(100, 116, 139, 0.45);
  transition: background 220ms var(--m-ease-out), box-shadow 220ms var(--m-ease-out);
}

.prism-toggle.is-on .prism-toggle-track {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  border-color: rgba(52, 211, 153, 0.6);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 0 14px rgba(16, 185, 129, 0.42);
}

.prism-toggle.is-on .prism-toggle-thumb {
  transform: translateX(16px);
}

.prism-toggle.is-on .prism-toggle-thumb-core {
  background: #10b981;
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.7);
}

.prism-toggle.is-on .prism-toggle-label {
  color: var(--m-ok);
}

.prism-toggle.is-off .prism-toggle-label {
  color: var(--m-muted);
}

.prism-toggle.is-locked.is-on .prism-toggle-track {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(16, 185, 129, 0.85));
  border-color: var(--m-accent-border);
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.28);
}

.prism-toggle.is-locked .prism-toggle-label {
  color: var(--m-muted);
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.prism-toggle.is-busy {
  opacity: 0.72;
}

.dock-btn {
  font-size: 11px;
  font-weight: 600;
  color: var(--m-muted);
  text-decoration: none;
  padding: 4.5px 8px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
  transition:
    background var(--m-dur-fast) var(--m-ease-out),
    color var(--m-dur-fast) var(--m-ease-out),
    border-color var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.dock-btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline);
  color: var(--m-text);
}

.dock-btn:disabled,
.dock-btn.is-disabled {
  color: var(--m-muted);
  background: transparent;
  border-color: var(--m-hairline);
  opacity: 0.55;
  cursor: not-allowed;
}

.dock-btn.is-pane {
  color: var(--m-accent-bright);
  background: var(--m-accent-soft);
  border-color: color-mix(in srgb, var(--m-accent-border) 60%, transparent);
}

.dock-btn.is-pane:hover:not(:disabled) {
  border-color: var(--m-accent-border);
  background: color-mix(in srgb, var(--m-accent-soft) 130%, rgba(255, 255, 255, 0.05));
}

.dock-btn.is-update {
  color: var(--m-sky);
  background: color-mix(in srgb, var(--m-sky-soft) 72%, transparent);
  border-color: color-mix(in srgb, var(--m-sky-border) 68%, transparent);
}

.dock-btn.is-update:hover:not(:disabled) {
  background: var(--m-sky-soft);
  border-color: var(--m-sky);
  color: var(--m-sky);
}

.dock-btn.is-update:disabled,
.dock-btn.is-update.is-disabled {
  color: var(--m-muted);
  background: transparent;
  border-color: var(--m-hairline);
  opacity: 0.55;
  cursor: not-allowed;
}

.dock-btn.is-danger {
  color: var(--m-muted);
  background: transparent;
  border-color: transparent;
}

.dock-btn.is-danger:hover:not(:disabled) {
  color: var(--m-danger);
  background: var(--m-danger-soft);
  border-color: var(--m-danger-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.ghost-link {
  font-size: 11px;
  font-weight: 550;
  color: var(--m-muted);
  text-decoration: none;
  padding: 4px 7.5px;
  border-radius: 7px;
  background: transparent;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: background var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out), border-color var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.ghost-link:hover {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline);
  color: var(--m-text);
}

/* ==========================================================================
   Buttons (Aurora Gradient Primaries & Glass Secondaries)
   ========================================================================== */

.btn {
  border: 1px solid var(--m-hairline-strong);
  background: var(--m-ctl-bg);
  color: var(--m-text);
  padding: 5.5px 12px;
  border-radius: var(--m-r-sm);
  font-family: inherit;
  font-size: 11.8px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--m-specular);
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-accent-border);
}

.btn:active:not(:disabled) {
  transform: scale(0.975);
}

.btn:disabled {
  opacity: 0.56;
  cursor: not-allowed;
}

.btn-sm {
  padding: 4.5px 9.5px;
  font-size: 11px;
  border-radius: 8px;
}

.btn-primary {
  background: linear-gradient(135deg, #6366f1 0%, #7c3aed 55%, #0284c7 100%);
  border-color: rgba(165, 180, 252, 0.5);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    0 4px 14px -3px rgba(99, 102, 241, 0.5);
}

.btn-primary:hover:not(:disabled) {
  filter: brightness(1.08);
  border-color: rgba(199, 210, 254, 0.72);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.34),
    0 6px 18px -3px rgba(99, 102, 241, 0.62);
}

.btn-update {
  background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
  border-color: rgba(56, 189, 248, 0.6);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.26),
    0 4px 12px -3px rgba(14, 165, 233, 0.45);
}

.btn-update:hover:not(:disabled) {
  filter: brightness(1.08);
  border-color: rgba(125, 211, 252, 0.75);
}

.btn-update-outline {
  background: var(--m-sky-soft);
  border-color: var(--m-sky-border);
  color: var(--m-sky);
}

@media (hover: hover) {
  .btn-update-outline:hover:not(:disabled) {
    background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
    border-color: rgba(56, 189, 248, 0.7);
    color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 12px rgba(2, 132, 199, 0.34);
  }
}

.btn-fix {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(244, 63, 94, 0.2));
  border-color: var(--m-warn-border);
  color: var(--m-warn);
}

.btn-fix:hover:not(:disabled) {
  background: linear-gradient(135deg, #f59e0b 0%, #e11d48 100%);
  border-color: rgba(251, 191, 36, 0.75);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.36);
}

.notes-link {
  border: none;
  background: transparent;
  padding: 0 2px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 650;
  color: var(--m-sky);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  white-space: nowrap;
  flex-shrink: 0;
}

.notes-link:hover {
  text-decoration: underline;
}

.btn-installed {
  background: var(--m-ok-soft);
  border-color: var(--m-ok-border);
  color: var(--m-ok);
}

.btn-danger-ghost {
  background: transparent;
  border-color: var(--m-danger-border);
  color: var(--m-danger);
}

.btn-danger-ghost:hover:not(:disabled) {
  background: var(--m-danger-soft);
  border-color: var(--m-danger);
}

.btn-danger-solid {
  background: linear-gradient(135deg, #f43f5e 0%, #dc2626 100%);
  border-color: rgba(251, 113, 133, 0.65);
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 14px rgba(225, 29, 72, 0.38);
}

.btn-danger-solid:hover:not(:disabled) {
  filter: brightness(1.08);
}

.btn-primary:disabled,
.btn-update:disabled,
.btn-update-outline:disabled,
.btn-danger-solid:disabled,
.btn-danger-ghost:disabled {
  box-shadow: none;
  filter: saturate(0.3);
  cursor: not-allowed;
}

.pill-link {
  font-size: 11px;
  font-weight: 600;
  color: var(--m-accent-bright);
  text-decoration: none;
  padding: 3.5px 9px;
  border-radius: 8px;
  background: var(--m-accent-soft);
  border: 1px solid var(--m-accent-border);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
}

.pill-link:hover {
  filter: brightness(1.1);
}

/* ==========================================================================
   Conflicts & Diagnostics View (`冲突与诊断`)
   ========================================================================== */

.conflict-hero {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  padding: 13px 16px;
  margin-bottom: 14px;
  border-radius: var(--m-r-lg);
  overflow: hidden;
  background:
    radial-gradient(360px 200px at 0% 0%, rgba(16, 185, 129, 0.2), transparent 72%),
    radial-gradient(320px 180px at 100% 100%, rgba(56, 189, 248, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
  border: 1px solid var(--m-ok-border);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.conflict-hero.has-warnings {
  border-color: var(--m-warn-border);
  background:
    radial-gradient(360px 200px at 0% 0%, rgba(245, 158, 11, 0.2), transparent 72%),
    radial-gradient(320px 180px at 100% 100%, rgba(168, 85, 247, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
}

.conflict-hero.has-critical {
  border-color: var(--m-danger-border);
  background:
    radial-gradient(380px 200px at 0% 0%, rgba(244, 63, 94, 0.22), transparent 72%),
    radial-gradient(320px 180px at 100% 100%, rgba(245, 158, 11, 0.14), transparent 70%),
    var(--m-sheen),
    var(--m-card-bg);
}

.conflict-hero-copy {
  flex: 1 1 240px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.conflict-hero-title {
  margin: 0;
  font-size: 14px;
  font-weight: 760;
  color: var(--m-text);
  display: flex;
  align-items: flex-start;
  gap: 7px;
  line-height: 1.35;
}

.conflict-hero-title .ui-ico {
  margin-top: 2px;
  flex-shrink: 0;
}

.conflict-kpi-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}

.conflict-kpi-pill {
  font-size: 11px;
  font-weight: 650;
  padding: 3px 9px;
  border-radius: var(--m-r-pill);
  border: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  color: var(--m-text-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
}

.conflict-kpi-pill.is-critical {
  border-color: var(--m-danger-border);
  background: var(--m-danger-soft);
  color: var(--m-danger);
}

.conflict-kpi-pill.is-warning {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.conflict-kpi-pill.is-info {
  border-color: var(--m-sky-border);
  background: var(--m-sky-soft);
  color: var(--m-sky);
}

.conflict-kpi-pill.is-ok {
  border-color: var(--m-ok-border);
  background: var(--m-ok-soft);
  color: var(--m-ok);
}

.conflict-hero-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.conflict-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.conflict-card {
  position: relative;
  border-radius: var(--m-r-lg);
  padding: 14px 16px 14px 19px;
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

.conflict-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3.5px;
  background: var(--m-sky);
}

.conflict-card.sev-critical {
  border-color: color-mix(in srgb, var(--m-danger-border) 75%, var(--m-hairline));
}
.conflict-card.sev-critical::before {
  background: linear-gradient(180deg, #fb7185, #e11d48);
}

.conflict-card.sev-warning {
  border-color: color-mix(in srgb, var(--m-warn-border) 75%, var(--m-hairline));
}
.conflict-card.sev-warning::before {
  background: linear-gradient(180deg, #fbbf24, #f97316);
}

.conflict-card.sev-info {
  border-color: color-mix(in srgb, var(--m-sky-border) 75%, var(--m-hairline));
}
.conflict-card.sev-info::before {
  background: linear-gradient(180deg, #38bdf8, #6366f1);
}

.conflict-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px 12px;
}

.conflict-card-title-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  flex: 1;
}

.conflict-card-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.sev-pill {
  font-size: 10.2px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.sev-pill.sev-critical {
  background: var(--m-danger-soft);
  color: var(--m-danger);
  border: 1px solid var(--m-danger-border);
}

.sev-pill.sev-warning {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.sev-pill.sev-info {
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
}

.layer-tag {
  font-size: 10.2px;
  font-weight: 600;
  font-family: var(--m-mono);
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-inset-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.conflict-card-title {
  margin: 0;
  font-size: 13.6px;
  font-weight: 720;
  color: var(--m-text);
}

.conflict-card-desc {
  margin: 0;
  font-size: 12px;
  line-height: 1.54;
  color: var(--m-text-2);
}

.conflict-compare {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}

.conflict-path-box {
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.conflict-path-box.is-winner {
  border-color: var(--m-ok-border);
  background: color-mix(in srgb, var(--m-ok-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-shadowed {
  border-color: var(--m-danger-border);
  background: color-mix(in srgb, var(--m-danger-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-warn-box {
  border-color: var(--m-warn-border);
  background: color-mix(in srgb, var(--m-warn-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-info-box {
  border-color: var(--m-sky-border);
  background: color-mix(in srgb, var(--m-sky-soft) 45%, var(--m-inset-bg));
}

.conflict-affected-box {
  grid-column: 1 / -1;
}

.conflict-box-label {
  font-size: 10.6px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.conflict-path-box.is-winner .conflict-box-label {
  color: var(--m-ok);
}

.conflict-path-box.is-shadowed .conflict-box-label {
  color: var(--m-danger);
}

.conflict-path-box.is-warn-box .conflict-box-label {
  color: var(--m-warn);
}

.conflict-path-box.is-info-box .conflict-box-label {
  color: var(--m-sky);
}

.conflict-path-line {
  font-family: var(--m-mono);
  font-size: 10.8px;
  color: var(--m-text-2);
  word-break: break-all;
  line-height: 1.45;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.scope-chip {
  font-size: 9.8px;
  font-weight: 650;
  padding: 0.5px 5.5px;
  border-radius: 5px;
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  color: var(--m-muted);
}

/* ==========================================================================
   Skeleton Loaders & Empty States
   ========================================================================== */

.skel-card {
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.skel-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skel {
  border-radius: 6px;
  background: linear-gradient(90deg, var(--m-skel-base) 25%, var(--m-skel-shine) 50%, var(--m-skel-base) 75%);
  background-size: 200% 100%;
  animation: agy-shimmer 1.35s ease-in-out infinite;
}

.skel-avatar {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  flex-shrink: 0;
}

.skel-line {
  height: 11px;
}

.skel-pill {
  height: 20px;
  width: 82px;
  border-radius: 999px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 9px;
  padding: 46px 22px;
  border: 1px dashed var(--m-hairline-strong);
  border-radius: var(--m-r-lg);
  background: var(--m-card-bg);
  color: var(--m-muted);
}

.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-sky-soft));
  border: 1px solid var(--m-accent-border);
  display: grid;
  place-items: center;
  color: var(--m-accent-bright);
  margin-bottom: 2px;
}

.empty-title {
  font-weight: 740;
  font-size: 14px;
  color: var(--m-text);
}

.empty-sub {
  max-width: 420px;
  font-size: 12px;
  color: var(--m-muted);
}

/* ==========================================================================
   Slide-Over Detail Drawer (Aurora Header + Clickable GitHub Title + Toggle)
   ========================================================================== */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: flex;
  justify-content: flex-end;
  z-index: 45;
}

.drawer-panel {
  --card-accent: #6366f1;
  --card-accent-2: #06b6d4;

  background: var(--m-sheet-bg);
  backdrop-filter: blur(24px) saturate(155%);
  -webkit-backdrop-filter: blur(24px) saturate(155%);
  border-left: 1px solid var(--m-hairline-strong);
  box-shadow: var(--m-shadow-sheet);
  display: flex;
  flex-direction: column;

  animation: agy-drawer-in var(--m-dur-slow) var(--m-ease-out);

.drawer-hero {

  background:
    radial-gradient(360px 180px at 0% 0%, color-mix(in srgb, var(--card-accent) 22%, transparent), transparent 72%),
    radial-gradient(280px 150px at 100% 0%, color-mix(in srgb, var(--card-accent-2) 16%, transparent), transparent 70%),
    var(--m-sheen);

  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
}

.drawer-hero-top {

  align-items: flex-start;
  gap: 13px;
}

.drawer-hero-info {

}

.drawer-title {
  font-size: 16px;
  font-weight: 760;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: var(--m-text);
  word-break: break-word;
  line-height: 1.3;
}

.drawer-title-link {
  color: inherit;
  text-decoration: none;
  display: inline-flex;
  align-items: center;

  transition: color var(--m-dur-fast) var(--m-ease-out);

.drawer-title-link:hover {
  color: var(--m-accent-bright);

.drawer-subtitle {

  flex-wrap: wrap;
  align-items: center;
  gap: 6px;

.drawer-cta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.drawer-toggle-box {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px 2px 4px;

.drawer-tabs {

.drawer-tab {

  font-size: 11.8px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;

  transition: all var(--m-dur-fast) var(--m-ease-out);

.drawer-tab:hover {
  color: var(--m-text);
  background: var(--m-ctl-bg);
}

.drawer-tab.active {

  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  font-size: 11.2px;
  color: var(--m-muted);
}

.readme-lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 650;
  color: var(--m-accent-bright);
}

.asar-patch-guide-box {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: linear-gradient(135deg, var(--m-warn-soft), var(--m-accent-soft));
  border: 1px solid var(--m-warn-border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.asar-patch-guide-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--m-warn);
}

.asar-patch-guide-text {
  margin: 0;
  font-size: 11.6px;
  line-height: 1.5;
  color: var(--m-text-2);
}

.asar-patch-guide-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 8px;
  padding-top: 2px;
}

.asar-patch-path {
  font-size: 10.6px;
  color: var(--m-text);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  border-radius: 6px;
  padding: 2.5px 7px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Capabilities breakdown inside drawer */
.cap-detail-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cap-detail-card {
  padding: 10.5px 12.5px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.cap-detail-desc {
  font-size: 11.8px;
  color: var(--m-muted);
  margin: 0;
  line-height: 1.5;
}

.meta-kv {
  display: grid;
  grid-template-columns: 104px 1fr;
  gap: 6px 10px;
  font-size: 11.5px;
  padding: 11px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  word-break: break-all;
}

.meta-kv-val {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.mono {
  font-family: var(--m-mono);
  font-size: 11px;
}

/* Discussions tab inside drawer */
.discuss-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.discuss-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.discuss-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 11px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  text-decoration: none;
  color: inherit;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), background var(--m-dur-fast) var(--m-ease-out);
}

.discuss-item:hover {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg-hover);
}

.discuss-item-title {
  font-weight: 650;
  font-size: 12.6px;
  color: var(--m-text);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.discuss-item-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--m-muted);
}

.discuss-cat-pill {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-accent-soft);
  color: var(--m-accent-bright);
  border: 1px solid var(--m-accent-border);
}

.discuss-info-box {
  padding: 14px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* Changelog tab card */
.changelog-banner {
  padding: 11px 13px;
  border-radius: var(--m-r-md);
  background: var(--m-sky-soft);
  border: 1px solid var(--m-sky-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.changelog-banner.is-upstream {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
}

/* ==========================================================================
   Settings / Sources Panel
   ========================================================================== */

.settings-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 720px;
}

.field-card {
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
}

.field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.field-label {
  font-weight: 700;
  font-size: 12.6px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.field-hint {
  font-size: 11.6px;
  color: var(--m-muted);
  margin: 0;
  line-height: 1.5;
}

.telemetry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 8px;
}

.telemetry-cell {
  padding: 8.5px 10.5px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.telemetry-k {
  font-size: 10.5px;
  color: var(--m-muted);
}

.telemetry-v {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--m-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.token-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.token-row .text-input {
  flex: 1 1 auto;
}

/* ==========================================================================
   Modals & Reconnect Overlay
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 55;
}

.modal-box {
  background: var(--m-sheet-bg);
  border: 1px solid var(--m-hairline-strong);
  border-radius: var(--m-r-xl);
  width: 100%;
  max-width: 520px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-modal);
  animation: agy-modal-in 210ms var(--m-ease-spring);
}

.modal-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--m-hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 700;
  font-size: 13.5px;
}

.modal-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-body {
  padding: 14px 16px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 11px;
  font-size: 12.4px;
}

.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.uninstall-fav-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8.5px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  color: var(--m-text-2);
  font-size: 11.8px;
  cursor: pointer;
  user-select: none;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out);
}

.uninstall-fav-check:hover {
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.uninstall-fav-check input[type='checkbox'] {
  accent-color: var(--m-danger);
  width: 14px;
  height: 14px;
  margin: 0;
  cursor: pointer;
}

.escalation-item {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-warn-border);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.escalation-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
}

.empty-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 2px;
}

/* GitHub URL Two-Step Inspect & Install Modal */
.gh-url-modal {
  max-width: 560px;
}

.gh-url-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.gh-url-input {
  width: 100%;
  height: 36px;
  font-family: var(--m-mono);
  font-size: 12px;
}

.gh-url-formats {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11.4px;
  color: var(--m-muted);
}

.gh-url-formats-title {
  font-weight: 650;
  color: var(--m-text-2);
  margin-bottom: 1px;
}

.gh-url-format-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
}

.gh-url-format-row code {
  font-family: var(--m-mono);
  font-size: 10.8px;
  color: var(--m-text);
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  padding: 1px 6px;
  border-radius: 5px;
  word-break: break-all;
}

.gh-inline-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-danger-soft);
  border: 1px solid var(--m-danger-border);
  color: var(--m-danger);
  font-size: 11.8px;
  line-height: 1.48;
  word-break: break-word;
}

.gh-progress-box {
  padding: 18px 14px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 9px;
}

.gh-progress-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--m-text);
}

.gh-progress-url {
  font-family: var(--m-mono);
  font-size: 11px;
  color: var(--m-muted);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.gh-subpath-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.gh-subpath-item {
  width: 100%;
  text-align: left;
  font-family: inherit;
  color: inherit;
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  transition:
    border-color var(--m-dur-fast) var(--m-ease-out),
    background var(--m-dur-fast) var(--m-ease-out);
}

.gh-subpath-item:hover {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg-hover);
}

.gh-subpath-copy {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex: 1;
}

.gh-subpath-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.gh-subpath-name {
  font-weight: 700;
  font-size: 12.6px;
  color: var(--m-text);
}

.gh-subpath-path {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--m-mono);
  font-size: 10.6px;
  color: var(--m-accent-bright);
  background: var(--m-accent-soft);
  border: 1px solid var(--m-accent-border);
  padding: 1px 6.5px;
  border-radius: var(--m-r-pill);
}

.gh-subpath-desc {
  font-size: 11.5px;
  color: var(--m-muted);
  line-height: 1.45;

  overflow: hidden;
}

.gh-preview-card {
  padding: 12px 13px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.gh-preview-head {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.gh-preview-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.gh-preview-name {
  font-size: 14px;
  font-weight: 740;
  color: var(--m-text);
}

.gh-meta-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.gh-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--m-mono);
  font-size: 10.4px;
  font-weight: 600;
  padding: 1.5px 7px;
  border-radius: var(--m-r-pill);
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
}

.gh-meta-pill.is-subtle {
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  border-color: var(--m-hairline);
}

.gh-preview-desc {
  margin: 0;
  font-size: 12px;
  line-height: 1.52;
  color: var(--m-text-2);
}

.gh-meta-grid {
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 5px 10px;
  font-size: 11.4px;
  padding-top: 7px;
  border-top: 1px solid var(--m-hairline);
  align-items: center;
}

.gh-meta-val {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
}

.gh-notice-box {
  padding: 9px 11px;
  border-radius: var(--m-r-sm);
  font-size: 11.6px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.gh-notice-box.is-info {
  background: var(--m-sky-soft);
  border: 1px solid var(--m-sky-border);
  color: var(--m-text-2);
}

.gh-notice-box.is-warn {
  background: var(--m-warn-soft);
  border: 1px solid var(--m-warn-border);
  color: var(--m-text-2);
}

.gh-notice-box.is-nomination {
  background: linear-gradient(135deg, var(--m-accent-soft), var(--m-ok-soft));
  border: 1px solid var(--m-accent-border);
  color: var(--m-text-2);
}

.gh-nomination-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
}

.gh-nominate-btn {
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
  background: var(--m-ctl-bg);
}

.nomination-notice-banner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 14px;
  background: linear-gradient(96deg, var(--m-accent-soft) 0%, var(--m-ok-soft) 100%);
  border-bottom: 1px solid var(--m-accent-border);
  flex-shrink: 0;
  z-index: 21;
}

.nomination-notice-main {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  min-width: 0;
  flex: 1;
}

.nomination-notice-icon {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: var(--m-accent-soft);
  border: 1px solid var(--m-accent-border);
  color: var(--m-accent-bright);
  margin-top: 1px;
}

.nomination-notice-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.nomination-notice-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 12.2px;
  font-weight: 700;
  color: var(--m-text);
}

.nomination-notice-reason {
  font-size: 11.2px;
  color: var(--m-muted);
  line-height: 1.44;
}

.gh-notice-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 680;
  color: var(--m-text);
}

.gh-notice-list {
  margin: 0;
  padding-left: 17px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.gh-mode-section {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.gh-mode-label {
  font-size: 11.6px;
  font-weight: 680;
  color: var(--m-text-2);
}

.gh-mode-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.gh-mode-option {
  width: 100%;
  text-align: left;
  font-family: inherit;
  color: inherit;
  padding: 9px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  align-items: flex-start;
  gap: 9px;
  cursor: pointer;
  transition:
    border-color var(--m-dur-fast) var(--m-ease-out),
    background var(--m-dur-fast) var(--m-ease-out);
}

.gh-mode-option:hover:not(:disabled) {
  border-color: var(--m-hairline-strong);
  background: var(--m-card-bg-hover);
}

.gh-mode-option.is-selected {
  border-color: var(--m-accent-border);
  background: var(--m-accent-soft);
}

.gh-mode-option:disabled {
  opacity: 0.6;
  cursor: default;
}

.gh-mode-radio {

  height: 15px;
  margin-top: 2px;
