<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>AGY Market · 反重力插件市场</title>
  <script src="/preload.js"></script>
  <style id="agy-market-styles">
/* ==========================================================================
   AGY Market — Sidebar Panel Stylesheet (`src/ui/styles.css`)
   Dark monochrome surfaces with the host font stack.
   ========================================================================== */

:root {
  --m-font: var(
    --font-sans,
    'Google Sans Flex',
    'Google Sans',
    'Inter',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    'Noto Sans SC',
    'PingFang SC',
    'Microsoft YaHei UI',
    system-ui,
    sans-serif
  );
  --m-mono: var(
    --font-mono,
    'Google Sans Code',
    'JetBrains Mono',
    'Cascadia Code',
    'SF Mono',
    Consolas,
    ui-monospace,
    monospace
  );

  /* Shape and motion */
  --m-r-xs: 6px;
  --m-r-sm: 7px;
  --m-r-md: 9px;
  --m-r-lg: 11px;
  --m-r-xl: 14px;
  --m-r-pill: 999px;
  --m-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --m-dur-fast: 140ms;
  --m-dur-base: 220ms;
  --m-dur-slow: 300ms;
  --m-bg-raw: #191919;
  --m-surface-raw: #202020;
  --m-text: #ebebeb;
  --m-text-2: #c7c7c7;
  --m-muted: #9b9b9b;
  --m-faint: #6e6e6e;
  --m-sticky-bg: var(--m-bg-raw);
  --m-stuck-bg: var(--m-bg-raw);
  --m-card-bg: var(--m-surface-raw);
  --m-card-bg-hover: #2a2a2a;
  --m-dock-bg: var(--m-bg-raw);
  --m-inset-bg: #141414;
  --m-sheet-bg: var(--m-surface-raw);
  --m-ctl-bg: #2a2a2a;
  --m-ctl-hover: #2f2f2f;
  --m-hairline: rgba(255, 255, 255, 0.08);
  --m-hairline-strong: rgba(255, 255, 255, 0.14);
  --m-accent: var(--m-text);
  --m-accent-bright: var(--m-text);
  --m-accent-hover: #d8d8d8;
  --m-accent-soft: var(--m-ctl-hover);
  --m-accent-border: var(--m-hairline-strong);

  /* These tokens are also referenced by inline status styles in app.mjs. */
  --m-sky: var(--m-text-2);
  --m-sky-soft: var(--m-ctl-bg);
  --m-sky-border: var(--m-hairline-strong);
  --m-ok: #4dab9a;
  --m-ok-soft: var(--m-ctl-bg);
  --m-ok-border: var(--m-hairline-strong);
  --m-warn: #d9730d;
  --m-warn-soft: var(--m-ctl-bg);
  --m-warn-border: var(--m-hairline-strong);
  --m-danger: #e16259;
  --m-danger-soft: var(--m-ctl-bg);
  --m-danger-border: var(--m-hairline-strong);
  --b-subtle-bg: var(--m-ctl-bg);
  --b-subtle-fg: var(--m-muted);
  --b-subtle-bd: var(--m-hairline);
  --m-backdrop: rgba(0, 0, 0, 0.54);
  --m-skel-base: var(--m-ctl-bg);
  --m-toggle-off-bg: var(--m-ctl-hover);
  --m-toggle-off-bd: var(--m-hairline-strong);
  --m-toggle-thumb: var(--m-text);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--m-bg-raw);
  color: var(--m-text);
  font-family: var(--m-font);
  font-size: 13px;
  line-height: 1.48;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ==========================================================================
   Canvas & Container-Query Shell
   ========================================================================== */

.market-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  container-type: inline-size;
  container-name: market;
  background: var(--m-bg-raw);
}

/* Custom sleek scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--m-hairline-strong);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--m-faint);
}

.ui-ico {
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

.spin {
  animation: agy-spin 0.85s linear infinite;
}

@keyframes agy-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes agy-drawer-in {
  from {
    opacity: 0.5;
    transform: translateX(100%);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes agy-modal-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes agy-toast-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes agy-bar-slide {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(220%);
  }
}

/* ==========================================================================
   Header & 5-Tab Segmented Navigation
   ========================================================================== */

.app-header {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 11px 16px 10px;
  background: var(--m-sticky-bg);
  border-bottom: 1px solid var(--m-hairline);
  flex-shrink: 0;
  z-index: 25;
}

.market-shell[data-stuck="true"] .app-header {
  background: var(--m-stuck-bg);
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.brand-mark .agy-brand-logo {
  width: 30px;
  height: 30px;
  display: block;
}

.brand-copy {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.brand-title {
  font-size: 14px;
  font-weight: 760;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--m-text);
}

.brand-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-family: var(--m-mono);
  color: var(--m-muted);
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  white-space: nowrap;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--m-ok);
  flex-shrink: 0;
}

.status-dot.is-warn {
  background: var(--m-warn);
}

.status-dot.is-pulse {
  background: var(--m-sky);
}

.segmented-nav {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3.5px;
  border-radius: 12px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  flex-shrink: 0;
}

.nav-pill {
  position: relative;
  border: 1px solid transparent;
  background: transparent;
  color: var(--m-muted);
  padding: 5.5px 10.5px;
  border-radius: 8.5px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.nav-pill:hover {
  color: var(--m-text);
  background: var(--m-ctl-bg);
}

.nav-pill.active {
  background: var(--m-accent);
  color: var(--m-bg-raw);
  border-color: var(--m-hairline-strong);
}

.nav-count {
  font-size: 10.2px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--m-muted);
  background: var(--m-ctl-bg);
  padding: 0 5.5px;
  min-width: 18px;
  height: 17px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.nav-pill.active .nav-count {
  background: var(--m-bg-raw);
  color: var(--m-text);
}

.nav-count.is-fav {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.nav-pill .fav-nav-ico {
  color: currentColor;
}

.nav-update-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 700;
  padding: 0 6px;
  height: 17px;
  border-radius: var(--m-r-pill);
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
}

.nav-conflict-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 17px;
  padding: 0 5.5px;
  border-radius: var(--m-r-pill);
  font-variant-numeric: tabular-nums;
}

.nav-conflict-badge.is-healthy {
  background: var(--m-ok-soft);
  color: var(--m-ok);
  border: 1px solid var(--m-ok-border);
}

.nav-conflict-badge.is-warn {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.nav-conflict-badge.is-critical {
  background: var(--m-danger-soft);
  color: var(--m-danger);
  border: 1px solid var(--m-danger-border);
}

.tab-red-dot {
  width: 6.5px;
  height: 6.5px;
  border-radius: 50%;
  background: var(--m-danger);
  flex-shrink: 0;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.icon-btn {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text-2);
  height: 30px;
  padding: 0 9.5px;
  border-radius: var(--m-r-sm);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.icon-btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.icon-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.icon-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.icon-btn.is-square {
  width: 30px;
  padding: 0;
}

.icon-btn.has-alert {
  border-color: var(--m-sky-border);
  background: var(--m-sky-soft);
  color: var(--m-sky);
}

/* Sleek Accent-Bordered "+ 申请收录插件" CTA */
.submit-plugin-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 30px;
  padding: 0 11px;
  border-radius: var(--m-r-sm);
  border: 1px solid var(--m-accent-border);
  background: var(--m-ctl-bg);
  color: var(--m-accent-bright);
  text-decoration: none;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 660;
  white-space: nowrap;
  cursor: pointer;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.submit-plugin-btn:hover {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.submit-plugin-btn:active {
  transform: scale(0.97);
}

.add-url-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 30px;
  padding: 0 10.5px;
  border-radius: var(--m-r-sm);
  border: 1px solid var(--m-hairline-strong);
  background: var(--m-ctl-bg);
  color: var(--m-text);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 640;
  white-space: nowrap;
  cursor: pointer;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.add-url-btn:hover {
  background: var(--m-accent-soft);
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
}

.add-url-btn:active {
  transform: scale(0.97);
}

/* ==========================================================================
   Prominent Red Glass Error Alert Banner (Install / Update / Self-Update Fail)
   ========================================================================== */

.error-alert-banner {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px 14px;
  padding: 11px 16px 11px 19px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--m-danger-border);
  background: var(--m-card-bg);
  animation: agy-toast-in 210ms var(--m-ease-out);
  z-index: 23;
}

.error-alert-banner::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3.5px;
  background: var(--m-danger);
}

.error-alert-main {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.error-alert-icon {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: var(--m-danger-soft);
  color: var(--m-danger);
}

.error-alert-copy {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex: 1;
}

.error-alert-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 12.6px;
  font-weight: 740;
  color: var(--m-danger);
}

.error-alert-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.error-alert-item {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
  font-size: 11.7px;
  line-height: 1.45;
  color: var(--m-text);
}

.error-plugin-chip {
  font-family: var(--m-mono);
  font-size: 10.4px;
  font-weight: 650;
  padding: 1px 7px;
  border-radius: var(--m-r-pill);
  background: var(--m-danger-soft);
  border: 1px solid var(--m-danger-border);
  color: var(--m-danger);
  white-space: nowrap;
}

.error-alert-detail {
  color: var(--m-text-2);
  word-break: break-word;
}

.error-alert-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ==========================================================================
   Smart Restart / Reload Banner & Self-Update Banner
   ========================================================================== */

.restart-notice-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  padding: 10px 16px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--m-warn-border);
  background: var(--m-card-bg);
  animation: agy-toast-in 220ms var(--m-ease-out);
  z-index: 22;
}

.restart-notice-banner.is-reload-pane {
  border-bottom-color: var(--m-sky-border);
  background: var(--m-card-bg);
}

.restart-notice-main {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.restart-notice-icon {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: var(--m-card-bg);
  color: var(--m-text);
}

.restart-notice-banner.is-reload-pane .restart-notice-icon {
  background: var(--m-card-bg);
}

.restart-notice-copy {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.restart-notice-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 12.4px;
  font-weight: 700;
  color: var(--m-text);
}

.restart-notice-reason {
  font-size: 11.6px;
  color: var(--m-text-2);
  line-height: 1.45;
}

.restart-notice-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 2px;
}

.restart-plugin-chip {
  font-family: var(--m-mono);
  font-size: 10.2px;
  padding: 1px 6.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline-strong);
  color: var(--m-text-2);
}

.restart-patch-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
}

.self-update-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 16px;
  background: var(--m-card-bg);
  border-bottom: 1px solid var(--m-accent-border);
  flex-shrink: 0;
  animation: agy-toast-in 220ms var(--m-ease-out);
}

.self-update-main {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}

.self-update-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--m-ctl-hover);
  color: var(--m-text);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.self-update-text {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-width: 0;
  font-size: 12px;
}

.self-update-title {
  font-weight: 700;
  color: var(--m-text);
}

.version-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--m-mono);
  font-size: 10.5px;
  font-weight: 650;
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
  white-space: nowrap;
  flex-shrink: 0;
}

.version-delta.is-upstream {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border-color: var(--m-warn-border);
}

.self-update-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ==========================================================================
   Collapsible Overview Hero Strip
   ========================================================================== */

.aurora-hero {
  position: relative;
  border-radius: var(--m-r-lg);
  padding: 13px 16px;
  margin-bottom: 14px;
  overflow: hidden;
  background: var(--m-card-bg);
  border: 1px solid color-mix(in srgb, var(--m-accent-border) 55%, var(--m-hairline));
}

.aurora-hero.is-collapsed {
  padding: 9px 14px;
}

.aurora-hero-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.aurora-hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.aurora-hero-brand {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.aurora-kicker {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--m-accent-bright);
}

.aurora-hero-title {
  margin: 0;
  font-size: 15.5px;
  font-weight: 760;
  letter-spacing: -0.02em;
  color: var(--m-text);
}

.hero-collapse-btn {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  height: 26px;
  padding: 0 8px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.hero-collapse-btn:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
  border-color: var(--m-hairline-strong);
}

.hero-stats-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.hero-stat-pill {
  position: relative;
  border: 1px solid var(--m-hairline);
  background: color-mix(in srgb, var(--m-inset-bg) 72%, rgba(255, 255, 255, 0.03));
  border-radius: 11px;
  padding: 8px 10.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .hero-stat-pill:hover {
    transform: translateY(-1px);
    border-color: var(--m-hairline-strong);
    background: var(--m-card-bg-hover);
  }
}

.hero-stat-meta {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.hero-stat-label {
  font-size: 10.5px;
  color: var(--m-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hero-stat-val {
  font-size: 14px;
  font-weight: 760;
  font-variant-numeric: tabular-nums;
  color: var(--m-text);
  line-height: 1.25;
  white-space: nowrap;
}

.hero-stat-ico {
  width: 28px;
  height: 28px;
  border-radius: 8.5px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.hero-stat-pill.tone-indigo .hero-stat-ico {
  background: var(--m-accent-soft);
  color: var(--m-accent-bright);
}
.hero-stat-pill.tone-emerald .hero-stat-ico {
  background: var(--m-ok-soft);
  color: var(--m-ok);
}
.hero-stat-pill.tone-sky .hero-stat-ico {
  background: var(--m-sky-soft);
  color: var(--m-sky);
}
.hero-stat-pill.tone-warn {
  border-color: var(--m-warn-border);
}
.hero-stat-pill.tone-warn .hero-stat-ico {
  background: var(--m-warn-soft);
  color: var(--m-warn);
}
.hero-stat-pill.tone-danger {
  border-color: var(--m-danger-border);
}
.hero-stat-pill.tone-danger .hero-stat-ico {
  background: var(--m-danger-soft);
  color: var(--m-danger);
}

.aurora-hero-compact-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.aurora-compact-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.compact-stat-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text-2);
  padding: 2.5px 8.5px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}

.compact-stat-chip:hover {
  border-color: var(--m-hairline-strong);
  background: var(--m-ctl-hover);
}

/* ==========================================================================
   Discover Filter Bar & Category Chips
   ========================================================================== */

.filter-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 16px 9px;
  background: var(--m-sticky-bg);
  border-bottom: 1px solid var(--m-hairline);
  flex-shrink: 0;
  z-index: 20;
}

.market-shell[data-stuck="true"] .filter-bar {
  background: var(--m-stuck-bg);
}

.filter-row-top {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  flex: 1 1 200px;
  display: flex;
  align-items: center;
}

.search-box .search-ico {
  position: absolute;
  left: 11px;
  color: var(--m-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 33px;
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 10px;
  padding: 0 34px 0 32px;
  font-family: inherit;
  font-size: 12.2px;
  outline: none;
}

.search-input::placeholder {
  color: var(--m-faint);
}

.search-input:focus {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg);
}

.search-clear {
  position: absolute;
  right: 6px;
  border: none;
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}

.search-clear:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.search-kbd {
  position: absolute;
  right: 9px;
  font-family: var(--m-mono);
  font-size: 10px;
  color: var(--m-faint);
  border: 1px solid var(--m-hairline);
  border-radius: 4px;
  padding: 0 4.5px;
  line-height: 16px;
  pointer-events: none;
}

.select-input,
.text-input {
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 9px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
}

.select-input {
  height: 33px;
  cursor: pointer;
}

.select-input:focus,
.text-input:focus {
  border-color: var(--m-accent-border);
}

.track2-pill {
  height: 33px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10.5px;
  border-radius: 9px;
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.track2-pill:hover:not(.is-disabled):not(.is-saving) {
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.track2-pill.is-disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.track2-pill.is-saving {
  opacity: 0.88;
  cursor: progress;
  border-color: var(--m-accent-border);
}

.track2-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.track2-saving-text {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--m-accent-bright);
}

.load-more-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 0 10px;
}

.load-more-sentinel {
  width: 100%;
  height: 1px;
}

.load-more-meta {
  font-size: 11.5px;
  color: var(--m-muted);
}

.track2-pill.enabled {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.track2-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.switch-track {
  width: 24px;
  height: 14px;
  border-radius: 999px;
  background: var(--m-hairline-strong);
  position: relative;
  flex-shrink: 0;
}

.switch-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--m-text);
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.track2-pill.enabled .switch-track {
  background: var(--m-accent);
}

.track2-pill.enabled .switch-track::after {
  background: var(--m-bg-raw);
  transform: translateX(10px);
}

/* Category horizontal chip strip */
.chip-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.chip-strip::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  padding: 4.5px 11px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.cat-chip:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.cat-chip.active {
  background: var(--m-accent);
  border-color: var(--m-accent-border);
  color: var(--m-bg-raw);
  font-weight: 650;
}

.cat-chip-n {
  font-size: 10px;
  opacity: 0.78;
  font-variant-numeric: tabular-nums;
}

/* Installed View Status Filter Pills */
.status-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  padding: 4.5px 11px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 560;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.status-chip:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.status-chip.active {
  background: var(--m-card-bg);
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
  font-weight: 660;
}

.status-chip.active.is-enabled-filter {
  background: var(--m-ok-soft);
  border-color: var(--m-ok-border);
  color: var(--m-ok);
}

.status-chip.active.is-disabled-filter {
  background: var(--b-subtle-bg);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.status-chip.active.is-updatable-filter {
  background: var(--m-sky-soft);
  border-color: var(--m-sky-border);
  color: var(--m-sky);
}

/* ==========================================================================
   Collapsible Pinned Favorites Shelf (`★ 我的收藏栏`)
   ========================================================================== */

.fav-shelf {
  position: relative;
  border-radius: var(--m-r-lg);
  padding: 12px 14px;
  margin-bottom: 14px;
  overflow: hidden;
  background: var(--m-ctl-bg);
  border: 1px solid color-mix(in srgb, var(--m-warn-border) 68%, var(--m-hairline));
}

.fav-shelf.is-collapsed {
  padding: 8.5px 13px;
}

.fav-shelf-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.fav-shelf-title-group {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.fav-shelf-star {
  color: var(--m-text-2);
  display: inline-flex;
  align-items: center;
}

.fav-shelf-title {
  font-size: 12.6px;
  font-weight: 740;
  color: var(--m-text);
  letter-spacing: -0.01em;
}

.fav-shelf-count {
  font-size: 10.4px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 1px 7px;
  border-radius: var(--m-r-pill);
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.fav-shelf-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.fav-shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(295px, 1fr));
  gap: 9px;
  margin-top: 10px;
}

.fav-shelf-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 11px;
  background: color-mix(in srgb, var(--m-inset-bg) 78%, rgba(255, 255, 255, 0.03));
  border: 1px solid var(--m-hairline);
  cursor: pointer;
  min-width: 0;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .fav-shelf-item:hover {
    transform: translateY(-1px);
    border-color: var(--m-hairline-strong);
    background: var(--m-card-bg-hover);
  }
}

.fav-shelf-item-left {
  display: flex;
  align-items: center;
  gap: 8.5px;
  min-width: 0;
  flex: 1;
}

.fav-mini-logo {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 760;
  color: var(--m-text);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.fav-mini-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--m-surface-raw);
}

.fav-mini-logo img:not(.agy-brand-logo),
.plugin-logo img:not(.agy-brand-logo) {
  filter: grayscale(1);
}

.fav-mini-logo svg {
  width: 100%;
  height: 100%;
  display: block;
}

.fav-shelf-copy {
  display: flex;
  flex-direction: column;
  gap: 1.5px;
  min-width: 0;
}

.fav-shelf-name {
  font-size: 11.8px;
  font-weight: 680;
  color: var(--m-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fav-shelf-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.3px;
  color: var(--m-muted);
  font-family: var(--m-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fav-shelf-item-right {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.fav-shelf-compact-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.fav-mini-pill {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text-2);
  padding: 2px 8.5px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.fav-mini-pill:hover {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-text);
}

/* Tactile Favorite Star Button on Cards & Detail Drawer */
.card-title-right {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.fav-btn {
  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 8px;
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.fav-btn:hover {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
  color: var(--m-text);
}

.fav-btn:active {
  transform: scale(0.97);
}

.fav-btn.is-favorited {
  background: var(--m-ctl-bg);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.fav-btn.is-drawer {
  width: 30px;
  height: 30px;
  border-radius: var(--m-r-sm);
}

.fav-btn.is-mini {
  width: 22px;
  height: 22px;
  border-radius: 6px;
}

.drawer-header-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ==========================================================================
   Main Scroll Area & Quick Update Strips
   ========================================================================== */

.main-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-anchor: none;
  padding: 15px 16px 56px;
}

.quick-update-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 10px;
  padding: 9px 13px;
  margin-bottom: 13px;
  border-radius: var(--m-r-md);
  background: var(--m-card-bg);
  border: 1px solid var(--m-sky-border);
  font-size: 12px;
}

.quick-update-left {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--m-text);
  font-weight: 650;
  min-width: 0;
}

.quick-update-left .ui-ico {
  color: var(--m-sky);
}

.quick-update-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Installed / Updates Command Card */
.updates-command-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 13px 15px;
  margin-bottom: 14px;
  border-radius: var(--m-r-lg);
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
}

.updates-command-bar.has-updates {
  border-color: var(--m-sky-border);
  background: var(--m-card-bg);
}

.updates-command-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.updates-summary {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.updates-summary-title {
  font-size: 13.5px;
  font-weight: 740;
  display: flex;
  align-items: center;
  gap: 7px;
}

.updates-summary-sub {
  font-size: 11.5px;
  color: var(--m-muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.updates-command-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.progress-track {
  height: 3px;
  width: 100%;
  border-radius: 999px;
  background: var(--m-inset-bg);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 45%;
  border-radius: 999px;
  background: var(--m-accent);
  animation: agy-bar-slide 1.2s var(--m-ease-out) infinite;
}

/* Batch update per-item result report */
.batch-results {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--m-hairline);
}

.batch-results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--m-muted);
}

.batch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6.5px 10px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  font-size: 11.8px;
}

.batch-row.is-ok {
  border-color: var(--m-ok-border);
}

.batch-row.is-warn {
  border-color: var(--m-warn-border);
}

.batch-row.is-err {
  border-color: var(--m-danger-border);
}

.batch-row-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.batch-row-name {
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.batch-row-msg {
  color: var(--m-muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.batch-row-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Rate limit / warning inline banner */
.notice-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-warn-soft);
  border: 1px solid var(--m-warn-border);
  color: var(--m-warn);
  font-size: 11.5px;
}

/* ==========================================================================
   Plugin Cards
   ========================================================================== */

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(312px, 1fr));
  gap: 14px;
}

.plugin-card {
  position: relative;
  min-width: 0;
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px 15px 12px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  overflow: hidden;
  isolation: isolate;
  content-visibility: auto;
  contain-intrinsic-size: auto 220px;
  transition: transform var(--m-dur-base) var(--m-ease-out), opacity var(--m-dur-base) var(--m-ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .plugin-card:hover {
    transform: translateY(-1px);
    background: var(--m-card-bg-hover);
    border-color: var(--m-hairline-strong);
  }

  .plugin-card.has-update:hover {
    border-color: var(--m-sky);
  }
}

.plugin-card.has-update {
  border-color: var(--m-sky-border);
}

/* Parked / Disabled Standby Card Styling */
.plugin-card.is-parked {
  border-style: dashed;
  border-color: var(--m-hairline-strong);
  background: var(--m-card-bg);
}

.plugin-card.is-parked .plugin-logo-wrap,
.plugin-card.is-parked .card-desc,
.plugin-card.is-parked .badge-row {
  opacity: 0.72;
  filter: saturate(0.6);
}

.self-running-pill {

.state-pill {

.state-pill.is-external {

.card-desc {

}

  background: var(--b-subtle-bg);
  color: var(--b-subtle-fg);
  border-color: var(--b-subtle-bd);
}
.cap-badge.tone-amber {
  background: var(--b-subtle-bg);
  color: var(--b-subtle-fg);
  border-color: var(--b-subtle-bd);
}
.cap-badge.tone-cyan {
  background: var(--b-subtle-bg);

}
.cap-badge.tone-orange {
  background: var(--b-subtle-bg);

}

  background: var(--b-subtle-bg);

/* Category Micro-Tags (Taxonomy Pills) */
.cat-tag-pill {
  font-size: 10.2px;
  font-weight: 600;
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);

.cat-tag-pill.is-clickable {

.cap-badge.is-more {

/* Post-Update Batch Result Pill (rendered ONLY after an update succeeds) */
.batch-act-pill {

/* ==========================================================================
   Card Controls and Toggle
   ========================================================================== */

.card-dock {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding: 7.5px 9.5px;
  border-radius: 12px;
  background: var(--m-dock-bg);
  border: 1px solid var(--m-hairline);
}

.dock-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex-wrap: wrap;
}

.dock-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 5px;
  flex-shrink: 0;
}

/* Luxurious iOS / Linear-grade Animated Toggle Slider */
.prism-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 2px 6px 2px 2px;
  border: none;
  background: transparent;
  color: var(--m-text-2);
  font-family: inherit;
  font-size: 11.2px;
  font-weight: 650;
  cursor: pointer;
  border-radius: var(--m-r-pill);
  user-select: none;
  transition: opacity var(--m-dur-fast) var(--m-ease-out);
}

.prism-toggle:hover:not(:disabled) {
  color: var(--m-text);
}

.prism-toggle:disabled,
.prism-toggle.is-locked {
  cursor: default;
}

.prism-toggle-track {
  position: relative;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--m-toggle-off-bg);
  border: 1px solid var(--m-toggle-off-bd);
  transition: transform var(--m-dur-fast) var(--m-ease-out);
  flex-shrink: 0;
}

.prism-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--m-toggle-thumb);
  display: grid;
  place-items: center;
  transition: transform 240ms var(--m-ease-out);
}

.prism-toggle-thumb-core {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--m-ctl-bg);
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.prism-toggle.is-on .prism-toggle-track {
  background: var(--m-accent);
  border-color: var(--m-hairline-strong);
}

.prism-toggle.is-on .prism-toggle-thumb {
  background: var(--m-bg-raw);
  transform: translateX(16px);
}

.prism-toggle.is-on .prism-toggle-thumb-core {
  background: var(--m-ok);
}

.prism-toggle.is-on .prism-toggle-label {
  color: var(--m-ok);
}

.prism-toggle.is-off .prism-toggle-label {
  color: var(--m-muted);
}

.prism-toggle.is-locked.is-on .prism-toggle-track {
  background: var(--m-muted);
  border-color: var(--m-accent-border);
}

.prism-toggle.is-locked .prism-toggle-label {
  color: var(--m-muted);
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.prism-toggle.is-busy {
  opacity: 0.72;
}

.dock-btn {
  font-size: 11px;
  font-weight: 600;
  color: var(--m-muted);
  text-decoration: none;
  padding: 4.5px 8px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.dock-btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline);
  color: var(--m-text);
}

.dock-btn:disabled,
.dock-btn.is-disabled {
  color: var(--m-muted);
  background: transparent;
  border-color: var(--m-hairline);
  opacity: 0.55;
  cursor: not-allowed;
}

.dock-btn.is-pane {

  border-color: color-mix(in srgb, var(--m-accent-border) 60%, transparent);
}

.dock-btn.is-pane:hover:not(:disabled) {
  border-color: var(--m-accent-border);

}

.dock-btn.is-update {
  color: var(--m-sky);

}

.dock-btn.is-update:hover:not(:disabled) {
  background: var(--m-sky-soft);
  border-color: var(--m-sky);
  color: var(--m-sky);
}

.dock-btn.is-update:disabled,
.dock-btn.is-update.is-disabled {
  color: var(--m-muted);
  background: transparent;
  border-color: var(--m-hairline);
  opacity: 0.55;
  cursor: not-allowed;
}

.dock-btn.is-danger {
  color: var(--m-muted);
  background: transparent;
  border-color: transparent;
}

.dock-btn.is-danger:hover:not(:disabled) {
  color: var(--m-danger);
  background: var(--m-danger-soft);
  border-color: var(--m-danger-border);
}

.ghost-link {
  font-size: 11px;
  font-weight: 550;
  color: var(--m-muted);
  text-decoration: none;
  padding: 4px 7.5px;
  border-radius: 7px;
  background: transparent;
  border: 1px solid transparent;

.btn {

   Conflicts & Diagnostics View (`冲突与诊断`)
   ========================================================================== */

.conflict-hero {

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  padding: 13px 16px;
  margin-bottom: 14px;
  border-radius: var(--m-r-lg);

}

  margin: 0;
  font-size: 14px;
  font-weight: 760;
  color: var(--m-text);
  display: flex;
  align-items: flex-start;
  gap: 7px;
  line-height: 1.35;
}

.conflict-hero-title .ui-ico {
  margin-top: 2px;
  flex-shrink: 0;
}

.conflict-kpi-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}

.conflict-kpi-pill {
  font-size: 11px;
  font-weight: 650;
  padding: 3px 9px;
  border-radius: var(--m-r-pill);
  border: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  color: var(--m-text-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-variant-numeric: tabular-nums;
}

.conflict-kpi-pill.is-critical {
  border-color: var(--m-danger-border);
  background: var(--m-danger-soft);
  color: var(--m-danger);
}

.conflict-kpi-pill.is-warning {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.conflict-kpi-pill.is-info {
  border-color: var(--m-sky-border);
  background: var(--m-sky-soft);
  color: var(--m-sky);
}

.conflict-kpi-pill.is-ok {
  border-color: var(--m-ok-border);
  background: var(--m-ok-soft);
  color: var(--m-ok);
}

.conflict-hero-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.conflict-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.conflict-card {
  position: relative;
  border-radius: var(--m-r-lg);
  padding: 14px 16px 14px 19px;
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

.conflict-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3.5px;
  background: var(--m-sky);
}

.conflict-card.sev-critical {
  border-color: color-mix(in srgb, var(--m-danger-border) 75%, var(--m-hairline));
}
.conflict-card.sev-critical::before {
  background: var(--m-danger);
}

.conflict-card.sev-warning {
  border-color: color-mix(in srgb, var(--m-warn-border) 75%, var(--m-hairline));
}
.conflict-card.sev-warning::before {
  background: var(--m-warn);
}

.conflict-card.sev-info {
  border-color: color-mix(in srgb, var(--m-sky-border) 75%, var(--m-hairline));
}
.conflict-card.sev-info::before {
  background: var(--m-faint);
}

.conflict-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px 12px;
}

.conflict-card-title-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
  flex: 1;
}

.conflict-card-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.sev-pill {
  font-size: 10.2px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.sev-pill.sev-critical {
  background: var(--m-danger-soft);
  color: var(--m-danger);
  border: 1px solid var(--m-danger-border);
}

.sev-pill.sev-warning {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
}

.sev-pill.sev-info {
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
}

.layer-tag {
  font-size: 10.2px;
  font-weight: 600;
  font-family: var(--m-mono);
  padding: 2px 7.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-inset-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.conflict-card-title {
  margin: 0;
  font-size: 13.6px;
  font-weight: 720;
  color: var(--m-text);
}

.conflict-card-desc {
  margin: 0;
  font-size: 12px;
  line-height: 1.54;
  color: var(--m-text-2);
}

.conflict-compare {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}

.conflict-path-box {
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.conflict-path-box.is-winner {
  border-color: var(--m-ok-border);
  background: color-mix(in srgb, var(--m-ok-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-shadowed {
  border-color: var(--m-danger-border);
  background: color-mix(in srgb, var(--m-danger-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-warn-box {
  border-color: var(--m-warn-border);
  background: color-mix(in srgb, var(--m-warn-soft) 45%, var(--m-inset-bg));
}

.conflict-path-box.is-info-box {
  border-color: var(--m-sky-border);
  background: color-mix(in srgb, var(--m-sky-soft) 45%, var(--m-inset-bg));
}

.conflict-affected-box {
  grid-column: 1 / -1;
}

.conflict-box-label {
  font-size: 10.6px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.conflict-path-box.is-winner .conflict-box-label {
  color: var(--m-ok);
}

.conflict-path-box.is-shadowed .conflict-box-label {
  color: var(--m-danger);
}

.conflict-path-box.is-warn-box .conflict-box-label {
  color: var(--m-warn);
}

.conflict-path-box.is-info-box .conflict-box-label {
  color: var(--m-sky);
}

.conflict-path-line {
  font-family: var(--m-mono);
  font-size: 10.8px;
  color: var(--m-text-2);
  word-break: break-all;
  line-height: 1.45;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.scope-chip {
  font-size: 9.8px;
  font-weight: 650;
  padding: 0.5px 5.5px;
  border-radius: 5px;
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  color: var(--m-muted);
}

/* ==========================================================================
   Skeleton Loaders & Empty States
   ========================================================================== */

.skel-card {
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.skel-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skel {
  border-radius: 6px;
  background: var(--m-skel-base);
}

.skel-avatar {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  flex-shrink: 0;
}

.skel-line {
  height: 11px;
}

.skel-pill {
  height: 20px;
  width: 82px;
  border-radius: 999px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 9px;
  padding: 46px 22px;
  border: 1px dashed var(--m-hairline-strong);
  border-radius: var(--m-r-lg);
  background: var(--m-card-bg);
  color: var(--m-muted);
}

.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-accent-border);
  display: grid;
  place-items: center;
  color: var(--m-accent-bright);
  margin-bottom: 2px;
}

.empty-title {
  font-weight: 740;
  font-size: 14px;
  color: var(--m-text);
}

.empty-sub {
  max-width: 420px;
  font-size: 12px;
  color: var(--m-muted);
}

/* ==========================================================================
   Slide-Over Detail Drawer
   ========================================================================== */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  display: flex;
  justify-content: flex-end;
  z-index: 45;
}

.drawer-panel {
  width: min(560px, 96vw);
  height: 100%;
  background: var(--m-sheet-bg);
  border-left: 1px solid var(--m-hairline-strong);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: agy-drawer-in var(--m-dur-slow) var(--m-ease-out);
}

.drawer-hero {
  padding: 16px 18px 13px;
  border-bottom: 1px solid var(--m-hairline);
  background: var(--m-sheet-bg);
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
}

.drawer-hero-top {
  display: flex;
  align-items: flex-start;
  gap: 13px;
}

.drawer-hero-info {
  flex: 1;
  min-width: 0;
}

.drawer-title {
  font-size: 16px;
  font-weight: 760;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: var(--m-text);
  word-break: break-word;
  line-height: 1.3;
}

.drawer-title-link {
  color: inherit;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.drawer-title-link:hover {
  color: var(--m-accent-bright);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.drawer-subtitle {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--m-muted);
}

.drawer-cta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.drawer-toggle-box {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px 2px 4px;
  border-radius: var(--m-r-pill);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
}

.drawer-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 7px 18px;
  border-bottom: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}

.drawer-tabs::-webkit-scrollbar {
  display: none;
}

.drawer-tab {
  border: 1px solid transparent;
  background: transparent;
  color: var(--m-muted);
  padding: 5.5px 10.5px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 11.8px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: transform var(--m-dur-fast) var(--m-ease-out);
}

.drawer-tab:hover {
  color: var(--m-text);
  background: var(--m-ctl-bg);
}

.drawer-tab.active {
  background: var(--m-card-bg-hover);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.drawer-body {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.readme-lang-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 9px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  font-size: 11.2px;
  color: var(--m-muted);
}

.readme-lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 650;
  color: var(--m-accent-bright);
}

.asar-patch-guide-box {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-card-bg);
  border: 1px solid var(--m-warn-border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.asar-patch-guide-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--m-warn);
}

.asar-patch-guide-text {
  margin: 0;
  font-size: 11.6px;
  line-height: 1.5;
  color: var(--m-text-2);
}

.asar-patch-guide-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 8px;
  padding-top: 2px;
}

.asar-patch-path {
  font-size: 10.6px;
  color: var(--m-text);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  border-radius: 6px;
  padding: 2.5px 7px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Capabilities breakdown inside drawer */
.cap-detail-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cap-detail-card {
  padding: 10.5px 12.5px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.cap-detail-desc {
  font-size: 11.8px;
  color: var(--m-muted);
  margin: 0;
  line-height: 1.5;
}

.meta-kv {
  display: grid;
  grid-template-columns: 104px 1fr;
  gap: 6px 10px;
  font-size: 11.5px;
  padding: 11px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  word-break: break-all;
}

.meta-kv-val {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.mono {
  font-family: var(--m-mono);
  font-size: 11px;
}

/* Discussions tab inside drawer */
.discuss-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.discuss-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.discuss-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 11px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  text-decoration: none;
  color: inherit;
}

.discuss-item:hover {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg-hover);
}

.discuss-item-title {
  font-weight: 650;
  font-size: 12.6px;
  color: var(--m-text);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.discuss-item-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--m-muted);
}

.discuss-cat-pill {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-accent-soft);
  color: var(--m-accent-bright);
  border: 1px solid var(--m-accent-border);
}

.discuss-info-box {
  padding: 14px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* Changelog tab card */
.changelog-banner {
  padding: 11px 13px;
  border-radius: var(--m-r-md);
  background: var(--m-sky-soft);
  border: 1px solid var(--m-sky-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.changelog-banner.is-upstream {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
}

/* ==========================================================================
   Settings / Sources Panel
   ========================================================================== */

.settings-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 720px;
}

.field-card {
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.field-label {
  font-weight: 700;
  font-size: 12.6px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.field-hint {
  font-size: 11.6px;
  color: var(--m-muted);
  margin: 0;
  line-height: 1.5;
}

.telemetry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 8px;
}

.telemetry-cell {
  padding: 8.5px 10.5px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.telemetry-k {
  font-size: 10.5px;
  color: var(--m-muted);
}

.telemetry-v {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--m-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.token-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.token-row .text-input {
  flex: 1 1 auto;
}

/* ==========================================================================
   Modals & Reconnect Overlay
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 55;
}

.modal-box {
  background: var(--m-sheet-bg);
  border: 1px solid var(--m-hairline-strong);
  border-radius: var(--m-r-xl);
  width: 100%;
  max-width: 520px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: agy-modal-in 210ms var(--m-ease-out);
}

.modal-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--m-hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 700;
  font-size: 13.5px;
}

.modal-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-body {
  padding: 14px 16px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 11px;
  font-size: 12.4px;
}

.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.uninstall-fav-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8.5px 11px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  color: var(--m-text-2);
  font-size: 11.8px;
  cursor: pointer;
  user-select: none;
}

.uninstall-fav-check:hover {
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.uninstall-fav-check input[type='checkbox'] {
  accent-color: var(--m-danger);
  width: 14px;
  height: 14px;
  margin: 0;
  cursor: pointer;
}

.escalation-item {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-warn-border);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.escalation-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
}

.empty-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 2px;
}

/* GitHub URL Two-Step Inspect & Install Modal */
.gh-url-modal {
  max-width: 560px;
}

.gh-url-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.gh-url-input {
  width: 100%;
  height: 36px;
  font-family: var(--m-mono);
  font-size: 12px;
}

.gh-url-formats {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11.4px;
  color: var(--m-muted);
}

.gh-url-formats-title {
  font-weight: 650;
  color: var(--m-text-2);
  margin-bottom: 1px;
}

.gh-url-format-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px;
}

.gh-url-format-row code {

  if (loc?.receipt?.id && isFavoritedKey(loc.receipt.id)) return true;
  return false;
}

function formatCategoryLabel(catId, locale = getLocale()) {

function renderCategoryTagsHtml(categories = [], { maxCount = 2, clickable = false } = {}) {
  const list = (Array.isArray(categories) ? categories : []).filter(Boolean);
  if (!list.length) return '';
  const shown = maxCount > 0 ? list.slice(0, maxCount) : list;

function formatRelativeTime(isoStr) {
  if (!isoStr) return '';
  const ts = Date.parse(isoStr);
  if (!Number.isFinite(ts)) return '';
  const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (diffSec < 60) return t('刚刚', 'just now');
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return t(`${diffMin} 分钟前`, `${diffMin}m ago`);
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return t(`${diffHr} 小时前`, `${diffHr}h ago`);
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 30) return t(`${diffDay} 天前`, `${diffDay}d ago`);
  const diffMon = Math.floor(diffDay / 30);
  if (diffMon < 12) return t(`${diffMon} 个月前`, `${diffMon}mo ago`);
  const diffYr = Math.floor(diffMon / 12);
  return t(`${diffYr} 年前`, `${diffYr}y ago`);
}

function cleanBadgeText(badgeId, capabilities = {}) {
  if (badgeId === 'sidecar-ui') return t('Sidebar 侧边栏', 'Sidebar Panel');
  if (badgeId === 'declarative-only') return t('纯声明式技能', 'Declarative Skill');
  const raw = formatBadgeLabel(badgeId, capabilities, getLocale());
  return String(raw || badgeId).replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\s]+/u, '').trim();
}

function deriveDiscussionsUrl(repoUrl) {
  const clean = String(repoUrl || '').trim().replace(/\.git$/i, '').replace(/\/+$/, '');
  if (/^https?:\/\/github\.com\/[^/]+\/[^/]+$/i.test(clean)) {
    return `${clean}/discussions`;
  }
  return '';
}

function resolveCardAccent(pluginOrLocal, catEntry = null) {
  const cats = catEntry?.taxonomy?.categories || pluginOrLocal?.taxonomy?.categories || [];
  if (cats.length && CATEGORY_ACCENTS[cats[0]]) {

  const badges = catEntry?.capabilities?.badges || pluginOrLocal?.capabilities?.badges || [];
  if (badges.includes('host-enhancement')) return CATEGORY_ACCENTS['ui-themes'];
  if (badges.includes('mcp-stdio') || badges.includes('mcp-remote')) return CATEGORY_ACCENTS['mcp-integrations'];
  if (badges.includes('sidecar-ui')) return CATEGORY_ACCENTS['developer-tools'];
  if (badges.includes('declarative-only')) return CATEGORY_ACCENTS['skills-workflows'];

}

function hasAppAsarCapability(...objs) {
  for (const obj of objs) {
    if (!obj || typeof obj !== 'object') continue;
    if (obj.requiresPatchScript === true || obj.activation?.requiresPatchScript === true) {
      return true;
    }
    const kinds = Array.isArray(obj.hostEnhancementKind)
      ? obj.hostEnhancementKind
      : Array.isArray(obj.capabilities?.hostEnhancementKind)
        ? obj.capabilities.hostEnhancementKind
        : Array.isArray(obj.receipt?.grantedCapabilities?.hostEnhancementKind)
          ? obj.receipt.grantedCapabilities.hostEnhancementKind
          : [];
    if (kinds.some((k) => String(k || '').toLowerCase() === 'app-asar')) {

    }
  }
  return false;
}

function buildAsarPatchGuidanceText(operation = 'install') {
  if (operation === 'update') {
    return {
      zh: `修改 ${ASAR_LABEL} 的插件需按插件文档运行其自带补丁脚本（如 node setup.cjs）后再重启 Antigravity；在市场更新此类插件后，请重新运行补丁脚本并重启客户端以同步注入的客户端代码。`,
      en: `Plugins modifying ${ASAR_LABEL} require running their bundled patch script (e.g. node setup.cjs per plugin docs) before restarting Antigravity. After updating in AGY Market, re-run the patch script and restart Antigravity to sync injected client code.`,
    };
  }

    en: `Modifying ${ASAR_LABEL} requires running the plugin's bundled patch script (e.g. node setup.cjs per plugin docs) before restarting Antigravity; after updating it in AGY Market, re-run the patch script and restart Antigravity to sync injected client code.`,
  };
}

function resolvePluginLocalDirPath(dir, loc = null) {
  const cleanDir = String(dir || loc?.dir || '').trim();
  if (!cleanDir) return '';
  if (loc?.path) return String(loc.path);
  const pluginsDir = String(state.serverState?.paths?.pluginsDir || '').trim();
  if (pluginsDir) {
    const sep = pluginsDir.includes('\\') && !pluginsDir.includes('/') ? '\\' : '/';
    return `${pluginsDir.replace(/[\\/]+$/, '')}${sep}${cleanDir}`;
  }
  return `~/.gemini/config/plugins/${cleanDir}`;
}

function resolveActivationInfo(sourceObj, capabilitiesFallback = {}, { operation = 'update' } = {}) {
  const act = sourceObj?.activation;
  const cap = sourceObj?.capabilities || capabilitiesFallback || {};
  const badges = Array.isArray(cap.badges) ? cap.badges : [];
  const hostKinds = Array.isArray(cap.hostEnhancementKind)
    ? cap.hostEnhancementKind.map((k) => String(k || '').toLowerCase())
    : [];
  const hasAsar = Boolean(act?.requiresPatchScript || hostKinds.includes('app-asar'));

  if (act && typeof act === 'object' && act.level) {
    if (!hasAsar || operation === 'uninstall') return act;
    const patchText = buildAsarPatchGuidanceText(operation);
    const hasPatchHintZh = /setup\.cjs|补丁脚本/.test(String(act.reasonZh || ''));
    const hasPatchHintEn = /setup\.cjs|patch script/i.test(String(act.reasonEn || ''));
    return {
      ...act,
      requiresPatchScript: true,
      reasonZh: hasPatchHintZh ? act.reasonZh : patchText.zh,
      reasonEn: hasPatchHintEn ? act.reasonEn : patchText.en,
    };
  }

  if (hasAsar) {
    const patchText = buildAsarPatchGuidanceText(operation);
    return {
      level: 'host-restart',
      requiresPatchScript: true,
      reasonZh: patchText.zh,
      reasonEn: patchText.en,
    };
  }
  if (hostKinds.includes('cdp') || badges.includes('host-enhancement')) {
    return {
      level: 'host-restart',
      reasonZh: '包含 CDP 界面增强，更新后需带调试端口重启 Antigravity 客户端生效',
      reasonEn: 'Uses CDP UI enhancement; restart Antigravity with debug port to apply',
    };
  }
  if (
    badges.includes('sidecar-ui') ||
    badges.includes('mcp-stdio') ||
    badges.includes('mcp-remote') ||
    badges.includes('lifecycle-hooks')
  ) {
    return {
      level: 'reload-pane',
      reasonZh: '包含 Sidebar 侧边栏、MCP 进程或生命周期钩子，更新后建议重开侧边栏或刷新 MCP 连接',
      reasonEn: 'Includes Sidebar panel, MCP server, or hooks; reopen Sidebar or refresh MCP',
    };
  }
  return {
    level: 'instant',
    reasonZh: '纯声明式技能或规则，安装更新后即刻生效',
    reasonEn: 'Pure declarative skills/rules — active immediately after update',
  };
}

function maybeTriggerRestartBanner({
  pluginName = '',
  pluginDir = '',
  pluginId = '',
  operation = 'update',
  restartRequired = false,
  reloadRequired = false,
  retiredBinaries = [],
  lockedOnDisable = false,
  lockedOnRemove = false,
  activation = null,
  requiresPatchScript = false,
} = {}) {
  const hasRetired = Array.isArray(retiredBinaries) && retiredBinaries.length > 0;
  const isLocked = Boolean(lockedOnDisable || lockedOnRemove || hasRetired);
  const op = operation || 'update';
  const needsPatchScript = Boolean(op !== 'uninstall' && (requiresPatchScript || activation?.requiresPatchScript));
  let level = '';
  let reason = '';

  if (restartRequired || isLocked || needsPatchScript || activation?.level === 'host-restart') {
    level = 'host-restart';
    if (isLocked) {
      reason =
        (getLocale() === 'en' ? activation?.reasonEn : activation?.reasonZh) ||
        (op === 'uninstall'
          ? t(
              '插件清单已摘除，部分被后台进程占用的旧文件将在重启 Antigravity 客户端后自动回收清理。',
              'Manifest removed; locked files will be cleaned up automatically after restarting Antigravity.',
            )
          : t(
              'Windows 后台进程句柄占用（已安全退役旧二进制），重启 Antigravity 客户端后即可完全释放生效。',
              'Windows background binary handle lock detected; restart Antigravity to fully release and apply.',
            ));
    } else if (needsPatchScript) {
      const patchText = buildAsarPatchGuidanceText(op);
      const actReason = getLocale() === 'en' ? activation?.reasonEn : activation?.reasonZh;
      const hasPatchDetail = Boolean(
        actReason && (getLocale() === 'en' ? /setup\.cjs|patch script/i : /setup\.cjs|补丁脚本/).test(actReason),
      );
      reason = hasPatchDetail ? actReason : getLocale() === 'en' ? patchText.en : patchText.zh;
    } else {
      reason =
        (getLocale() === 'en' ? activation?.reasonEn : activation?.reasonZh) ||
        (op === 'uninstall'
          ? t(
              `已卸载涉及 ${ASAR_LABEL} 界面补丁或 CDP 宿主增强的插件，请重启 Antigravity 客户端以彻底释放残留状态。`,
              `Uninstalled plugin with ${ASAR_LABEL} or CDP host enhancements; restart Antigravity to release remaining state.`,
            )
          : t(
              `该插件涉及 ${ASAR_LABEL} 界面补丁或 CDP 调试端口宿主增强，请重启 Antigravity 客户端生效。`,
              `This plugin modifies ${ASAR_LABEL} or CDP host enhancements; restart Antigravity to apply.`,
            ));
    }
  } else if (reloadRequired || activation?.level === 'reload-pane') {
    level = 'reload-pane';
    reason =
      (getLocale() === 'en' ? activation?.reasonEn : activation?.reasonZh) ||
      (op === 'uninstall'
        ? t(
            '已卸载包含 Sidebar 侧边栏、MCP 服务或钩子的插件，建议关闭对应侧边栏或刷新 MCP 列表。',
            'Uninstalled plugin with Sidebar panel, MCP server, or hooks; close its Sidebar or refresh MCP.',
          )
        : t(
            '该插件包含 Sidebar 侧边栏、MCP 服务或钩子，建议重开对应侧边栏或刷新 MCP 列表。',
            'This plugin includes a Sidebar panel, MCP server, or hooks; reopen Sidebar or refresh MCP.',
          ));
  }

  if (!level) return null;

  const existing = state.restartBanner;
  const sameOp = existing && existing.operation === op;
  const nextLevel =
    (sameOp && existing.level === 'host-restart') || level === 'host-restart' ? 'host-restart' : 'reload-pane';
  const plugins = [...new Set([...(sameOp ? existing.plugins || [] : []), ...(pluginName ? [pluginName] : [])])];
  const reasons = [...new Set([...(sameOp ? existing.reasons || [] : []), ...(reason ? [reason] : [])])];
  const prevTargets = sameOp && Array.isArray(existing.patchTargets) ? existing.patchTargets : [];
  const nextTargets = [...prevTargets];
  if (needsPatchScript && (pluginDir || pluginName || pluginId)) {
    const cleanDir = String(pluginDir || '').trim();
    const loc = cleanDir ? getInstalledByDirMap().get(cleanDir) || null : null;
    const localPath = cleanDir ? resolvePluginLocalDirPath(cleanDir, loc) : '';
    const targetKey = cleanDir || pluginId || pluginName;
    if (!nextTargets.some((item) => (item.dir || item.id || item.name) === targetKey)) {
      nextTargets.push({
        dir: cleanDir,
        id: String(pluginId || '').trim(),
        name: String(pluginName || cleanDir || pluginId).trim(),
        path: localPath,
      });
    }
  }
  state.restartBanner = {
    level: nextLevel,
    operation: op,
    plugins,
    reasons,
    requiresPatchScript: Boolean((sameOp && existing.requiresPatchScript) || needsPatchScript),
    patchTargets: nextTargets,
  };
  return { level, reason, requiresPatchScript: needsPatchScript };
}

function isSelfPluginIdentity(pluginOrCat, loc = null) {

function sanitizeSelfDescription(text, locale = getLocale()) {

function resolveCatalogDescription(plugin, locale = getLocale()) {

function resolveInstalledDescription(loc, catEntry) {
  const locale = getLocale();
  const catDescObj = catEntry && typeof catEntry.description === 'object' ? catEntry.description : null;
  const catZh = catDescObj ? String(catDescObj.zh || '').trim() : '';
