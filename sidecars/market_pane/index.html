<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>AGY Market · 反重力插件市场</title>
  <script src="/preload.js"></script>
  <style id="agy-market-styles">
/* ==========================================================================
   AGY Market — Optical Glass Sidecar Stylesheet (`src/ui/styles.css`)
   Zero-dependency, adaptive Dark/Light & translucent host-wallpaper friendly.
   Respects host CSS vars pushed by `/preload.js` (`theme-change`) with crisp fallbacks.
   ========================================================================== */

:root {
  --m-font: var(
    --font-sans,
    'Google Sans Flex',
    'Google Sans',
    'Inter',
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    'Noto Sans SC',
    'PingFang SC',
    'Microsoft YaHei UI',
    system-ui,
    sans-serif
  );
  --m-mono: var(
    --font-mono,
    'Google Sans Code',
    'JetBrains Mono',
    'Cascadia Code',
    'SF Mono',
    Consolas,
    ui-monospace,
    monospace
  );

  /* Radii & motion tokens */
  --m-r-xs: 6px;
  --m-r-sm: 8px;
  --m-r-md: 11px;
  --m-r-lg: 14px;
  --m-r-xl: 18px;
  --m-r-pill: 999px;

  --m-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --m-ease-spring: cubic-bezier(0.22, 1.08, 0.36, 1);
  --m-dur-fast: 130ms;
  --m-dur-base: 200ms;
  --m-dur-slow: 280ms;

  /* Host-inherited base palette (Dark Obsidian defaults) */
  --m-bg-raw: var(--color-background-primary, var(--vscode-editor-background, #0b0d13));
  --m-surface-raw: var(--color-background-secondary, var(--vscode-sideBar-background, #131722));
  --m-surface-2-raw: var(--color-background-tertiary, #1a2030);
  --m-border-raw: var(--color-border-primary, rgba(255, 255, 255, 0.085));
  --m-text: var(--color-text-primary, var(--vscode-foreground, #f1f5f9));
  --m-text-2: #cbd5e1;
  --m-muted: var(--color-text-secondary, #94a3b8);
  --m-faint: #64748b;

  /* Glass-friendly translucent layered surfaces (dual sticky tokens inspired by DSH-market) */
  --m-sticky-bg: color-mix(in srgb, var(--m-bg-raw) 64%, transparent);
  --m-stuck-bg: color-mix(in srgb, var(--m-bg-raw) 92%, #090b10);
  --m-chrome-bg: var(--m-sticky-bg);
  --m-card-bg: color-mix(in srgb, var(--m-surface-raw) 74%, transparent);
  --m-card-bg-hover: color-mix(in srgb, var(--m-surface-2-raw) 84%, transparent);
  --m-inset-bg: color-mix(in srgb, var(--m-bg-raw) 64%, rgba(0, 0, 0, 0.24));
  --m-sheet-bg: color-mix(in srgb, var(--m-surface-raw) 92%, #090b10);
  --m-ctl-bg: rgba(255, 255, 255, 0.05);
  --m-ctl-hover: rgba(255, 255, 255, 0.095);
  --m-hairline: rgba(255, 255, 255, 0.085);
  --m-hairline-strong: rgba(255, 255, 255, 0.145);
  --m-specular: rgba(255, 255, 255, 0.075);
  --m-sheen: linear-gradient(168deg, rgba(255, 255, 255, 0.048) 0%, rgba(255, 255, 255, 0.008) 46%, rgba(255, 255, 255, 0) 100%);

  /* Accent & semantic colors (Dark calibrated) */
  --m-accent: #6366f1;
  --m-accent-bright: #818cf8;
  --m-accent-hover: #4f46e5;
  --m-accent-soft: rgba(99, 102, 241, 0.15);
  --m-accent-border: rgba(129, 140, 248, 0.36);

  --m-sky: #38bdf8;
  --m-sky-solid: #0284c7;
  --m-sky-hover: #0369a1;
  --m-sky-soft: rgba(56, 189, 248, 0.14);
  --m-sky-border: rgba(56, 189, 248, 0.36);

  --m-ok: #34d399;
  --m-ok-soft: rgba(16, 185, 129, 0.14);
  --m-ok-border: rgba(52, 211, 153, 0.3);

  --m-warn: #fbbf24;
  --m-warn-soft: rgba(245, 158, 11, 0.14);
  --m-warn-border: rgba(251, 191, 36, 0.34);

  --m-danger: #f87171;
  --m-danger-soft: rgba(239, 68, 68, 0.14);
  --m-danger-border: rgba(248, 113, 113, 0.34);

  /* Badge semantic palette (Dark) */
  --b-green-bg: rgba(16, 185, 129, 0.12);
  --b-green-fg: #34d399;
  --b-green-bd: rgba(52, 211, 153, 0.24);

  --b-blue-bg: rgba(59, 130, 246, 0.12);
  --b-blue-fg: #60a5fa;
  --b-blue-bd: rgba(96, 165, 250, 0.24);

  --b-purple-bg: rgba(168, 85, 247, 0.13);
  --b-purple-fg: #c084fc;
  --b-purple-bd: rgba(192, 132, 252, 0.25);

  --b-amber-bg: rgba(245, 158, 11, 0.12);
  --b-amber-fg: #fbbf24;
  --b-amber-bd: rgba(251, 191, 36, 0.25);

  --b-cyan-bg: rgba(6, 182, 212, 0.12);
  --b-cyan-fg: #22d3ee;
  --b-cyan-bd: rgba(34, 211, 238, 0.25);

  --b-orange-bg: rgba(249, 115, 22, 0.12);
  --b-orange-fg: #fb923c;
  --b-orange-bd: rgba(251, 146, 60, 0.25);

  --b-subtle-bg: rgba(148, 163, 184, 0.1);
  --b-subtle-fg: #cbd5e1;
  --b-subtle-bd: rgba(148, 163, 184, 0.2);

  /* Shadows & ambient aura */
  --m-shadow-card: 0 6px 20px -10px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.24);
  --m-shadow-hover: 0 14px 32px -12px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.28);
  --m-shadow-sheet: -12px 0 44px rgba(0, 0, 0, 0.52);
  --m-shadow-modal: 0 24px 64px -12px rgba(0, 0, 0, 0.72), 0 2px 8px rgba(0, 0, 0, 0.35);
  --m-backdrop: rgba(4, 7, 15, 0.56);
  --m-aura-1: rgba(99, 102, 241, 0.085);
  --m-aura-2: rgba(6, 182, 212, 0.065);
  --m-skel-base: rgba(255, 255, 255, 0.055);
  --m-skel-shine: rgba(255, 255, 255, 0.11);

  color-scheme: dark;
}

    --m-accent: #4f46e5;

    --b-green-bg: rgba(5, 150, 105, 0.09);

    --b-blue-bg: rgba(37, 99, 235, 0.09);

    --b-blue-bd: rgba(37, 99, 235, 0.22);

    --b-purple-bg: rgba(124, 58, 237, 0.09);
    --b-purple-fg: #6d28d9;
    --b-purple-bd: rgba(124, 58, 237, 0.22);

    --b-amber-bg: rgba(217, 119, 6, 0.1);
    --b-amber-fg: #b45309;
    --b-amber-bd: rgba(217, 119, 6, 0.24);

    --b-cyan-bg: rgba(8, 145, 178, 0.09);
    --b-cyan-fg: #0e7490;
    --b-cyan-bd: rgba(8, 145, 178, 0.22);

    --b-orange-bg: rgba(234, 88, 12, 0.09);
    --b-orange-fg: #c2410c;
    --b-orange-bd: rgba(234, 88, 12, 0.22);

    --b-subtle-bg: rgba(15, 23, 42, 0.055);
    --b-subtle-fg: #334155;
    --b-subtle-bd: rgba(15, 23, 42, 0.12);

    --m-shadow-card: 0 4px 16px -8px rgba(15, 23, 42, 0.12), 0 1px 2px rgba(15, 23, 42, 0.05);
    --m-shadow-hover: 0 12px 28px -10px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.07);
    --m-shadow-sheet: -10px 0 36px rgba(15, 23, 42, 0.18);
    --m-shadow-modal: 0 24px 56px -14px rgba(15, 23, 42, 0.24), 0 2px 8px rgba(15, 23, 42, 0.08);
    --m-backdrop: rgba(15, 23, 42, 0.36);
    --m-aura-1: rgba(79, 70, 229, 0.055);
    --m-aura-2: rgba(2, 132, 199, 0.045);
    --m-skel-base: rgba(15, 23, 42, 0.06);
    --m-skel-shine: rgba(15, 23, 42, 0.12);

    color-scheme: light;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--m-bg-raw);
  color: var(--m-text);
  font-family: var(--m-font);
  font-size: 13px;
  line-height: 1.48;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Subtle atmospheric aura + container-query root so narrow/wide sidecar panes adapt natively */
.market-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-width: 0;
  overflow: hidden;
  container-type: inline-size;
  container-name: market;
  background:
    radial-gradient(620px 320px at 88% -8%, var(--m-aura-1), transparent 68%),
    radial-gradient(480px 280px at 8% -12%, var(--m-aura-2), transparent 65%),
    var(--m-bg-raw);
}

/* Custom sleek scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--m-hairline-strong);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--m-faint);
}

.ui-ico {
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

.spin {
  animation: agy-spin 0.85s linear infinite;
}

@keyframes agy-spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes agy-pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.45;
    transform: scale(0.85);
  }
}

@keyframes agy-shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

@keyframes agy-drawer-in {
  from {
    opacity: 0.6;
    transform: translateX(28px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes agy-modal-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes agy-toast-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes agy-bar-slide {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(220%);
  }
}

/* ==========================================================================
   Unified Compact Header + Segmented Navigation
   ========================================================================== */

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 10px 14px;
  background: var(--m-sticky-bg);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--m-hairline);
  box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.06);
  flex-shrink: 0;
  z-index: 20;
  transition: background var(--m-dur-base) var(--m-ease-out), box-shadow var(--m-dur-base) var(--m-ease-out);
}

.market-shell[data-stuck="true"] .app-header {
  background: var(--m-stuck-bg);
  box-shadow: 0 4px 16px -6px rgba(0, 0, 0, 0.28);
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  filter: drop-shadow(0 3px 8px rgba(79, 70, 229, 0.34));
}

.brand-mark svg {
  width: 28px;
  height: 28px;
  display: block;
}

.brand-copy {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.brand-title {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-family: var(--m-mono);
  color: var(--m-muted);
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  padding: 2px 7px;
  border-radius: var(--m-r-pill);
  white-space: nowrap;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--m-ok);
  flex-shrink: 0;
}

.status-dot.is-warn {
  background: var(--m-warn);
}

.status-dot.is-pulse {
  background: var(--m-sky);
  animation: agy-pulse 1.8s ease-in-out infinite;
}

.segmented-nav {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 10px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  flex-shrink: 0;
}

.nav-pill {
  position: relative;
  border: 1px solid transparent;
  background: transparent;
  color: var(--m-muted);
  padding: 5px 10px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out), border-color var(--m-dur-fast) var(--m-ease-out), box-shadow var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.nav-pill:hover {
  color: var(--m-text);
  background: var(--m-ctl-bg);
}

.nav-pill.active {
  background: var(--m-card-bg-hover);
  color: var(--m-text);
  border-color: var(--m-hairline-strong);
  box-shadow: inset 0 1px 0 var(--m-specular), 0 1px 3px rgba(0, 0, 0, 0.16);
}

.nav-count {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--m-muted);
  background: var(--m-ctl-bg);
  padding: 0 5.5px;
  min-width: 18px;
  height: 17px;
  border-radius: var(--m-r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.nav-pill.active .nav-count {
  color: var(--m-text-2);
}

.nav-update-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 700;
  padding: 0 6px;
  height: 17px;
  border-radius: var(--m-r-pill);
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
}

.tab-red-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e5484d;
  box-shadow: 0 0 0 1.5px var(--m-inset-bg);
  flex-shrink: 0;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.icon-btn {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-text-2);
  height: 29px;
  padding: 0 9px;
  border-radius: var(--m-r-sm);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background var(--m-dur-fast) var(--m-ease-out), border-color var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out);
}

.icon-btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.icon-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.icon-btn.is-square {
  width: 29px;
  padding: 0;
}

.icon-btn.has-alert {
  border-color: var(--m-sky-border);
  background: var(--m-sky-soft);
  color: var(--m-sky);
}

/* ==========================================================================
   Self-Update Top Banner ("旧版插件市场更新按钮")
   ========================================================================== */

.self-update-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 14px;
  background:
    linear-gradient(90deg, rgba(99, 102, 241, 0.16), rgba(14, 165, 233, 0.14)),
    var(--m-chrome-bg);
  border-bottom: 1px solid var(--m-accent-border);
  box-shadow: inset 0 1px 0 var(--m-specular);
  flex-shrink: 0;
  animation: agy-toast-in 220ms var(--m-ease-out);
}

.self-update-main {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}

.self-update-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--m-accent), var(--m-sky-solid));
  color: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.self-update-text {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-width: 0;
  font-size: 12px;
}

.self-update-title {
  font-weight: 700;
  color: var(--m-text);
}

.version-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--m-mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1.5px 7px;
  border-radius: var(--m-r-pill);
  background: var(--m-sky-soft);
  color: var(--m-sky);
  border: 1px solid var(--m-sky-border);
  white-space: nowrap;
}

.version-delta.is-upstream {
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border-color: var(--m-warn-border);
}

.self-update-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ==========================================================================
   Discover Filter Bar & Category Chips
   ========================================================================== */

.filter-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 14px 9px;
  background: var(--m-sticky-bg);
  border-bottom: 1px solid var(--m-hairline);
  flex-shrink: 0;
  transition: background var(--m-dur-base) var(--m-ease-out);
}

.market-shell[data-stuck="true"] .filter-bar {
  background: var(--m-stuck-bg);
}

.filter-row-top {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  flex: 1 1 200px;
  display: flex;
  align-items: center;
}

.search-box .search-ico {
  position: absolute;
  left: 10px;
  color: var(--m-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 32px;
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 9px;
  padding: 0 34px 0 31px;
  font-family: inherit;
  font-size: 12.2px;
  outline: none;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), box-shadow var(--m-dur-fast) var(--m-ease-out), background var(--m-dur-fast) var(--m-ease-out);
}

.search-input::placeholder {
  color: var(--m-faint);
}

.search-input:focus {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg);
  box-shadow: 0 0 0 3px var(--m-accent-soft);
}

.search-clear {
  position: absolute;
  right: 6px;
  border: none;
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
}

.search-clear:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.search-kbd {
  position: absolute;
  right: 8px;
  font-family: var(--m-mono);
  font-size: 10px;
  color: var(--m-faint);
  border: 1px solid var(--m-hairline);
  border-radius: 4px;
  padding: 0 4px;
  line-height: 16px;
  pointer-events: none;
}

.select-input,
.text-input {
  background: var(--m-inset-bg);
  color: var(--m-text);
  border: 1px solid var(--m-hairline);
  border-radius: 8px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), box-shadow var(--m-dur-fast) var(--m-ease-out);
}

.select-input {
  height: 32px;
  cursor: pointer;
}

.select-input:focus,
.text-input:focus {
  border-color: var(--m-accent-border);
  box-shadow: 0 0 0 3px var(--m-accent-soft);
}

.track2-pill {
  height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  transition: all var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.track2-pill:hover {
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.track2-pill.enabled {
  border-color: var(--m-warn-border);
  background: var(--m-warn-soft);
  color: var(--m-warn);
}

.track2-pill input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.switch-track {
  width: 24px;
  height: 14px;
  border-radius: 999px;
  background: var(--m-hairline-strong);
  position: relative;
  transition: background var(--m-dur-fast) var(--m-ease-out);
  flex-shrink: 0;
}

.switch-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  transition: transform var(--m-dur-fast) var(--m-ease-spring);
}

.track2-pill.enabled .switch-track {
  background: var(--m-warn);
}

.track2-pill.enabled .switch-track::after {
  transform: translateX(10px);
}

/* Category horizontal chip strip */
.chip-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.chip-strip::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  border: 1px solid var(--m-hairline);
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  padding: 4px 10px;
  border-radius: var(--m-r-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.cat-chip:hover {
  background: var(--m-ctl-hover);
  color: var(--m-text);
}

.cat-chip.active {
  background: var(--m-accent-soft);
  border-color: var(--m-accent-border);
  color: var(--m-accent-bright);
  font-weight: 600;
}

.cat-chip-n {
  font-size: 10px;
  opacity: 0.72;
}

/* ==========================================================================
   Main Scroll Area & Quick Update Strips
   ========================================================================== */

.main-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-anchor: none;
  padding: 14px 14px 52px;
}

.quick-update-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 10px;
  padding: 8px 12px;
  margin-bottom: 12px;
  border-radius: var(--m-r-md);
  background: var(--m-sky-soft);
  border: 1px solid var(--m-sky-border);
  box-shadow: inset 0 1px 0 var(--m-specular);
  font-size: 12px;
}

.quick-update-left {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--m-text);
  font-weight: 600;
  min-width: 0;
}

.quick-update-left .ui-ico {
  color: var(--m-sky);
}

.quick-update-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Installed / Updates Command Card */
.updates-command-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
  margin-bottom: 14px;
  border-radius: var(--m-r-lg);
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
}

.updates-command-bar.has-updates {
  border-color: var(--m-sky-border);
}

.updates-command-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.updates-summary {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.updates-summary-title {
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 7px;
}

.updates-summary-sub {
  font-size: 11.5px;
  color: var(--m-muted);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.updates-command-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.progress-track {
  height: 3px;
  width: 100%;
  border-radius: 999px;
  background: var(--m-inset-bg);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 45%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--m-accent), var(--m-sky));
  animation: agy-bar-slide 1.2s ease-in-out infinite;
}

/* Batch update per-item result report */
.batch-results {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--m-hairline);
}

.batch-results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--m-muted);
}

.batch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 9px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  font-size: 11.8px;
}

.batch-row.is-ok {
  border-color: var(--m-ok-border);
}

.batch-row.is-warn {
  border-color: var(--m-warn-border);
}

.batch-row.is-err {
  border-color: var(--m-danger-border);
}

.batch-row-left {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.batch-row-name {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.batch-row-msg {
  color: var(--m-muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.batch-row-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Rate limit / warning inline banner */
.notice-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--m-r-sm);
  background: var(--m-warn-soft);
  border: 1px solid var(--m-warn-border);
  color: var(--m-warn);
  font-size: 11.5px;
}

/* ==========================================================================
   Plugin Cards Grid & Elevated Glass Card Anatomy
   ========================================================================== */

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
  gap: 12px;
}

.plugin-card {
  position: relative;
  min-width: 0;
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 14px 15px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
  transition:
    transform var(--m-dur-base) var(--m-ease-out),
    border-color var(--m-dur-fast) var(--m-ease-out),
    background var(--m-dur-fast) var(--m-ease-out),
    box-shadow var(--m-dur-base) var(--m-ease-out);
}

@media (hover: hover) {
  .plugin-card:hover {
    transform: translateY(-1.5px);
    background: var(--m-sheen), var(--m-card-bg-hover);
    border-color: var(--m-accent-border);
    box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-hover);
  }

  .plugin-card.has-update:hover {
    border-color: var(--m-sky);
  }
}

.plugin-card.has-update {
  border-color: var(--m-sky-border);
}

.card-head {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  cursor: pointer;
}

.plugin-logo {
  position: relative;
  width: 42px;
  height: 42px;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.24), rgba(6, 182, 212, 0.16));
  border: 1px solid var(--m-hairline-strong);
  box-shadow: inset 0 1px 0 var(--m-specular);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 16px;
  color: var(--m-accent-bright);
  flex-shrink: 0;
  overflow: hidden;
}

.plugin-logo img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--m-surface-raw);
}

.plugin-logo.is-lg {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  font-size: 19px;
}

.card-title-wrap {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.card-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.card-title {
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: -0.01em;
  color: var(--m-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.version-tag {
  font-family: var(--m-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--m-muted);
  background: var(--m-inset-bg);
  padding: 1.5px 6.5px;
  border-radius: 6px;
  border: 1px solid var(--m-hairline);
  white-space: nowrap;
  flex-shrink: 0;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--m-muted);
  min-width: 0;
  flex-wrap: nowrap;
  overflow: hidden;
}

.card-slug {
  font-family: var(--m-mono);
  font-size: 10.8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

.meta-sep {
  opacity: 0.45;
  flex-shrink: 0;
}

.meta-star {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
  color: var(--m-text-2);
  font-weight: 500;
}

.meta-star .ui-ico {
  color: #f59e0b;
}

.track-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--m-r-pill);
  background: var(--m-warn-soft);
  color: var(--m-warn);
  border: 1px solid var(--m-warn-border);
  flex-shrink: 0;
}

.state-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6.5px;
  border-radius: var(--m-r-pill);
  flex-shrink: 0;
}

.state-pill.is-enabled {
  background: var(--m-ok-soft);
  color: var(--m-ok);
  border: 1px solid var(--m-ok-border);
}

.state-pill.is-disabled {
  background: var(--b-subtle-bg);
  color: var(--m-muted);
  border: 1px solid var(--m-hairline);
}

.card-desc {
  font-size: 12.2px;
  line-height: 1.52;
  color: var(--m-text-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0;
  min-height: 37px;
  cursor: pointer;
}

/* Refined unified capability badges */
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.cap-badge {
  font-size: 10.5px;
  font-weight: 550;
  padding: 2.5px 7.5px;
  border-radius: var(--m-r-pill);
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  line-height: 1.3;
}

.cap-badge.tone-green {
  background: var(--b-green-bg);
  color: var(--b-green-fg);
  border-color: var(--b-green-bd);
}
.cap-badge.tone-blue {
  background: var(--b-blue-bg);
  color: var(--b-blue-fg);
  border-color: var(--b-blue-bd);
}
.cap-badge.tone-purple {
  background: var(--b-purple-bg);
  color: var(--b-purple-fg);
  border-color: var(--b-purple-bd);
}
.cap-badge.tone-amber {
  background: var(--b-amber-bg);
  color: var(--b-amber-fg);
  border-color: var(--b-amber-bd);
}
.cap-badge.tone-cyan {
  background: var(--b-cyan-bg);
  color: var(--b-cyan-fg);
  border-color: var(--b-cyan-bd);
}
.cap-badge.tone-orange {
  background: var(--b-orange-bg);
  color: var(--b-orange-fg);
  border-color: var(--b-orange-bd);
}
/* Gentle, subtle informational styling for host-enhancement (CDP / app.asar) — never scary red */
.cap-badge.tone-subtle {
  background: var(--b-subtle-bg);
  color: var(--b-subtle-fg);
  border-color: var(--b-subtle-bd);
}

.cap-badge.is-more {
  background: var(--m-ctl-bg);
  color: var(--m-muted);
  border-color: var(--m-hairline);
  cursor: pointer;
}

/* Card footer */
.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding-top: 9px;
  border-top: 1px solid var(--m-hairline);
}

.foot-links {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  min-width: 0;
}

.ghost-link {
  font-size: 11px;
  font-weight: 550;
  color: var(--m-muted);
  text-decoration: none;
  padding: 4px 7.5px;
  border-radius: 7px;
  background: transparent;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: background var(--m-dur-fast) var(--m-ease-out), color var(--m-dur-fast) var(--m-ease-out), border-color var(--m-dur-fast) var(--m-ease-out);
  white-space: nowrap;
}

.ghost-link:hover {
  background: var(--m-ctl-hover);
  border-color: var(--m-hairline);
  color: var(--m-text);
}

.ghost-link.is-accent {
  color: var(--m-accent-bright);
  background: var(--m-accent-soft);
  border-color: transparent;
}

.ghost-link.is-accent:hover {
  border-color: var(--m-accent-border);
}

/* ==========================================================================
   Buttons
   ========================================================================== */

.btn {
  border: 1px solid var(--m-hairline-strong);
  background: var(--m-ctl-bg);
  color: var(--m-text);
  padding: 5.5px 12px;
  border-radius: var(--m-r-sm);
  font-family: inherit;
  font-size: 11.8px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.btn:hover:not(:disabled) {
  background: var(--m-ctl-hover);
  border-color: var(--m-accent-border);
}

.btn:active:not(:disabled) {
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.56;
  cursor: default;
}

.btn-sm {
  padding: 4px 9px;
  font-size: 11px;
  border-radius: 7px;
}

.btn-primary {
  background: linear-gradient(180deg, #6b6ff5 0%, var(--m-accent) 100%);
  border-color: rgba(129, 140, 248, 0.5);
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 8px rgba(79, 70, 229, 0.28);
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(180deg, #7478f8 0%, var(--m-accent-hover) 100%);
  border-color: rgba(165, 180, 252, 0.65);
}

.btn-update {
  background: linear-gradient(180deg, #0ea5e9 0%, var(--m-sky-solid) 100%);
  border-color: rgba(56, 189, 248, 0.55);
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 8px rgba(2, 132, 199, 0.28);
}

.btn-update:hover:not(:disabled) {
  background: linear-gradient(180deg, #38bdf8 0%, var(--m-sky-hover) 100%);
  border-color: rgba(125, 211, 252, 0.7);
}

/* Anti-noise outline per-card Update button (reserves solid fill for batch "Update All" CTA) */
.btn-update-outline {
  background: var(--m-sky-soft);
  border-color: var(--m-sky-border);
  color: var(--m-sky);
}

@media (hover: hover) {
  .btn-update-outline:hover:not(:disabled) {
    background: linear-gradient(180deg, #0ea5e9 0%, var(--m-sky-solid) 100%);
    border-color: rgba(56, 189, 248, 0.65);
    color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 8px rgba(2, 132, 199, 0.28);
  }
}

/* Quiet inline changelog link (`更新内容 ›`) on updatable cards */
.notes-link {
  border: none;
  background: transparent;
  padding: 0 2px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--m-sky);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  white-space: nowrap;
  flex-shrink: 0;
}

.notes-link:hover {
  text-decoration: underline;
}

.btn-upstream {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
  color: var(--m-warn);
}

.btn-upstream:hover:not(:disabled) {
  border-color: var(--m-warn);
}

.btn-installed {
  background: var(--m-ok-soft);
  border-color: var(--m-ok-border);
  color: var(--m-ok);
}

.btn-danger-ghost {
  background: transparent;
  border-color: var(--m-danger-border);
  color: var(--m-danger);
}

.btn-danger-ghost:hover:not(:disabled) {
  background: var(--m-danger-soft);
  border-color: var(--m-danger);
}

.pill-link {
  font-size: 11px;
  font-weight: 600;
  color: var(--m-accent-bright);
  text-decoration: none;
  padding: 3px 8px;
  border-radius: 7px;
  background: var(--m-accent-soft);
  border: 1px solid var(--m-accent-border);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.pill-link:hover {
  filter: brightness(1.08);
}

/* ==========================================================================
   Skeleton Loaders & Empty States
   ========================================================================== */

.skel-card {
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 14px 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.skel-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skel {
  border-radius: 6px;
  background: linear-gradient(90deg, var(--m-skel-base) 25%, var(--m-skel-shine) 50%, var(--m-skel-base) 75%);
  background-size: 200% 100%;
  animation: agy-shimmer 1.35s ease-in-out infinite;
}

.skel-avatar {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  flex-shrink: 0;
}

.skel-line {
  height: 11px;
}

.skel-pill {
  height: 20px;
  width: 78px;
  border-radius: 999px;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  padding: 44px 20px;
  border: 1px dashed var(--m-hairline-strong);
  border-radius: var(--m-r-lg);
  background: var(--m-card-bg);
  color: var(--m-muted);
}

.empty-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--m-ctl-bg);
  border: 1px solid var(--m-hairline);
  display: grid;
  place-items: center;
  color: var(--m-accent-bright);
  margin-bottom: 2px;
}

.empty-title {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--m-text);
}

.empty-sub {
  max-width: 400px;
  font-size: 12px;
  color: var(--m-muted);
}

/* ==========================================================================
   Slide-Over Detail Drawer (Overview / Changelog / Capabilities / Discuss)
   ========================================================================== */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  justify-content: flex-end;
  z-index: 45;
}

.drawer-panel {
  width: min(540px, 96vw);
  height: 100%;
  background: var(--m-sheet-bg);
  backdrop-filter: blur(22px) saturate(145%);
  -webkit-backdrop-filter: blur(22px) saturate(145%);
  border-left: 1px solid var(--m-hairline-strong);
  box-shadow: var(--m-shadow-sheet);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: agy-drawer-in var(--m-dur-slow) var(--m-ease-out);
}

.drawer-hero {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--m-hairline);
  background: var(--m-sheen);
  display: flex;
  flex-direction: column;
  gap: 11px;
  flex-shrink: 0;
}

.drawer-hero-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.drawer-hero-info {
  flex: 1;
  min-width: 0;
}

.drawer-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0 0 3px;
  color: var(--m-text);
  word-break: break-word;
}

.drawer-subtitle {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--m-muted);
}

.drawer-cta-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.drawer-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 7px 16px;
  border-bottom: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}

.drawer-tabs::-webkit-scrollbar {
  display: none;
}

.drawer-tab {
  border: 1px solid transparent;
  background: transparent;
  color: var(--m-muted);
  padding: 5px 10px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 11.8px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  transition: all var(--m-dur-fast) var(--m-ease-out);
}

.drawer-tab:hover {
  color: var(--m-text);
  background: var(--m-ctl-bg);
}

.drawer-tab.active {
  background: var(--m-card-bg-hover);
  border-color: var(--m-hairline-strong);
  color: var(--m-text);
}

.drawer-body {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Capabilities breakdown inside drawer */
.cap-detail-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cap-detail-card {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.cap-detail-desc {
  font-size: 11.8px;
  color: var(--m-muted);
  margin: 0;
}

.meta-kv {
  display: grid;
  grid-template-columns: 104px 1fr;
  gap: 6px 10px;
  font-size: 11.5px;
  padding: 11px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  word-break: break-all;
}

.meta-kv-val {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.mono {
  font-family: var(--m-mono);
  font-size: 11px;
}

/* Discussions tab inside drawer */
.discuss-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.discuss-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.discuss-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 11px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  text-decoration: none;
  color: inherit;
  transition: border-color var(--m-dur-fast) var(--m-ease-out), background var(--m-dur-fast) var(--m-ease-out);
}

.discuss-item:hover {
  border-color: var(--m-accent-border);
  background: var(--m-card-bg-hover);
}

.discuss-item-title {
  font-weight: 650;
  font-size: 12.6px;
  color: var(--m-text);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.discuss-item-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--m-muted);
}

.discuss-cat-pill {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6.5px;
  border-radius: var(--m-r-pill);
  background: var(--m-accent-soft);
  color: var(--m-accent-bright);
  border: 1px solid var(--m-accent-border);
}

.discuss-info-box {
  padding: 14px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* Changelog tab card */
.changelog-banner {
  padding: 11px 13px;
  border-radius: var(--m-r-md);
  background: var(--m-sky-soft);
  border: 1px solid var(--m-sky-border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.changelog-banner.is-upstream {
  background: var(--m-warn-soft);
  border-color: var(--m-warn-border);
}

/* ==========================================================================
   Settings / Sources Panel
   ========================================================================== */

.settings-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 680px;
}

.field-card {
  background: var(--m-sheen), var(--m-card-bg);
  border: 1px solid var(--m-hairline);
  border-radius: var(--m-r-lg);
  padding: 14px 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: inset 0 1px 0 var(--m-specular), var(--m-shadow-card);
}

.field-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.field-label {
  font-weight: 700;
  font-size: 12.6px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.field-hint {
  font-size: 11.6px;
  color: var(--m-muted);
  margin: 0;
  line-height: 1.5;
}

.telemetry-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
}

.telemetry-cell {
  padding: 8px 10px;
  border-radius: var(--m-r-sm);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.telemetry-k {
  font-size: 10.5px;
  color: var(--m-muted);
}

.telemetry-v {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--m-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.token-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.token-row .text-input {
  flex: 1 1 auto;
}

/* ==========================================================================
   Modals & Reconnect Overlay
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: var(--m-backdrop);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 55;
}

.modal-box {
  background: var(--m-sheet-bg);
  border: 1px solid var(--m-hairline-strong);
  border-radius: var(--m-r-xl);
  width: 100%;
  max-width: 520px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--m-shadow-modal);
  animation: agy-modal-in 210ms var(--m-ease-spring);
}

.modal-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--m-hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 700;
  font-size: 13.5px;
}

.modal-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-body {
  padding: 14px 16px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 11px;
  font-size: 12.4px;
}

.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.escalation-item {
  padding: 10px 12px;
  border-radius: var(--m-r-md);
  background: var(--m-inset-bg);
  border: 1px solid var(--m-warn-border);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.escalation-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
}

.reconnect-card {
  max-width: 400px;
  text-align: center;
  padding: 26px 22px;
  align-items: center;
  gap: 12px;
}

.reconnect-orb {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--m-accent-soft);
  border: 1px solid var(--m-accent-border);
  color: var(--m-accent-bright);
  display: grid;
  place-items: center;
}

/* ==========================================================================
   Toast Bar
   ========================================================================== */

.toast-bar {
  position: fixed;
  bottom: 14px;
  right: 14px;
  left: 14px;
  max-width: 560px;
  margin-left: auto;
  background: var(--m-sheet-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--m-accent-border);
  border-radius: var(--m-r-md);
  padding: 10px 13px;
  box-shadow: var(--m-shadow-modal);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 65;
  animation: agy-toast-in 200ms var(--m-ease-out);
  font-size: 12.2px;
}

.toast-bar.tone-error {
  border-color: var(--m-danger-border);
}

.toast-bar.tone-ok {
  border-color: var(--m-ok-border);
}

.toast-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* ==========================================================================
   Safe Markdown Typography
   ========================================================================== */

.md-body {
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--m-text-2);
}

.md-h {
  margin: 14px 0 6px;
  color: var(--m-text);
  font-weight: 700;
  line-height: 1.35;
}

.md-h1 { font-size: 15.5px; padding-bottom: 5px; border-bottom: 1px solid var(--m-hairline); }
.md-h2 { font-size: 14px; }
.md-h3 { font-size: 13px; }
.md-p { margin: 6px 0; }
.md-ul, .md-ol { margin: 6px 0; padding-left: 19px; }
.md-ul li, .md-ol li { margin: 3px 0; }

.md-task {
  list-style: none;
  margin-left: -15px;
  display: flex;
  align-items: flex-start;
  gap: 7px;
}

.md-check {
  width: 14px;
  height: 14px;
  margin-top: 3px;
  border-radius: 4px;
  border: 1px solid var(--m-hairline-strong);
  display: inline-grid;
  place-items: center;
  font-size: 10px;
  flex-shrink: 0;
}

.md-check.is-checked {
  background: var(--m-ok-soft);
  border-color: var(--m-ok-border);
  color: var(--m-ok);
}

.md-code {
  font-family: var(--m-mono);
  font-size: 11.4px;
  background: var(--m-inset-bg);
  border: 1px solid var(--m-hairline);
  padding: 1px 5px;
  border-radius: 5px;
  color: var(--m-text);
}

.md-pre-wrap {
  margin: 8px 0;
  border-radius: var(--m-r-sm);
  border: 1px solid var(--m-hairline);
  background: var(--m-inset-bg);
  overflow: hidden;
}

.md-code-lang {
  font-family: var(--m-mono);
  font-size: 10px;
  color: var(--m-muted);
  padding: 4px 10px;
  border-bottom: 1px solid var(--m-hairline);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.md-pre {
  margin: 0;
  padding: 10px 12px;
  overflow-x: auto;
  font-family: var(--m-mono);
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--m-text);
}

.md-quote {
  margin: 8px 0;
  padding: 5px 11px;
  border-left: 3px solid var(--m-accent);
  background: var(--m-accent-soft);
  border-radius: 0 6px 6px 0;
  color: var(--m-text-2);
}

.md-link {
  color: var(--m-accent-bright);
  text-decoration: none;
  border-bottom: 1px dashed var(--m-accent-border);
}

.md-link:hover {
  border-bottom-style: solid;
}

.md-hr {
  border: none;
  border-top: 1px solid var(--m-hairline);
  margin: 12px 0;
}

.md-table-wrap {
  overflow-x: auto;
  margin: 8px 0;
  border-radius: var(--m-r-sm);
  border: 1px solid var(--m-hairline);
}

.md-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.6px;
}

.md-table th,
.md-table td {
  padding: 6px 9px;
  text-align: left;
  border-bottom: 1px solid var(--m-hairline);
}

.md-table th {
  background: var(--m-inset-bg);
  color: var(--m-text);
  font-weight: 650;
}

.md-img-alt {
  font-size: 11px;
  color: var(--m-muted);
  font-style: italic;
}

.muted {
  color: var(--m-muted);
}

/* ==========================================================================
   Container-Query Responsive Breakpoints (Sidecar Panel Width Aware)
   Uses `@container market` (DSH-market pattern) so narrow/medium/wide aux
   panes respond to the panel's actual width rather than the full IDE window.
   ========================================================================== */

@container market (max-width: 680px) {
  .app-header {
    padding: 9px 11px;
    gap: 8px;
  }

  .segmented-nav {
    order: 3;
    width: 100%;
  }

  .nav-pill {
    flex: 1;
    justify-content: center;
    padding: 5px 7px;
  }

  .brand-meta-pill {
    display: none;
  }
}

@container market (max-width: 480px) {
  .segmented-nav {
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-pill {
    padding: 5px 6px;
    font-size: 11.5px;
    gap: 4px;
  }

  .nav-pill .ui-ico {
    display: none;
  }

  .filter-bar {
    padding: 8px 11px;
  }

  .main-scroll {
    padding: 11px 11px 44px;
  }

  .cards-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  .self-update-banner {
    flex-direction: column;
    align-items: stretch;
    padding: 9px 11px;

function startReconnectPolling(targetVersion = '') {
  if (reconnectTimer) clearTimeout(reconnectTimer);
  const previousVersion = state.serverState?.plugin?.version || '';

    targetVersion,
    previousVersion,
    phase: 'restarting',
    attempts: 0,
    sawDown: false,
    timedOut: false,
  };
  render();

  const maxAttempts = 28;
  const poll = async () => {
    if (!state.reconnecting) return;
    state.reconnecting.attempts += 1;
    state.reconnecting.phase = 'polling';
    render();

    try {
      const fn = getFetchImpl();
      const res = await fn('/healthz', { method: 'GET', cache: 'no-store' });
      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        const versionChanged = Boolean(
          targetVersion && data?.version && String(data.version) === String(targetVersion),
        );
        const recovered =
          state.reconnecting.sawDown ||
          versionChanged ||
          state.reconnecting.attempts >= 3;
        if (recovered) {
          state.reconnecting = null;
          state.dismissedSelfVersion = '';
          writeDismissedSelfVersion('');
          render();
          await loadState(false);
          await checkUpdates(false, { silent: true });
          const versionBehind = Boolean(
            targetVersion && data?.version && String(data.version) !== String(targetVersion),
          );
          showToast(
            versionBehind
              ? t(
                  `服务已恢复 (v${data.version})，若界面未切换请刷新面板`,
                  `Reconnected (v${data.version}); reload pane if UI did not refresh`,
                )
              : t(
                  `AGY Market 已重启并恢复服务${data?.version ? ` (v${data.version})` : ''}`,
                  `AGY Market reconnected${data?.version ? ` (v${data.version})` : ''}`,
                ),
            { tone: 'ok' },
          );
          return;
        }
      } else {
        state.reconnecting.sawDown = true;
      }
    } catch {
      if (state.reconnecting) state.reconnecting.sawDown = true;
    }

    if (!state.reconnecting) return;
    if (state.reconnecting.attempts >= maxAttempts) {
      state.reconnecting.timedOut = true;
      render();
      return;
    }
    reconnectTimer = setTimeout(poll, 900);
  };

  reconnectTimer = setTimeout(poll, 700);
}

async function loadPluginDiscussions(pluginId, force = false) {
  if (!pluginId) return;
  const cached = state.discussionsCache[pluginId];
  if (!force && cached && (cached.loading || cached.data)) {
    return;
  }
  state.discussionsCache[pluginId] = { loading: true, data: cached?.data || null, error: '' };
  render();
  try {
    const res = await apiFetch(`/api/discussions?id=${encodeURIComponent(pluginId)}${force ? '&force=1' : ''}`);
    state.discussionsCache[pluginId] = {
      loading: false,
      data: {
        url: res.url || '',
        newDiscussionUrl: res.newDiscussionUrl || '',
        items: Array.isArray(res.items) ? res.items : [],
        disabled: Boolean(res.disabled),
        needsToken: Boolean(res.needsToken),
        rateLimited: Boolean(res.rateLimited),
      },
      error: res.ok === false ? res.error || '' : '',
    };
  } catch (err) {
    state.discussionsCache[pluginId] = {
      loading: false,
      data: null,
      error: err?.message || String(err),
    };
  } finally {
    render();
  }
}

async function updatePrefs(patch, successMsg = '') {
  try {
    state.loading = true;
    render();
    state.serverState = await apiFetch('/api/prefs', {
      method: 'POST',
      body: { ...patch, workspaceUris: state.workspaceUris },
    });
    syncDetailPluginReference();
    // Clear discussions cache if token changed so user sees newly unlocked threads immediately
    if ('githubToken' in patch || 'clearGithubToken' in patch) {
      state.discussionsCache = {};
    }
    showToast(successMsg || t('已保存源与网络加速设置', 'Saved catalog & mirror preferences'), { tone: 'ok' });
    if ('githubToken' in patch || 'clearGithubToken' in patch || 'primaryCatalogUrl' in patch || 'networkMode' in patch) {
      void checkUpdates(true, { silent: true });
    }
  } catch (err) {
    showToast(`${t('保存失败', 'Save error')}: ${err?.message || String(err)}`, { tone: 'error' });
  } finally {
    state.loading = false;
    render();
  }
}

async function copyText(text, key) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    state.copiedKey = key;
    render();
    setTimeout(() => {
      if (state.copiedKey === key) {
        state.copiedKey = '';
        render();
      }
    }, 1600);
  } catch {
    showToast(t('复制失败，请手动选中复制', 'Copy failed'), { tone: 'error' });
  }
}

function renderBadgesHtml(capabilities = {}, { maxCount = 0 } = {}) {
  const loc = getLocale();
  const badges = Array.isArray(capabilities?.badges) ? capabilities.badges : [];
  if (!badges.length) return '';

  const visible = maxCount > 0 && badges.length > maxCount ? badges.slice(0, maxCount) : badges;
  const hidden = maxCount > 0 && badges.length > maxCount ? badges.slice(maxCount) : [];

  const html = visible
    .map((id) => {
      const spec = CAPABILITY_BADGE_SPECS[id] || { tone: 'subtle', descZh: id, descEn: id };
      const label = cleanBadgeText(id, capabilities);
      const tip = loc === 'en' ? spec.descEn : spec.descZh;
      return `<span class="cap-badge tone-${escapeHtml(spec.tone)}" title="${escapeHtml(tip)}">${badgeIcon(id, 11)}<span>${escapeHtml(label)}</span></span>`;
    })
    .join('');

  if (hidden.length > 0) {
    const hiddenNames = hidden.map((id) => cleanBadgeText(id, capabilities)).join(' · ');
    return `${html}<span class="cap-badge is-more" title="${escapeHtml(hiddenNames)}">+${hidden.length}</span>`;
  }
  return html;
}

function renderLogoHtml(iconUrl, name, sizeClass = '') {

}

function getFilteredPlugins() {
  const list = state.serverState?.catalog?.plugins || [];
  const loc = getLocale();
  const q = state.search.trim().toLowerCase();

  const filtered = list.filter((p) => {
    if (state.category !== 'all') {
      const cats = p.taxonomy?.categories || [];
      if (!cats.includes(state.category)) return false;
    }
    if (!q) return true;
    const desc =
      typeof p.description === 'object'
        ? `${p.description.zh || ''} ${p.description.en || ''}`
        : String(p.description || '');
    const hay = `${p.displayName || ''} ${p.canonicalName || ''} ${p.scopedName || ''} ${p.id || ''} ${desc} ${(p.taxonomy?.tags || []).join(' ')} ${(p.capabilities?.badges || []).join(' ')}`.toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => {
    if (state.sortBy === 'updated') {
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    }
    if (state.sortBy === 'name') {
      return String(a.displayName || a.canonicalName).localeCompare(String(b.displayName || b.canonicalName), loc);
    }
    return Number(b.repository?.stars || 0) - Number(a.repository?.stars || 0);
  });

  return filtered;
}

function getCategoryCounts() {
  const plugins = state.serverState?.catalog?.plugins || [];
  const counts = { all: plugins.length };
  for (const p of plugins) {
    for (const c of p.taxonomy?.categories || []) {
      counts[c] = (counts[c] || 0) + 1;
    }
  }
  return counts;
}

function renderInstalledView() {
  const installed = state.serverState?.installed || [];
  const { byId: updById, byDir: updByDir } = getUpdateMaps();

  const allUpdates = getEffectiveUpdateItems();
  const installableUpds = getInstallableUpdates();
  const upstreamOnlyCount = allUpdates.length - installableUpds.length;
  const checkedLabel = state.updates.checkedAt
    ? t(`上次检查：${formatRelativeTime(state.updates.checkedAt)}`, `Last checked ${formatRelativeTime(state.updates.checkedAt)}`)
    : t('正在自动检查远程更新…', 'Checking remote updates…');

  // 3-tier automatic ordering (DSH-market pattern): enabled -> updatable -> alphabetical
  const sortedInstalled = [...installed].sort((a, b) => {
    const aOn = a.enabled ? 1 : 0;
    const bOn = b.enabled ? 1 : 0;
    if (bOn !== aOn) return bOn - aOn;
    const ua = updByDir.get(a.dir) || (a.receipt?.id ? updById.get(a.receipt.id) : null);
    const ub = updByDir.get(b.dir) || (b.receipt?.id ? updById.get(b.receipt.id) : null);
    const sa = ua ? (ua.installable !== false ? 2 : 1) : 0;
    const sb = ub ? (ub.installable !== false ? 2 : 1) : 0;
    if (sb !== sa) return sb - sa;
    return String(a.displayName || a.dir).localeCompare(String(b.displayName || b.dir));
  });

  return `
    <div class="main-scroll">
      <section class="updates-command-bar ${allUpdates.length > 0 ? 'has-updates' : ''}">
        <div class="updates-command-top">
          <div class="updates-summary">
            <div class="updates-summary-title">
              ${allUpdates.length > 0 ? `<span style="color:var(--m-sky)">${icon('update', 15)}</span>` : `<span style="color:var(--m-ok)">${icon('checkCircle', 15)}</span>`}
              <span>${escapeHtml(
                state.updates.loading && !state.updates.checkedAt
                  ? t('正在检测插件更新…', 'Checking for plugin updates…')
                  : allUpdates.length > 0
                    ? t(`发现 ${allUpdates.length} 个插件更新`, `${allUpdates.length} plugin update(s) available`)
                    : t(`已安装 ${installed.length} 个插件，全部为最新`, `${installed.length} installed — all up to date`),
              )}</span>
            </div>
            <div class="updates-summary-sub">
              <span>${escapeHtml(checkedLabel)}</span>
              ${upstreamOnlyCount > 0 ? `<span>· ${escapeHtml(t(`${upstreamOnlyCount} 个上游新版待目录同步`, `${upstreamOnlyCount} upstream awaiting sync`))}</span>` : ''}
            </div>
          </div>

          <div class="updates-command-actions">
            <button class="btn btn-sm" data-action="check-updates" ${state.updates.loading ? 'disabled' : ''}>
              ${icon('refresh', 12, state.updates.loading ? 'spin' : '')}
              ${escapeHtml(t('检查更新', 'Check Now'))}
            </button>
            ${
              installableUpds.length > 0
                ? `<button class="btn btn-update btn-sm" data-action="update-all" ${state.batchUpdating ? 'disabled' : ''}>
                    ${state.batchUpdating ? icon('refresh', 12, 'spin') : icon('update', 12)}
                    ${escapeHtml(
                      state.batchUpdating
                        ? t(`正在更新 (${state.batchTargetIds.length})…`, `Updating (${state.batchTargetIds.length})…`)
                        : t(`全部更新 (${installableUpds.length})`, `Update All (${installableUpds.length})`),
                    )}
                  </button>`
                : ''
            }
          </div>
        </div>

        ${state.batchUpdating || state.updates.loading ? `<div class="progress-track"><div class="progress-fill"></div></div>` : ''}

        ${
          state.updates.rateLimited
            ? `<div class="notice-strip">
                <span>${icon('alertCircle', 13)} ${escapeHtml(t('GitHub API 匿名请求已限流，可在「源与设置」配置 GitHub Token 解除限额。', 'GitHub API rate limit reached. Add an optional GitHub Token in Sources & Settings.'))}</span>
                <button class="btn btn-sm" data-action="goto-token">${escapeHtml(t('去配置', 'Configure'))}</button>
              </div>`
            : ''
        }

        ${renderBatchResultsPanel()}
      </section>

      ${
        state.loading && installed.length === 0
          ? renderSkeletonGrid(3)
          : sortedInstalled.length === 0
            ? `<div class="empty-state">
                <div class="empty-icon">${icon('package', 20)}</div>
                <div class="empty-title">${escapeHtml(t('尚未检测到已安装的插件', 'No local plugins detected yet'))}</div>
                <div class="empty-sub">${escapeHtml(t('前往「探索」标签浏览并一键安装社区插件。', 'Browse the Discover tab to install community plugins with one click.'))}</div>
                <button class="btn btn-primary btn-sm" data-action="tab" data-tab="discover">${escapeHtml(t('探索插件市场', 'Explore Market'))}</button>
              </div>`
            : `<div class="cards-grid">
                ${sortedInstalled
                  .map((loc) => {
                    const upd = updByDir.get(loc.dir) || (loc.receipt?.id ? updById.get(loc.receipt.id) : null);
                    const catEntry = (upd && catById.get(upd.id)) || (loc.receipt?.id && catById.get(loc.receipt.id)) || catByDir.get(loc.dir) || null;
                    const canCatalogUpdate = Boolean(upd && upd.installable !== false && catEntry);
                    const isUpstreamOnly = Boolean(upd && upd.installable === false);
                    const isBusy = Boolean(
                      catEntry && (state.busyId === catEntry.id || (state.batchUpdating && state.batchTargetIds.includes(catEntry.id))),
                    );
                    const discussUrl = deriveDiscussionsUrl(catEntry?.repository?.url || loc.repositoryUrl);
                    const badgesObj = catEntry?.capabilities || loc.receipt?.grantedCapabilities || { badges: [] };

                    let actionHtml = '';
                    if (isBusy) {
                      actionHtml = `<button class="btn btn-primary btn-sm" disabled>${icon('refresh', 12, 'spin')} ${escapeHtml(t('更新中…', 'Updating…'))}</button>`;
                    } else if (canCatalogUpdate) {
                      actionHtml = `<button class="btn btn-update-outline btn-sm" data-action="install" data-id="${escapeHtml(catEntry.id)}">${icon('update', 12)} ${escapeHtml(t(`更新 v${upd.latestVersion}`, `Update v${upd.latestVersion}`))}</button>`;
                    } else if (isUpstreamOnly && upd.releaseUrl) {
                      actionHtml = `<a class="btn btn-upstream btn-sm" href="${escapeHtml(upd.releaseUrl)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(t('上游 GitHub 有新版，等待目录同步', 'Available upstream, awaiting catalog sync'))}">${escapeHtml(t(`上游 v${upd.latestVersion}`, `Upstream v${upd.latestVersion}`))} ${icon('arrowUpRight', 12)}</a>`;
                    } else {
                      actionHtml = `<span class="state-pill is-enabled">${icon('check', 11)} ${escapeHtml(t('最新', 'Latest'))}</span>`;
                    }

                    return `
                      <article class="plugin-card ${canCatalogUpdate ? 'has-update' : ''}">
                        <div class="card-head" data-action="detail-local" data-dir="${escapeHtml(loc.dir)}">
                          ${renderLogoHtml(catEntry?.media?.iconUrl, loc.displayName)}
                          <div class="card-title-wrap">
                            <div class="card-title-row">
                              <span class="card-title" title="${escapeHtml(loc.displayName)}">${escapeHtml(loc.displayName)}</span>
                              ${
                                upd
                                  ? `<span class="version-delta ${isUpstreamOnly ? 'is-upstream' : ''}">v${escapeHtml(loc.version)} → v${escapeHtml(upd.latestVersion)}</span>`
                                  : `<span class="version-tag">v${escapeHtml(loc.version)}</span>`
                              }
                            </div>
                            <div class="card-meta">
                              <span class="card-slug">${escapeHtml(loc.dir)}</span>
                              <span class="meta-sep">·</span>
                              <span class="state-pill ${loc.enabled ? 'is-enabled' : 'is-disabled'}">${escapeHtml(loc.enabled ? t('已启用', 'Enabled') : t('已停用', 'Disabled'))}</span>
                              ${upd?.changelog ? `<span class="meta-sep">·</span><button type="button" class="notes-link" data-action="detail-local" data-dir="${escapeHtml(loc.dir)}" data-detail-tab="changelog">${escapeHtml(t('更新内容 ›', 'Notes ›'))}</button>` : `<span class="meta-sep">·</span><span>${escapeHtml(loc.scope)}</span>`}
                            </div>
                          </div>
                        </div>

                        <p class="card-desc" data-action="detail-local" data-dir="${escapeHtml(loc.dir)}">${escapeHtml(
                          loc.description ||
                            (typeof catEntry?.description === 'object'
                              ? catEntry.description[getLocale()] || catEntry.description.zh || ''
                              : catEntry?.description || ''),
                        )}</p>

                        ${badgesObj?.badges?.length ? `<div class="badge-row">${renderBadgesHtml(badgesObj, { maxCount: 3 })}</div>` : ''}

                        <div class="card-foot">
                          <div class="foot-links">
                            ${loc.sidecarPane?.uri ? `<a class="ghost-link is-accent" href="${escapeHtml(loc.sidecarPane.uri)}">${icon('panel', 12)} ${escapeHtml(t('面板', 'Pane'))}</a>` : ''}
                            <a class="ghost-link" href="${escapeHtml(loc.customizationUri)}">${icon('sliders', 12)} ${escapeHtml(t('管理', 'Manage'))}</a>
                            ${discussUrl ? `<a class="ghost-link" href="${escapeHtml(discussUrl)}" target="_blank" rel="noopener noreferrer" title="GitHub Discussions">${icon('message', 12)} ${escapeHtml(t('讨论', 'Discuss'))}</a>` : ''}
                          </div>
                          ${actionHtml}
                        </div>
                      </article>
                    `;
                  })
                  .join('')}
              </div>`
      }
    </div>
  `;
}

            <div class="telemetry-cell">
              <span class="telemetry-k">${escapeHtml(t('客户端版本', 'Client Version'))}</span>

            <div class="telemetry-cell">
              <span class="telemetry-k">${escapeHtml(t('更新检查', 'Update Check'))}</span>

        <div class="field-card">

            <span class="state-pill ${hasToken ? 'is-enabled' : 'is-disabled'}">

              placeholder="${escapeHtml(hasToken ? t('已保存 Token（留空则保持不变，输入新值可替换）', 'Token saved (leave blank to keep, or enter new token)') : 'ghp_... / github_pat_...')}"
            />
            ${

            <option value="china-mirror" ${prefs.networkMode === 'china-mirror' ? 'selected' : ''}>${escapeHtml(t('国内镜像优先 (npmmirror / 腾讯云)', 'China Mirror Priority (npmmirror / Tencent)'))}</option>
            <option value="direct" ${prefs.networkMode === 'direct' ? 'selected' : ''}>${escapeHtml(t('仅直连主源 (Direct Only)', 'Direct Primary Only'))}</option>

        <div class="field-card">

        <div style="display:flex;align-items:center;gap:8px">
          <button type="submit" class="btn btn-primary">${icon('check', 13)} ${escapeHtml(t('保存并重新同步目录', 'Save & Revalidate Catalog'))}</button>
        </div>
      </form>
    </div>
  `;
}
