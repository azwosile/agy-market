<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY Market — Google Antigravity 社区可视化插件市场</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-badge">Zero-Token Sidecar · SHA-256 Verified · Non-npm Language Agnostic</div>
      <h1>AGY Market · 反重力插件市场</h1>
      <p class="hero-lead">
        在 Google Antigravity 右侧辅助面板内一键浏览、搜索与安装社区插件（Markdown 技能、Python/Rust/Go/Node MCP 服务与 Sidecar 面板），内置双轨自动收录与国内高速镜像兜底。
      </p>

      <div class="bootstrap-box">
        <div class="boot-tabs">
          <button class="boot-tab active" data-cmd="npx agy-market@latest">npx 一行安装</button>
          <button class="boot-tab" data-cmd="irm https://github.com/azwosile/agy-market/releases/latest/download/install.ps1 | iex">Windows PowerShell (零 npm)</button>
          <button class="boot-tab" data-cmd="curl -fsSL https://github.com/azwosile/agy-market/releases/latest/download/install.sh | sh">macOS / Linux Shell</button>
        </div>
        <div class="boot-code-row">
          <code id="boot-cmd-text">npx agy-market@latest</code>
          <button id="copy-boot-btn" class="copy-btn">复制命令</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls-bar">
      <input id="site-search" type="search" placeholder="搜索社区插件、分类或能力标签…" />
      <select id="site-category">
        <option value="all">全部分类</option>
        <option value="productivity">效率与工作流</option>
        <option value="ui-themes">界面与主题美化</option>
        <option value="developer-tools">开发者工具</option>
        <option value="mcp-integrations">MCP 服务集成</option>
        <option value="skills-workflows">技能与自动化</option>
      </select>
      <input id="site-feed-url" type="url" value="https://azwosile.github.io/agy-market-catalog/index.json" title="Catalog index.json URL" />
      <button id="site-load-btn" class="load-btn">同步目录</button>
    </section>

    <section id="site-grid" class="grid"></section>
  </main>

  <footer class="site-footer">
    <span>AGY Market Suite · MIT License · 提交插件 PR 请前往 <a href="https://github.com/azwosile/agy-market-catalog" target="_blank" rel="noopener noreferrer" style="color:inherit"><code>azwosile/agy-market-catalog</code></a></span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
