<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="苍蓝协奏台——外部模型调度与省流">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091122"/>
      <stop offset="100%" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="84%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="14%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="outerClip">
      <rect x="2" y="2" width="1196" height="276" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect x="2" y="2" width="1196" height="276" rx="22" fill="url(#bgGrad)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#gridPat)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#glow1)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#glow2)"/>

    <!-- Top accent ribbon -->
    <rect x="2" y="2" width="1196" height="4" fill="url(#accentGrad)"/>

    <!-- Decorative right orbital rings -->
    <g opacity="0.22" transform="translate(1045, 140)">
      <circle cx="0" cy="0" r="118" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-dasharray="6 8"/>
      <circle cx="0" cy="0" r="84" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 5"/>
      <circle cx="-84" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="59" cy="-59" r="3.5" fill="#6366f1"/>
    </g>

    <!-- Left glass icon badge -->
    <g transform="translate(46, 84)">
      <rect width="104" height="104" rx="24" fill="rgba(15,23,42,0.72)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      <g transform="translate(4, 4)">
        
        <circle cx="48" cy="48" r="10" fill="url(#accentGrad)"/>
        <circle cx="22" cy="26" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <circle cx="74" cy="26" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <circle cx="22" cy="70" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <circle cx="74" cy="70" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.6"/>
        <line x1="27" y1="30" x2="40" y2="41" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="69" y1="30" x2="56" y2="41" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="27" y1="66" x2="40" y2="55" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="69" y1="66" x2="56" y2="55" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="48" cy="48" r="28" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>
      
      </g>
    </g>

    <!-- Eyebrow pill -->
    <g transform="translate(176, 48)">
      <rect width="388" height="26" rx="13" fill="rgba(30,41,59,0.78)" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.65"/>
      <text x="16" y="17.2" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">苍蓝套件 AZURE SUITE  ·  GOOGLE ANTIGRAVITY 原生插件</text>
    </g>

    <!-- Main Title -->
    <text x="176" y="128" font-size="33" font-weight="800" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">苍蓝协奏台——外部模型调度与省流</text>

    <!-- Secondary Title -->
    <text x="176" y="160" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">External Orchestrator — Multi-Model Worker Router</text>

    <!-- Subtitle -->
    <text x="176" y="196" font-size="15.5" font-weight="500" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">多渠道外部模型协同调度 · 自定义角色路由 · 自动容灾断路器 · 全链路监控</text>

    <!-- Feature pills -->
    
        <g transform="translate(176, 216)">
          <rect width="112" height="30" rx="15" fill="rgba(30,41,59,0.78)" stroke="rgba(148,163,184,0.28)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">零第三方依赖</text>
        </g>
        <g transform="translate(300, 216)">
          <rect width="126" height="30" rx="15" fill="rgba(30,41,59,0.78)" stroke="rgba(148,163,184,0.28)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">自定义调度角色</text>
        </g>
        <g transform="translate(438, 216)">
          <rect width="146" height="30" rx="15" fill="rgba(30,41,59,0.78)" stroke="rgba(148,163,184,0.28)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Neko Glass 面板</text>
        </g>
  </g>

  <rect x="2" y="2" width="1196" height="276" rx="22" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1.5"/>
