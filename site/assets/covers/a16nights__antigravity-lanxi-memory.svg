    <!-- Subtitle -->
    <text x="176" y="196" font-size="15.5" font-weight="500" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">五层纯 Markdown 真源记忆 · CJK FTS5 · 潮汐遗忘曲线 · 交互式星海图谱</text>

    <!-- Feature pills -->
    
        <g transform="translate(176, 216)">
