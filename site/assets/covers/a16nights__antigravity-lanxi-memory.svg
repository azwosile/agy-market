      <circle cx="0" cy="0" r="84" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 5"/>
      <circle cx="-84" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="59" cy="-59" r="3.5" fill="#a855f7"/>
