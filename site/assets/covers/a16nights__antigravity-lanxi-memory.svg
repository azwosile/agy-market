    <!-- Left glass icon badge -->
    <g transform="translate(46, 84)">
      <rect width="104" height="104" rx="24" fill="rgba(15,23,42,0.72)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      <g transform="translate(4, 4)">
        
        <circle cx="48" cy="48" r="29" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.55"/>
        <circle cx="48" cy="48" r="18" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" opacity="0.8"/>
        <circle cx="48" cy="48" r="7" fill="url(#accentGrad)"/>
        <circle cx="30" cy="30" r="4.5" fill="url(#accentGrad)"/>
        <circle cx="70" cy="34" r="4" fill="url(#accentGrad)"/>
        <circle cx="64" cy="69" r="4.5" fill="url(#accentGrad)"/>
        <circle cx="26" cy="62" r="3.5" fill="#38bdf8"/>
        <line x1="34" y1="34" x2="43" y2="43" stroke="url(#accentGrad)" stroke-width="1.8"/>
        <line x1="66" y1="36" x2="54" y2="44" stroke="url(#accentGrad)" stroke-width="1.8"/>
        <line x1="61" y1="65" x2="52" y2="54" stroke="url(#accentGrad)" stroke-width="1.8"/>
        <line x1="30" y1="60" x2="42" y2="52" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
      
      </g>
    </g>

    <!-- Eyebrow pill -->
    <g transform="translate(176, 48)">
      <rect width="388" height="26" rx="13" fill="rgba(30,41,59,0.78)" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.65"/>
      <text x="16" y="17.2" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">苍蓝套件 AZURE SUITE  ·  GOOGLE ANTIGRAVITY 原生插件</text>
