    <!-- Main Title -->
    <text x="176" y="128" font-size="36" font-weight="800" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">蓝汐——认知图谱长期记忆</text>

    <!-- Secondary Title -->
