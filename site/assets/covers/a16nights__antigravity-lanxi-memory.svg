          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">磁盘即真源</text>
        </g>
        <g transform="translate(286, 216)">
          <rect width="140" height="30" rx="15" fill="rgba(30,41,59,0.78)" stroke="rgba(148,163,184,0.28)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">潮汐遗忘与硬保护</text>
        </g>
        <g transform="translate(438, 216)">
          <rect width="126" height="30" rx="15" fill="rgba(30,41,59,0.78)" stroke="rgba(148,163,184,0.28)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">交互式星海图谱</text>
