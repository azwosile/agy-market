          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">注入内容实时预览</text>
