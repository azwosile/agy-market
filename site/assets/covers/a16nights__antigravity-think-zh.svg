      <circle cx="0" cy="0" r="84" fill="none" stroke="#06b6d4" stroke-width="1"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 5"/>
      <circle cx="-84" cy="0" r="4" fill="#06b6d4"/>
      <circle cx="59" cy="-59" r="3.5" fill="#10b981"/>
