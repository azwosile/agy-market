        <circle cx="34" cy="70" r="4" fill="url(#accentGrad)"/>
        <circle cx="25" cy="76" r="2.4" fill="#06b6d4" opacity="0.8"/>
        <text x="48" y="49" text-anchor="middle" font-size="22" font-weight="700" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">思</text>
      
      </g>
