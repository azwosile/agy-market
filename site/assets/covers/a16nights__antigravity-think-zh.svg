          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">首字起中文推理</text>
        </g>
        <g transform="translate(314, 216)">
